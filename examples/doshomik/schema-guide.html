/* ============================================================
   Map: connected diagrams (added; the views above are unchanged)
   #diagram          the areas and how many links join them
   #diagram/<area>   one area's tables and the tables they link to
   #diagram/table/x  one table: what it points to, what points to it
   #diagram/all      every table at once
   ============================================================ */
const AREA_ORDER = DOMAINS.map((d) => d.id);
const areaColor = (id) => `var(--a${AREA_INDEX[id] % 12})`;
const tint = (id, pct = 12) => `color-mix(in srgb, var(--a${AREA_INDEX[id] % 12}) ${pct}%, var(--surface))`;
const TABLE_H = 30;
const tableW = (label) => Math.round(label.length * 7.8 + 26);

/** One line per pair of tables, even when they are linked by two columns (follows, notifications…). */
function pairEdges(edges) {
  const pairs = new Map();
  for (const e of edges) {
    const key = `${e.from}>${e.to}`;
    if (!pairs.has(key)) pairs.set(key, { from: e.from, to: e.to, d: e.d, cols: [] });
    pairs.get(key).cols.push(e.col);
  }
  return [...pairs.values()];
}

const RULE_SHORT = { cascade: 'deleted too', setnull: 'kept, link cleared', restrict: 'delete refused' };
const edgeTitle = (e) => `${e.from}.${e.cols.join(', ')} → ${e.to} (${RULE_SHORT[e.d]})`;

/** Where the line from `from` meets the border of box `to`, so arrows stay visible. */
function clipToBox(from, to) {
  const dx = from.x - to.x;
  const dy = from.y - to.y;
  if (!dx && !dy) return { x: to.x, y: to.y };
  const sx = (to.w / 2 + 4) / Math.abs(dx || 1e-9);
  const sy = (to.h / 2 + 4) / Math.abs(dy || 1e-9);
  const s = Math.min(sx, sy);
  return { x: to.x + dx * s, y: to.y + dy * s };
}

/**
 * A small, deterministic force layout: nodes repel, links pull, and each node is drawn toward
 * an anchor (its area's place), then overlapping boxes are pushed apart.
 */
function forceLayout(nodes, links, W, H, options = {}) {
  const iterations = options.iterations || 450;
  const length = options.length || 130;
  const repel = options.repel || 16000;
  const byId = new Map(nodes.map((n) => [n.id, n]));
  nodes.forEach((n, i) => {
    if (n.x == null) {
      const a = (i / nodes.length) * 2 * Math.PI;
      n.x = W / 2 + Math.cos(a) * W * 0.3;
      n.y = H / 2 + Math.sin(a) * H * 0.3;
    }
    n.vx = 0;
    n.vy = 0;
  });
  const pairs = links.map((l) => [byId.get(l.from), byId.get(l.to)]).filter(([a, b]) => a && b && a !== b);
  const clamp = (n) => {
    n.x = Math.max(n.w / 2 + 10, Math.min(W - n.w / 2 - 10, n.x));
    n.y = Math.max(n.h / 2 + 10, Math.min(H - n.h / 2 - 10, n.y));
  };
  for (let it = 0; it < iterations; it++) {
    const cool = 1 - it / iterations;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const d2 = dx * dx + dy * dy || 0.01;
        const d = Math.sqrt(d2);
        const f = repel / d2;
        dx /= d;
        dy /= d;
        a.vx -= dx * f;
        a.vy -= dy * f;
        b.vx += dx * f;
        b.vy += dy * f;
      }
    }
    for (const [a, b] of pairs) {
      let dx = b.x - a.x;
      let dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - length) * 0.02;
      dx /= d;
      dy /= d;
      a.vx += dx * f;
      a.vy += dy * f;
      b.vx -= dx * f;
      b.vy -= dy * f;
    }
    for (const n of nodes) {
      const [ax, ay, k] = options.anchor ? options.anchor(n) : [W / 2, H / 2, 0.01];
      n.vx += (ax - n.x) * k;
      n.vy += (ay - n.y) * k;
      n.x += Math.max(-30, Math.min(30, n.vx * cool));
      n.y += Math.max(-30, Math.min(30, n.vy * cool));
      n.vx *= 0.5;
      n.vy *= 0.5;
      clamp(n);
    }
  }
  for (let pass = 0; pass < 200; pass++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        const ox = (a.w + b.w) / 2 + 12 - Math.abs(a.x - b.x);
        const oy = (a.h + b.h) / 2 + 12 - Math.abs(a.y - b.y);
        if (ox > 0 && oy > 0) {
          moved = true;
          if (ox < oy * 2.5) {
            const s = ((a.x <= b.x ? -1 : 1) * ox) / 2;
            a.x += s;
            b.x -= s;
          } else {
            const s = ((a.y <= b.y ? -1 : 1) * oy) / 2;
            a.y += s;
            b.y -= s;
          }
          clamp(a);
          clamp(b);
        }
      }
    }
    if (!moved) break;
  }
}

/** Pushes overlapping boxes apart; nodes marked `fixed` don't move. */
function resolveOverlaps(nodes, gap = 12) {
  for (let pass = 0; pass < 300; pass++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        const ox = (a.w + b.w) / 2 + gap - Math.abs(a.x - b.x);
        const oy = (a.h + b.h) / 2 + gap - Math.abs(a.y - b.y);
        if (ox <= 0 || oy <= 0) continue;
        moved = true;
        const share = a.fixed ? [0, 1] : b.fixed ? [1, 0] : [0.5, 0.5];
        const dir = a.y <= b.y ? -1 : 1;
        a.y += dir * oy * share[0];
        b.y -= dir * oy * share[1];
      }
    }
    if (!moved) break;
  }
}

/** Draws boxes and lines. `viewBox` is "x y w h". Lines are drawn first so boxes sit on top. */
/** Markers, lines and boxes for a set of nodes and links (shared by the fixed maps and the canvas). */
function graphParts(nodes, links) {
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const markers = ['cascade', 'setnull', 'restrict', 'mixed']
    .map(
      (r) =>
        `<marker id="m-${r}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--${r === 'mixed' ? 'muted' : r})"/></marker>`,
    )
    .join('');
  const lines = links
    .map((l) => {
      const a = byId.get(l.from);
      const b = byId.get(l.to);
      if (!a || !b) return '';
      const cls = `edge e-${l.d}`;
      const title = `<title>${esc(l.title || '')}</title>`;
      if (a === b) {
        // A table that points to itself (comments.parent_id): a loop above the box.
        const x = a.x + a.w / 2 - 18;
        const y = a.y - a.h / 2;
        return `<g class="${cls}" data-a="${a.id}" data-b="${b.id}">${title}<path d="M${x - 14},${y} C${x - 14},${y - 34} ${x + 26},${y - 34} ${x + 26},${y - 2}" marker-end="url(#m-${l.d})"/></g>`;
      }
      const p1 = clipToBox(b, a);
      const p2 = clipToBox(a, b);
      const marker = l.d === 'area' ? '' : ` marker-end="url(#m-${l.d})"`;
      const width = l.width ? ` style="stroke-width:${l.width}"` : '';
      const at = l.labelAt ?? 0.5;
      const mid = { x: p1.x + (p2.x - p1.x) * at, y: p1.y + (p2.y - p1.y) * at };
      const text = l.label ? `<text x="${mid.x}" y="${mid.y}" text-anchor="middle" dominant-baseline="central" class="${l.d === 'area' ? 'count' : ''}">${esc(l.label)}</text>` : '';
      return `<g class="${cls}" data-a="${a.id}" data-b="${b.id}">${title}<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"${marker}${width}/>${text}</g>`;
    })
    .join('');
  const boxes = nodes
    .map((n) => {
      const cls = `node${n.muted ? ' muted' : ''}${n.center ? ' center' : ''}`;
      const style = `stroke:${n.color};fill:${n.fill || 'var(--surface)'}`;
      const textY = n.sub ? n.y - 8 : n.y;
      return `<a href="${n.href}" class="${cls}" data-node="${esc(n.id)}"><title>${esc(n.title || n.label)}</title>
        <rect x="${(n.x - n.w / 2).toFixed(1)}" y="${(n.y - n.h / 2).toFixed(1)}" width="${n.w}" height="${n.h}" rx="${n.h > TABLE_H ? 12 : 8}" style="${style}"/>
        <text x="${n.x}" y="${textY}" text-anchor="middle" dominant-baseline="central" class="${n.mono ? 'mono' : ''}">${esc(n.label)}</text>
        ${n.sub ? `<text x="${n.x}" y="${n.y + 11}" text-anchor="middle" dominant-baseline="central" class="sub">${esc(n.sub)}</text>` : ''}</a>`;
    })
    .join('');
  return { defs: markers, lines, boxes };
}

function svgGraph(nodes, links, viewBox, label) {
  const p = graphParts(nodes, links);
  return `<div class="map-wrap"><svg class="map" viewBox="${viewBox}" role="img" aria-label="${esc(label)}"><defs>${p.defs}</defs>${p.lines}${p.boxes}</svg></div>`;
}

/** The viewBox that fits every box, with a margin. */
function fitBox(nodes, pad = 40) {
  const minX = Math.min(...nodes.map((n) => n.x - n.w / 2)) - pad;
  const maxX = Math.max(...nodes.map((n) => n.x + n.w / 2)) + pad;
  const minY = Math.min(...nodes.map((n) => n.y - n.h / 2)) - pad - 20;
  const maxY = Math.max(...nodes.map((n) => n.y + n.h / 2)) + pad;
  return `${minX.toFixed(0)} ${minY.toFixed(0)} ${(maxX - minX).toFixed(0)} ${(maxY - minY).toFixed(0)}`;
}

const tableNode = (name, extra = {}) => ({
  id: name,
  label: name,
  w: tableW(name),
  h: TABLE_H,
  mono: true,
  href: `#diagram/table/${name}`,
  color: areaColor(byName[name].domain),
  title: `${name}: ${byName[name].purpose.replace(/<[^>]+>/g, '')}`,
  ...extra,
});

const areaKey = (ids = AREA_ORDER) =>
  `<div class="areakey">${ids.map((id) => `<span style="--c:${areaColor(id)}">${domainById[id].name}</span>`).join('')}</div>`;

/** Where each area sits on the overview, reused as the pull point for its tables on the bigger maps. */
function areaPlaces(W, H) {
  const places = HUB_AREA ? { [HUB_AREA]: [W / 2, H / 2] } : {};
  const ring = AREA_ORDER.filter((id) => id !== HUB_AREA);
  ring.forEach((id, i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / ring.length;
    places[id] = [W / 2 + Math.cos(a) * W * 0.36, H / 2 + Math.sin(a) * H * 0.36];
  });
  return places;
}

function mapTabs(current) {
  return `<nav class="tabs" aria-label="Map views">${[
    ['areas', 'Areas', '#diagram'],
    ['all', 'Every table', '#diagram/all'],
    ['layers', 'Layers', '#diagram/layers'],
    ['ownership', 'Ownership', '#diagram/ownership'],
    ['hubs', 'Most connected', '#diagram/hubs'],
    ['values', 'Values', '#diagram/values'],
  ]
    .map(([key, text, href]) => `<a href="${href}"${key === current ? ' aria-current="page"' : ''}>${text}</a>`)
    .join('')}</nav>`;
}

const mapHint = (text) => `<p class="hint">${text}</p>`;

function viewDiagram(a, b) {
  if (!a) return mapAreas();
  if (a === 'all') return mapAll();
  if (a === 'layers') return mapLayers();
  if (a === 'ownership') return mapOwnership();
  if (a === 'hubs') return mapHubs();
  if (a === 'values') return mapValues();
  if (a === 'table') return byName[b] ? mapTable(b) : viewNotFound();
  if (domainById[a]) return mapArea(a);
  return viewNotFound();
}

/** Level 1: the areas; a line's number is how many links join two areas. */
function mapAreas() {
  const W = 900;
  const H = 560;
  const places = areaPlaces(W, H);
  const nodes = AREA_ORDER.map((id) => {
    const d = domainById[id];
    const n = tablesIn(id).length;
    return {
      id,
      label: d.name,
      sub: count(n, 'table', 'tables'),
      x: places[id][0],
      y: places[id][1],
      w: Math.round(d.name.length * 8.6 + 40),
      h: 52,
      href: `#diagram/${id}`,
      color: areaColor(id),
      fill: tint(id, 14),
      title: `${d.name}: ${d.desc.replace(/<[^>]+>/g, '')}`,
    };
  });
  const between = new Map();
  for (const e of EDGES) {
    const x = byName[e.from].domain;
    const y = byName[e.to].domain;
    if (x === y) continue;
    const key = [x, y].sort().join('|');
    between.set(key, (between.get(key) || 0) + 1);
  }
  const links = [...between.entries()].map(([key, c]) => {
    const [x, y] = key.split('|');
    return { from: x, to: y, d: 'area', label: String(c), width: 1.4 + Math.sqrt(c) * 1.3, title: `${count(c, 'link', 'links')} between ${domainById[x].name} and ${domainById[y].name}` };
  });
  return `<section class="mapview">
    <h1>Map</h1>
    <p class="lede">How the parts of the database connect. Start with the areas, then open one.</p>
    ${mapTabs('areas')}
    ${svgGraph(nodes, links, `0 0 ${W} ${H}`, `The ${DOMAINS.length} areas and the links between them`)}
    ${mapHint('A thicker line means more links between two areas; the number is how many. Hover an area to see only its lines, or click it to open its tables.')}
  </section>`;
}

/** Level 2: one area's tables, and the outside tables they link to (grouped by area when there are many). */
function mapArea(id) {
  const d = domainById[id];
  const core = tablesIn(id).map((t) => t.name);
  const rel = pairEdges(EDGES.filter((e) => core.includes(e.from) || core.includes(e.to)));
  const outside = [...new Set(rel.flatMap((e) => [e.from, e.to]).filter((n) => !core.includes(n)))];
  const W = 960;
  const H = 640;
  const places = areaPlaces(W, H);
  const grouped = outside.length > 12;
  let nodes = core.map((n) => tableNode(n, { fill: tint(id, 10) }));
  let links;
  if (!grouped) {
    nodes = nodes.concat(outside.map((n) => tableNode(n, { muted: true })));
    links = rel.map((e) => ({ ...e, title: edgeTitle(e) }));
  } else {
    // Too many outside tables (users has 29): one box per outside area instead.
    const areaOf = (n) => (core.includes(n) ? n : `area:${byName[n].domain}`);
    const merged = new Map();
    for (const e of rel) {
      const from = areaOf(e.from);
      const to = areaOf(e.to);
      const key = `${from}>${to}`;
      if (!merged.has(key)) merged.set(key, { from, to, rules: new Set(), n: 0, names: [] });
      const m = merged.get(key);
      m.rules.add(e.d);
      m.n += e.cols.length;
      m.names.push(`${e.from}.${e.cols.join(', ')} → ${e.to}`);
    }
    links = [...merged.values()].map((m) => ({ from: m.from, to: m.to, d: m.rules.size === 1 ? [...m.rules][0] : 'mixed', label: m.n > 1 ? String(m.n) : '', width: 1.4 + Math.sqrt(m.n), title: m.names.join('\n') }));
    const outsideAreas = [...new Set(outside.map((n) => byName[n].domain))];
    nodes = nodes.concat(
      outsideAreas.map((aid) => {
        const names = outside.filter((n) => byName[n].domain === aid);
        const label = `${domainById[aid].name} (${names.length})`;
        return { id: `area:${aid}`, label, w: Math.round(label.length * 8 + 30), h: TABLE_H + 4, muted: true, href: `#diagram/${aid}`, color: areaColor(aid), title: names.join(', ') };
      }),
    );
  }
  forceLayout(nodes, links, W, H, {
    repel: 30000,
    length: 160,
    anchor: (n) => {
      const aid = n.id.startsWith('area:') ? n.id.slice(5) : byName[n.id].domain;
      if (aid === id) return [W / 2, H / 2, 0.012];
      const [x, y] = places[aid];
      return [x, y, 0.03];
    },
  });
  const mixed = links.some((l) => l.d === 'mixed');
  const keyIds = [...new Set([id, ...outside.map((n) => byName[n].domain)])];
  return `<section class="mapview">
    ${crumbs([['Tools', '#tools'], ['Map', '#diagram'], [d.name]])}
    <h1>${d.name}</h1>
    <p class="lede">The ${count(core.length, 'table', 'tables')} in this area are filled in; dashed boxes are tables elsewhere that ${grouped ? 'link to them, grouped by area' : 'they link to'}.</p>
    ${mapTabs('areas')}
    ${areaKey(keyIds)}
    ${legend()}
    ${canvasGraph(nodes, links, `Tables in ${d.name} and their links`)}
    ${mapHint(`Arrows point to the table being referred to.${mixed ? ' A grey line groups links with different delete rules; hover it to see each one.' : ''} Click a table to focus it; click it twice to put it in the middle.`)}
  </section>`;
}

/** Level 3: one table in the middle; what it points to on the left, what points to it on the right. */
function mapTable(name) {
  const t = byName[name];
  const parents = pairEdges(outOf(name).filter((e) => e.to !== name));
  const order = (n) => AREA_ORDER.indexOf(byName[n].domain);
  const children = pairEdges(into(name).filter((e) => e.from !== name)).sort((x, y) => order(x.from) - order(y.from) || x.from.localeCompare(y.from));
  const self = pairEdges(outOf(name).filter((e) => e.to === name));

  const center = tableNode(name, { x: 0, y: 0, center: true, fill: tint(t.domain, 22), w: tableW(name) + 16, h: 38 });
  const nodes = [center];
  // Neighbours sit on arcs; with many of them, every other box steps further out so labels don't collide.
  center.fixed = true;
  const place = (list, side) => {
    const n = list.length;
    const staggered = n > 12;
    const step = staggered ? 27 : 50;
    const half = ((n - 1) * step) / 2 || 1;
    list.forEach((item, i) => {
      const y = i * step - half;
      const bow = 70 * (1 - (y / half) ** 2); // the middle of the column bows away from the centre
      const x = 250 + bow + (staggered && i % 2 ? 230 : 0);
      nodes.push(tableNode(item, { x: side * x, y }));
    });
  };
  place(parents.map((e) => e.to), -1);
  place(children.map((e) => e.from), 1);

  resolveOverlaps(nodes);
  const showLabels = parents.length + children.length <= 14;
  // Labels go near the outer table, where lines are far apart.
  const links = [...parents, ...children, ...self].map((e) => ({
    ...e,
    title: edgeTitle(e),
    label: showLabels ? e.cols.join(', ') : '',
    labelAt: e.from === name ? 0.72 : 0.28,
  }));
  const domains = [...new Set(nodes.map((n) => byName[n.id].domain))];
  return `<section class="mapview">
    ${crumbs([['Tools', '#tools'], ['Map', '#diagram'], [domainById[t.domain].name, `#diagram/${t.domain}`], [name]])}
    <h1 class="table-title">${name}</h1>
    <p class="lede">${parents.length ? `Left: the ${count(parents.length, 'table', 'tables')} it points to.` : 'It points to no other table.'} ${
      children.length ? `Right: the ${count(children.length, 'table', 'tables')} that point to it.` : 'No other table points to it.'
    }</p>
    ${mapTabs('areas')}
    ${areaKey(domains)}
    ${legend()}
    ${svgGraph(nodes, links, fitBox(nodes), `${name} and the tables linked to it`)}
    ${mapHint(`Line colour says what happens on delete; hover a line for its column. Click any table to put it in the middle, or <a href="#table/${name}">open ${name}’s details</a>.`)}
  </section>`;
}

/** Every table on a canvas, pulled toward its area's place so areas form clusters. The space grows with the schema. */
function mapAll() {
  const W = Math.max(1180, Math.round(Math.sqrt(TABLES.length) * 200));
  const H = Math.round(W * 0.72);
  const places = areaPlaces(W, H);
  const nodes = TABLES.map((tb) => tableNode(tb.name, { fill: tint(tb.domain, 10) }));
  const links = pairEdges(EDGES).map((e) => ({ ...e, title: edgeTitle(e) }));
  forceLayout(nodes, links, W, H, {
    repel: 14000,
    length: 120,
    iterations: TABLES.length > 250 ? 220 : 450,
    anchor: (n) => {
      const [x, y] = places[byName[n.id].domain];
      return [x, y, byName[n.id].domain === HUB_AREA ? 0.012 : 0.03];
    },
  });
  return mapShell(
    'all',
    `All ${TABLES.length} tables and ${EDGES.length} links. Drag, zoom, and click a table to focus it.`,
    `${areaKey()}${legend()}${canvasGraph(nodes, links, 'Every table and every link')}
    ${mapHint('Tables of the same area sit together. Click a table twice to open its own map.')}`,
  );
}

/* Hover or keyboard focus on a box shows only its lines and neighbours. */
function mapFocus(svg, id) {
  svg.classList.add('focusing');
  const near = new Set([id]);
  svg.querySelectorAll('.edge').forEach((edge) => {
    const on = edge.dataset.a === id || edge.dataset.b === id;
    edge.classList.toggle('on', on);
    if (on) {
      near.add(edge.dataset.a);
      near.add(edge.dataset.b);
    }
  });
  svg.querySelectorAll('.node').forEach((node) => node.classList.toggle('on', near.has(node.dataset.node)));
}
function mapBlur(svg) {
  svg.classList.remove('focusing');
}
['mouseover', 'focusin'].forEach((type) =>
  document.addEventListener(type, (event) => {
    const node = event.target.closest && event.target.closest('.map:not(.is-canvas) .node');
    if (node) mapFocus(node.closest('svg'), node.dataset.node);
  }),
);
['mouseout', 'focusout'].forEach((type) =>
  document.addEventListener(type, (event) => {
    const node = event.target.closest && event.target.closest('.map:not(.is-canvas) .node');
    if (node && !(event.relatedTarget && node.contains(event.relatedTarget))) mapBlur(node.closest('svg'));
  }),
);

/* ============================================================
   Map: canvas and analysis views (added)
   #diagram/all         every table on a canvas: drag, zoom, click to focus
   #diagram/<area>      an area's tables on the same canvas
   #diagram/layers      dependency levels: what must exist before what
   #diagram/ownership   cascade trees: whose rows go with whom
   #diagram/hubs        the most connected tables
   #diagram/values      the value lists of status and type columns
   ============================================================ */

/** The canvas of the current view (nodes with positions, links), read by initCanvas() after rendering. */
let CANVAS = null;

/** Same markup as svgGraph, inside a pan-and-zoom viewport with a toolbar and a details panel. */
function canvasGraph(nodes, links, label) {
  const parts = graphParts(nodes, links);
  CANVAS = { nodes, links, byId: new Map(nodes.map((n) => [n.id, n])) };
  return `<div class="canvas-wrap" data-canvas tabindex="0" aria-label="${esc(label)}. Drag to move, scroll to zoom, click a table.">
    <div class="canvas-tools">
      <button type="button" data-zoom="in" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button type="button" data-zoom="out" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button type="button" class="wide" data-zoom="fit" title="Show everything (0)">Fit</button>
      <span class="zoom-level" data-zoom-level>100%</span>
      <input class="canvas-find" type="search" list="canvas-list" placeholder="Find a table" aria-label="Find a table" data-canvas-find>
      <datalist id="canvas-list">${nodes.filter((n) => byName[n.id]).map((n) => `<option value="${n.id}"></option>`).join('')}</datalist>
    </div>
    <svg class="map is-canvas" role="img" aria-label="${esc(label)}"><defs>${parts.defs}</defs><g class="viewport">${parts.lines}${parts.boxes}</g></svg>
    <aside class="canvas-panel" data-canvas-panel aria-live="polite">${canvasPanel(null)}</aside>
    <p class="canvas-help"><span>Drag to move</span><span>Scroll to zoom</span><span>Click a table</span></p>
  </div>`;
}

const nodeLabel = (id) => (id.startsWith('area:') ? domainById[id.slice(5)].name : id);
function selectChip(id) {
  if (CANVAS && CANVAS.byId.has(id)) return `<button type="button" class="chip" data-canvas-select="${id}">${esc(nodeLabel(id))}</button>`;
  return `<a class="chip" href="#table/${id}">${id}</a>`;
}

/** The details panel: help and the most connected tables, or the selected table's links and actions. */
function canvasPanel(id) {
  if (!CANVAS) return '';
  const close = '<button type="button" class="panel-close" data-canvas-clear aria-label="Clear selection">×</button>';
  if (!id) {
    const degree = (n) => CANVAS.links.filter((l) => l.from === n.id || l.to === n.id).length;
    const top = CANVAS.nodes.filter((n) => byName[n.id]).sort((a, b) => degree(b) - degree(a)).slice(0, 6);
    return `<h3>Click a table</h3><p class="panel-note">Its links stay sharp. Everything else blurs.</p>
      <h4>Most connected here</h4><div class="panel-chips">${top.map((n) => selectChip(n.id)).join('')}</div>`;
  }
  if (id.startsWith('area:')) {
    const aid = id.slice(5);
    const names = (CANVAS.byId.get(id).title || '').split(', ').filter(Boolean);
    return `${close}<h3>${domainById[aid].name}</h3><p class="panel-area"><span style="--c:${areaColor(aid)}"></span>Another area</p>
      <h4>${count(names.length, 'table links', 'tables link')} here</h4><div class="panel-chips">${names.map((n) => `<a class="chip" href="#table/${n}">${n}</a>`).join('')}</div>
      <div class="panel-actions"><a class="btn primary" href="#diagram/${aid}">Open its map</a></div>`;
  }
  const t = byName[id];
  const outs = [...new Set(CANVAS.links.filter((l) => l.from === id && l.to !== id).map((l) => l.to))];
  const ins = [...new Set(CANVAS.links.filter((l) => l.to === id && l.from !== id).map((l) => l.from))];
  const group = (title, list) => `<h4>${title}<small>${list.length}</small></h4>${list.length ? `<div class="panel-chips">${list.map(selectChip).join('')}</div>` : '<p class="panel-note">None on this map.</p>'}`;
  return `${close}<h3 class="t">${id}</h3>
    <p class="panel-area"><span style="--c:${areaColor(t.domain)}"></span>${domainById[t.domain].name}</p>
    <p class="panel-purpose">${t.purpose}</p>
    ${group('Points to', outs)}${group('Pointed at by', ins)}
    <div class="panel-actions"><a class="btn primary" href="#table/${id}">Details</a><a class="btn" href="#diagram/table/${id}">Its map</a><a class="btn" href="#tools/impact/${id}">Delete impact</a></div>`;
}

/** Wires the canvas of the current view: pan, zoom, pinch, keyboard, click to focus, find, panel. */
function initCanvas() {
  const wrap = document.querySelector('[data-canvas]');
  if (!wrap || !CANVAS) return;
  const svg = wrap.querySelector('svg');
  const view = svg.querySelector('.viewport');
  const panel = wrap.querySelector('[data-canvas-panel]');
  const level = wrap.querySelector('[data-zoom-level]');
  const st = { k: 1, x: 0, y: 0, sel: null };
  const pointers = new Map();
  let drag = null;
  let pinch = null;
  let lastTap = { id: null, at: 0 };
  const clampK = (k) => Math.min(4, Math.max(0.12, k));
  const panelSpace = () => (wrap.clientWidth > 760 ? 300 : 0);
  const local = (e) => {
    const r = svg.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  const apply = (animate) => {
    view.classList.toggle('animate', Boolean(animate));
    view.style.transform = `translate(${st.x}px, ${st.y}px) scale(${st.k})`;
    const g = 22 * st.k;
    wrap.style.backgroundSize = `${g}px ${g}px`;
    wrap.style.backgroundPosition = `${st.x}px ${st.y}px`;
    level.textContent = `${Math.round(st.k * 100)}%`;
  };
  const fit = (animate) => {
    const ns = CANVAS.nodes;
    const minX = Math.min(...ns.map((n) => n.x - n.w / 2));
    const maxX = Math.max(...ns.map((n) => n.x + n.w / 2));
    const minY = Math.min(...ns.map((n) => n.y - n.h / 2));
    const maxY = Math.max(...ns.map((n) => n.y + n.h / 2));
    const w = svg.clientWidth - panelSpace();
    const h = svg.clientHeight;
    st.k = clampK(Math.min((w - 60) / (maxX - minX || 1), (h - 120) / (maxY - minY || 1), 1.4));
    st.x = (w - (maxX - minX) * st.k) / 2 - minX * st.k;
    st.y = (h - (maxY - minY) * st.k) / 2 - minY * st.k + 18;
    apply(animate);
  };
  const zoomAt = (factor, sx, sy, animate) => {
    const k = clampK(st.k * factor);
    const wx = (sx - st.x) / st.k;
    const wy = (sy - st.y) / st.k;
    st.k = k;
    st.x = sx - wx * k;
    st.y = sy - wy * k;
    apply(animate);
  };
  const center = (id) => {
    const n = CANVAS.byId.get(id);
    if (!n) return;
    st.k = Math.max(st.k, 1.1);
    st.x = (svg.clientWidth - panelSpace()) / 2 - n.x * st.k;
    st.y = svg.clientHeight / 2 - n.y * st.k;
    apply(true);
  };
  const select = (id) => {
    st.sel = id;
    svg.classList.toggle('selecting', Boolean(id));
    const near = new Set(id ? [id] : []);
    svg.querySelectorAll('.edge').forEach((edge) => {
      const on = Boolean(id) && (edge.dataset.a === id || edge.dataset.b === id);
      edge.classList.toggle('on', on);
      if (on) {
        near.add(edge.dataset.a);
        near.add(edge.dataset.b);
      }
    });
    svg.querySelectorAll('.node').forEach((node) => {
      node.classList.toggle('on', near.has(node.dataset.node));
      node.classList.toggle('sel', node.dataset.node === id);
    });
    panel.innerHTML = canvasPanel(id);
  };

  svg.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    pointers.set(e.pointerId, local(e));
    if (pointers.size === 1) {
      const [x, y] = local(e);
      const node = e.target.closest('.node');
      drag = { x, y, sx: st.x, sy: st.y, moved: false, node: node ? node.dataset.node : null, pointer: e.pointerId };
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, k: st.k };
      drag = null;
    }
  });
  svg.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, local(e));
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt((pinch.k * d) / pinch.d / st.k, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
      return;
    }
    if (!drag) return;
    const [x, y] = local(e);
    const dx = x - drag.x;
    const dy = y - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) {
      drag.moved = true;
      wrap.classList.add('dragging');
      svg.setPointerCapture(drag.pointer);
    }
    st.x = drag.sx + dx;
    st.y = drag.sy + dy;
    apply();
  });
  const end = (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (drag && pointers.size === 0) {
      if (!drag.moved) {
        const now = Date.now();
        // A second click on the same table opens its own map.
        if (drag.node && lastTap.id === drag.node && now - lastTap.at < 380) {
          const node = CANVAS.byId.get(drag.node);
          location.hash = node.href;
          return;
        }
        lastTap = { id: drag.node, at: now };
        select(drag.node && drag.node !== st.sel ? drag.node : null);
      }
      drag = null;
    }
    wrap.classList.remove('dragging');
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('click', (e) => e.preventDefault()); // boxes are links elsewhere; here a click selects
  svg.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      const [x, y] = local(e);
      zoomAt(Math.exp(-e.deltaY * 0.0015), x, y);
    },
    { passive: false },
  );
  wrap.addEventListener('keydown', (e) => {
    if (e.target.matches('input')) return;
    const node = e.target.closest && e.target.closest('.node');
    if (e.key === 'Enter' && node) {
      e.preventDefault();
      select(node.dataset.node);
      return;
    }
    const cx = (svg.clientWidth - panelSpace()) / 2;
    const cy = svg.clientHeight / 2;
    if (e.key === '+' || e.key === '=') zoomAt(1.25, cx, cy, true);
    else if (e.key === '-' || e.key === '_') zoomAt(0.8, cx, cy, true);
    else if (e.key === '0') fit(true);
    else if (e.key === 'Escape') select(null);
    else if (e.key.startsWith('Arrow')) {
      st.x += e.key === 'ArrowLeft' ? 70 : e.key === 'ArrowRight' ? -70 : 0;
      st.y += e.key === 'ArrowUp' ? 70 : e.key === 'ArrowDown' ? -70 : 0;
      apply(true);
    } else return;
    e.preventDefault();
  });
  wrap.querySelectorAll('[data-zoom]').forEach((button) =>
    button.addEventListener('click', () => {
      if (button.dataset.zoom === 'fit') return fit(true);
      zoomAt(button.dataset.zoom === 'in' ? 1.25 : 0.8, (svg.clientWidth - panelSpace()) / 2, svg.clientHeight / 2, true);
    }),
  );
  const find = wrap.querySelector('[data-canvas-find]');
  const go = () => {
    const id = find.value.trim();
    if (CANVAS.byId.has(id)) {
      select(id);
      center(id);
    }
  };
  find.addEventListener('change', go);
  find.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') go();
  });
  panel.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-canvas-select]');
    if (chip) {
      select(chip.dataset.canvasSelect);
      center(chip.dataset.canvasSelect);
    } else if (e.target.closest('[data-canvas-clear]')) select(null);
  });
  fit(false);
}

function mapShell(key, lede, body) {
  return `<section class="mapview">
    <h1>Map</h1>
    <p class="lede">${lede}</p>
    ${mapTabs(key)}
    ${body}
  </section>`;
}

/* ---------- Layers: what must exist before what ---------- */

/** Level 0 points to nothing; every other table sits one level right of the deepest table it points to.
 *  Tables that point at each other in a loop share one level and are marked in LOOPED. */
const LOOPED = new Set();
function dependencyLevels() {
  LOOPED.clear();
  const parentsOf = (n) => [...new Set(outOf(n).filter((e) => e.to !== n).map((e) => e.to))];
  const index = new Map();
  const low = new Map();
  const stack = [];
  const onStack = new Set();
  const level = new Map();
  let next = 0;
  const strong = (v) => {
    index.set(v, next);
    low.set(v, next++);
    stack.push(v);
    onStack.add(v);
    for (const w of parentsOf(v)) {
      if (!index.has(w)) {
        strong(w);
        low.set(v, Math.min(low.get(v), low.get(w)));
      } else if (onStack.has(w)) low.set(v, Math.min(low.get(v), index.get(w)));
    }
    if (low.get(v) !== index.get(v)) return;
    const group = [];
    let w;
    do {
      w = stack.pop();
      onStack.delete(w);
      group.push(w);
    } while (w !== v);
    const inside = new Set(group);
    const up = group.flatMap(parentsOf).filter((p) => !inside.has(p));
    const l = up.length ? 1 + Math.max(...up.map((p) => level.get(p))) : 0;
    group.forEach((m) => level.set(m, l));
    if (group.length > 1) group.forEach((m) => LOOPED.add(m));
  };
  TABLES.forEach((t) => index.has(t.name) || strong(t.name));
  const depth = Math.max(0, ...level.values());
  return Array.from({ length: depth + 1 }, (_, i) => TABLES.filter((t) => level.get(t.name) === i).map((t) => t.name));
}

function mapLayers() {
  const layers = dependencyLevels();
  const deepest = layers.length - 1;
  const cols = layers
    .map(
      (names, i) => `<div class="layer">
        <h3>Level ${i}<small>${names.length}</small></h3>
        <p class="layer-sub">${i === 0 ? 'Point to nothing' : `Point to level ${i - 1} or lower`}</p>
        ${names.map((n) => `<button type="button" class="layer-card" data-layer="${n}" style="--c:${areaColor(byName[n].domain)}">${n}${LOOPED.has(n) ? '<small class="loop">loop</small>' : ''}</button>`).join('')}
      </div>`,
    )
    .join('');
  const insert = layers.map((names, i) => `-- level ${i}\n${names.join('\n')}`).join('\n\n');
  const remove = layers
    .map((names, i) => `-- level ${i}\n${names.join('\n')}`)
    .reverse()
    .join('\n\n');
  return mapShell(
    'layers',
    'What must exist before what. Each table points only to tables on its left.',
    `<div class="stats">
      ${stat(layers.length, 'levels', 'accent')}
      ${stat(layers[0].length, 'tables point to nothing', 'restrict')}
      ${stat(deepest, deepest === 1 ? 'step in the longest chain' : 'steps in the longest chain', 'setnull')}
    </div>
    <section class="tsec" style="--c:var(--accent)"><h2>Levels</h2>
      <div class="legend"><span style="--c:var(--accent)">What it points to</span><span style="--c:var(--setnull)">What points to it</span></div>
      <div class="layers" data-layers>${cols}</div>
      <p class="layer-info" data-layer-info>Click a table to see what it needs.</p>
    </section>
    <section class="tsec" style="--c:var(--restrict)"><h2>Order to fill and empty</h2>
      <div class="code-card">
        <div class="code-tabs" role="tablist">
          <button type="button" role="tab" data-code="insert" aria-selected="true">Insert order</button>
          <button type="button" role="tab" data-code="delete" aria-selected="false">Delete order</button>
          <button type="button" class="copy" data-copy>Copy</button>
        </div>
        <pre class="code" data-lang="insert">${esc(insert)}</pre>
        <pre class="code" data-lang="delete" hidden>${esc(remove)}</pre>
      </div>
      <p class="fine">Seeds and fixtures: insert top to bottom. Clean-ups: delete top to bottom.</p>
    </section>`,
  );
}

/* ---------- Ownership: whose rows go with whom ---------- */

function mapOwnership() {
  const ownersOf = (n) => [...new Set(outOf(n).filter((e) => e.d === 'cascade' && e.to !== n).map((e) => e.to))];
  const ownedBy = (n) => [...new Set(into(n).filter((e) => e.d === 'cascade' && e.from !== n).map((e) => e.from))];
  const reach = (n, seen = new Set()) => {
    for (const c of ownedBy(n)) if (!seen.has(c)) seen.add(c), reach(c, seen);
    return seen.size;
  };
  const names = TABLES.map((t) => t.name);
  const roots = names.filter((n) => !ownersOf(n).length && ownedBy(n).length).sort((a, b) => reach(b) - reach(a) || a.localeCompare(b));
  const loose = names.filter((n) => !ownersOf(n).length && !ownedBy(n).length);
  const placed = new Set();
  const selfTag = (n) => {
    const self = outOf(n).find((e) => e.to === n && e.d === 'cascade');
    return self ? `<span class="tag">owns its own rows via ${self.col}</span>` : '';
  };
  // Each table sits under its nearest owner inside the first tree that reaches it.
  const grow = (root) => {
    const parent = new Map();
    const order = [root];
    placed.add(root);
    for (let i = 0; i < order.length; i++) {
      for (const c of ownedBy(order[i])) {
        if (placed.has(c)) continue;
        placed.add(c);
        parent.set(c, order[i]);
        order.push(c);
      }
    }
    const kids = (n) => order.filter((c) => parent.get(c) === n);
    const li = (n) => {
      const also = ownersOf(n).filter((o) => o !== parent.get(n));
      const k = kids(n);
      return `<li><span class="node-name">${tlink(n)}</span>${also.length ? `<span class="tag">also owned by ${also.join(', ')}</span>` : ''}${selfTag(n)}${k.length ? `<ul>${k.map(li).join('')}</ul>` : ''}</li>`;
    };
    return { root, owns: order.length - 1, html: `<ul>${kids(root).map(li).join('')}</ul>` };
  };
  const trees = roots.map(grow);
  // Tables that own each other in a loop have no owner at the top: start a tree at one of them.
  for (let n; (n = names.find((x) => !placed.has(x) && ownersOf(x).length)); ) {
    roots.push(n);
    trees.push({ ...grow(n), loop: true });
  }
  const owned = names.filter((n) => ownersOf(n).length).length;
  return mapShell(
    'ownership',
    'Whose rows go with whom. Delete an owner and everything under it goes too.',
    `<div class="stats">
      ${stat(roots.length, roots.length === 1 ? 'owner at the top' : 'owners at the top', 'cascade')}
      ${stat(owned, owned === 1 ? 'owned table' : 'owned tables', 'setnull')}
      ${stat(loose.length, loose.length === 1 ? 'table on its own' : 'tables on their own', 'restrict')}
    </div>
    <section class="tsec" style="--c:var(--cascade)"><h2>Owners and what they own</h2>
      ${trees
        .map(
          (tr, i) => `<details class="own"${i < 3 ? ' open' : ''}><summary><span class="t">${tr.root}</span><small>owns ${count(tr.owns, 'table', 'tables')}${tr.loop ? ' · in a cascade loop' : ''}</small></summary>
            <div class="inner"><div class="tree">${tr.html}</div><p class="fine"><a href="#tools/impact/${tr.root}">See the full delete impact</a></p></div></details>`,
        )
        .join('')}
    </section>
    <section class="tsec" style="--c:var(--restrict)"><h2>On their own<small>${loose.length}</small></h2>
      <p class="fine" style="margin:0 0 12px">Not owned, and own nothing. Their links only clear a column or refuse a delete.</p>
      ${chips(loose)}
    </section>`,
  );
}

/* ---------- Most connected: the tables most links point to or come from ---------- */

function mapHubs() {
  const degree = TABLES.map((t) => ({ n: t.name, i: into(t.name).filter((e) => e.from !== t.name).length, o: outOf(t.name).filter((e) => e.to !== t.name).length }))
    .sort((x, y) => y.i + y.o - (x.i + x.o) || x.n.localeCompare(y.n))
    .slice(0, 10);
  const top = Math.max(1, ...degree.map((d) => d.i + d.o));
  return mapShell(
    'hubs',
    'The ten tables with the most links. Click one to see its own map.',
    `<section class="tsec" style="--c:var(--accent)"><h2>Most connected tables</h2>
      <div class="legend"><span style="--c:var(--accent)">Pointed at</span><span style="--c:var(--setnull)">Points to</span></div>
      <ul class="hubs">${degree
        .map(
          (d) => `<li><a class="hub" href="#diagram/table/${d.n}"><span class="t">${d.n}</span><span class="hub-bar"><i class="in" style="width:${((100 * d.i) / top).toFixed(1)}%"></i><i class="out" style="width:${((100 * d.o) / top).toFixed(1)}%"></i></span><small>${d.i} in, ${d.o} out</small></a></li>`,
        )
        .join('')}</ul>
    </section>`,
  );
}

/* ---------- Values: what status and type columns can hold ---------- */

/** Value lists: the guide's, else a list written in the column note ("a · b", "a → b, or c"), else the database's. */
function noteList(note) {
  if (!note) return null;
  let s = note.replace(/<[^>]+>/g, '').trim();
  const isFlow = s.includes(' → ');
  if (!isFlow && !s.includes(' · ')) return null;
  let hint = '';
  const semi = s.indexOf(';');
  if (semi > 0) {
    hint = s.slice(semi + 1).trim();
    s = s.slice(0, semi);
  }
  const first = s.search(isFlow ? / → / : / · /);
  const colon = s.indexOf(': ');
  if (colon > 0 && colon < first) s = s.slice(colon + 2);
  const pieces = s.split(isFlow ? /( → |, or | or )/ : / · /);
  const values = [];
  const seps = [];
  pieces.forEach((p, i) => {
    if (isFlow && i % 2) return void seps.push(p.includes('or') ? 'or' : '→');
    const m = p.trim().match(/^(.*?)\s*\((.*)\)$/);
    values.push(m ? { v: m[1], hint: m[2] } : { v: p.trim(), hint: '' });
  });
  if (values.length < 2 || values.some((v) => !v.v || v.v.length > 32)) return null;
  return { values, seps, flow: isFlow, hint };
}
function valueLists() {
  const gv = GUIDE.values || {};
  const out = [];
  for (const t of TABLES) {
    for (const c of t.columns) {
      const g = gv[`${t.name}.${c.n}`];
      let list = null;
      if (g && g.values && g.values.length > 1) {
        const hints = g.hints || {};
        const or = new Set(g.or || []);
        list = {
          values: g.values.map((v) => ({ v: String(v), hint: hints[v] || '' })),
          seps: g.values.slice(1).map((v) => (or.has(v) ? 'or' : '→')),
          flow: !!g.flow,
          hint: g.note || '',
        };
      } else list = noteList(c.note);
      if (!list && c.values && c.values.length > 1) list = { values: c.values.map((v) => ({ v: String(v), hint: '' })), seps: [], flow: false, hint: '' };
      if (list) out.push({ table: t.name, column: c.n, area: t.domain, ...list });
    }
  }
  return out;
}

function mapValues() {
  const lists = valueLists();
  if (!lists.length) return mapShell('values', 'What status and type columns can hold.', '<p class="none big">No value lists found.</p>');
  const key = (l) => l.values.map((v) => v.v).join('|');
  const groups = new Map();
  lists.forEach((l) => {
    if (!groups.has(key(l))) groups.set(key(l), []);
    groups.get(key(l)).push(l);
  });
  const shared = [...groups.values()].filter((g) => g.length > 1).sort((a, b) => b.length - a.length);
  const chipsOf = (l) =>
    `<div class="vals">${l.values
      .map((v, i) => `${i && l.flow ? `<i>${l.seps[i - 1]}</i>` : ''}<span class="val"${v.hint ? ` title="${esc(v.hint)}"` : ''}>${esc(v.v)}</span>`)
      .join('')}</div>`;
  const hints = (l) => {
    const parts = l.values.filter((v) => v.hint).map((v) => `<b>${esc(v.v)}</b>: ${esc(v.hint)}`);
    if (l.hint) parts.push(esc(l.hint));
    return parts.length ? `<p class="val-hint">${parts.join('<br>')}</p>` : '';
  };
  const colLink = (l) => `<a class="t" href="#table/${l.table}/columns">${l.table}.<b>${l.column}</b></a>`;
  const flows = lists.filter((l) => l.flow).length;
  return mapShell(
    'values',
    'What status and type columns can hold, and which tables share the same list.',
    `<div class="stats">
      ${stat(lists.length, 'value lists', 'accent')}
      ${stat(shared.length, shared.length === 1 ? 'list shared by tables' : 'lists shared by tables', 'setnull')}
      ${stat(flows, flows === 1 ? 'list with an order' : 'lists with an order', 'restrict')}
    </div>
    ${shared.length ? `<section class="tsec" style="--c:var(--setnull)"><h2>Shared by several tables<small>${shared.length}</small></h2>
      ${shared.map((g) => `<div class="val-card">${chipsOf(g[0])}<p class="val-used"><span>Used by</span>${g.map((l) => `<a href="#table/${l.table}/columns">${l.table}.<b>${l.column}</b></a>`).join('')}</p></div>`).join('')}
    </section>` : ''}

  );
}

function viewTools() {

/* ---------- Delete impact ---------- */

/**
 * What one DELETE on `start` does. Walks incoming links breadth first: cascade links recurse into
 * the child table, set-null links clear a column, restrict (NO ACTION) links can stop the delete.
 * Each table is expanded once, at its shallowest point; later arrivals are marked "also".
 */
function deleteImpact(start) {
  const deleted = new Set([start]);
  const root = { name: start, children: [] };
  const queue = [root];
  const cleared = [];
  const blocking = [];
  while (queue.length) {
    const node = queue.shift();
    for (const e of into(node.name)) {
      if (e.from === node.name) {
        node.self = e; // a self-cascade: its own child rows go too, at every depth
        continue;
      }
      if (e.d === 'cascade') {
        if (deleted.has(e.from)) {
          node.children.push({ name: e.from, e, also: true });
          continue;
        }
        deleted.add(e.from);
        const child = { name: e.from, e, children: [] };
        node.children.push(child);
        queue.push(child);
      } else {
        (e.d === 'setnull' ? cleared : blocking).push(e);
      }
    }
  }
  return { root, deleted: [...deleted], cleared, blocking };
}

function impactTree(node) {
  const rows = [];
  if (node.self) rows.push(`<li><span class="node-name">${tlink(node.name)}</span><span class="via">${node.self.col}</span><span class="tag">${LABELS.selfCascade}</span></li>`);
  for (const c of node.children) {
    if (c.also) {
      rows.push(`<li class="also"><span class="node-name">${tlink(c.name)}</span><span class="via">${c.e.col}</span><span class="tag">also above</span></li>`);
      continue;
    }
    const sub = c.children.length || c.self ? impactTree(c) : '';
    rows.push(`<li><span class="node-name">${tlink(c.name)}</span><span class="via">${c.e.col}</span>${sub}</li>`);
  }
  return rows.length ? `<ul>${rows.join('')}</ul>` : '';
}

function toolImpact(start) {
  const r = deleteImpact(start);
  const lost = r.deleted.length - 1;
  const flags = [
    SOFT_DELETE.includes(start) ? flag('Soft delete in the app', 'restrict', LABELS.softDeleteWhy) : '',
    r.blocking.length ? flag(LABELS.refused, 'cascade', 'A NO ACTION link refuses the delete if matching rows still exist at the end of the statement.') : '',
  ].join('');
  const linkRows = (list) =>
    `<ul class="pairs">${list.map((e) => `<li>${tlink(e.from)}<span class="via">${e.col}</span></li>`).join('')}</ul>`;
  return `<section class="tool">
    <h1>Delete impact</h1>
    <div class="ask"><span>Delete one row from</span>${bigSelect('impact-table', start)}</div>
    <div class="stats">
      ${stat(lost, lost === 1 ? 'table loses rows' : 'tables lose rows', 'cascade')}
      ${stat(r.cleared.length, r.cleared.length === 1 ? 'column set to NULL' : 'columns set to NULL', 'setnull')}
      ${stat(r.blocking.length, r.blocking.length === 1 ? 'link can block it' : 'links can block it', 'restrict')}
    </div>
    ${flags ? `<div class="flags">${flags}</div>` : ''}
    ${section('Deleted with it', lost, 'cascade', lost || r.root.self ? `<div class="tree">${impactTree(r.root)}</div>` : '<p class="none">Nothing else.</p>')}
    ${section('Kept, column cleared', r.cleared.length, 'setnull', r.cleared.length ? `${linkRows(r.cleared)}<p class="fine">Only rows not already deleted above.</p>` : '<p class="none">Nothing.</p>')}
    ${section('Can block the delete', r.blocking.length, 'restrict', r.blocking.length ? linkRows(r.blocking) : '<p class="none">Nothing. The delete always succeeds.</p>')}
  </section>`;
}

/* ---------- Join path ---------- */

/** All shortest foreign-key paths between two tables (links walked either way), up to `limit`. */
function joinPaths(a, b, limit = 6) {
  if (a === b) return [[]];
  const dist = new Map([[a, 0]]);
  const preds = new Map();
  let frontier = [a];
  while (frontier.length && !dist.has(b)) {
    const next = [];
    for (const n of frontier) {
      for (const e of EDGES) {
        const other = e.from === n ? e.to : e.to === n ? e.from : null;
        if (!other || other === n) continue;
        if (!dist.has(other)) {
          dist.set(other, dist.get(n) + 1);
          preds.set(other, []);
          next.push(other);
        }
        if (dist.get(other) === dist.get(n) + 1) preds.get(other).push({ prev: n, e });
      }
    }
    frontier = next;
  }
  if (!dist.has(b)) return [];
  const paths = [];
  const walk = (node, acc) => {
    if (paths.length >= limit) return;
    if (node === a) return void paths.push(acc.slice().reverse());
    for (const p of preds.get(node)) {
      acc.push({ e: p.e, from: p.prev, to: node });
      walk(p.prev, acc);
      acc.pop();
    }
  };
  walk(b, []);
  return paths;
}

const RESERVED = new Set('all and as asc between by case check column constraint create default delete desc distinct drop else end exists from group having in index inner insert into is join key left like limit not null offset on or order outer primary references right select set table then to union unique update user using values when where with'.split(' '));
/** Quote a table or column name only when it needs it (reserved word, capitals, odd characters). */
const qi = (name) =>
  String(name)
    .split('.')
    .map((p) => (/^[a-z_][a-z0-9_]*$/.test(p) && !RESERVED.has(p) ? p : DIALECT === 'mysql' ? `\`${p.replace(/`/g, '``')}\`` : `"${p.replace(/"/g, '""')}"`))
    .join('.');

function aliasesFor(names) {
  const used = new Set();
  const out = {};
  for (const n of names) {
    if (out[n]) continue;
    const base = n.split(/[_.]/).filter(Boolean).map((w) => w[0].toLowerCase()).join('') || 't';
    let alias = base;
    for (let i = 2; used.has(alias) || RESERVED.has(alias); i++) alias = `${base}${i}`;
    used.add(alias);
    out[n] = alias;
  }
  return out;
}

/**
 * SQL and ORM code for one path. Towards a parent: parent.ref = child.col (a LEFT JOIN when that
 * column allows NULL). Towards a child: child.col = parent.ref (one row can match many).
 * Composite links join on every column pair.
 */
function joinCode(a, path) {
  const al = aliasesFor([a, ...path.map((s) => s.to)]);
  const sql = [`SELECT ${al[a]}.*`, `FROM ${qi(a)} AS ${al[a]}`];
  const ky = [`db.selectFrom('${a} as ${al[a]}')`];
  const kx = [`knex.select('${al[a]}.*').from({ ${al[a]}: '${a}' })`];
  for (const s of path) {
    const toParent = s.e.to === s.to;
    const left = toParent && isNullable(s.e.from, s.e.col);
    const child = toParent ? s.from : s.to;
    const parent = toParent ? s.to : s.from;
    const pairs = s.e.cols.map((c, i) => {
      const cc = `${al[child]}.${c}`;
      const pc = `${al[parent]}.${s.e.refCols[i] || 'id'}`;
      return toParent ? [pc, cc] : [cc, pc];
    });
    const q = (ref) => ref.split('.').map((p, i) => (i ? qi(p) : p)).join('.');
    sql.push(`${left ? 'LEFT JOIN' : 'JOIN'} ${qi(s.to)} AS ${al[s.to]} ON ${pairs.map(([l, r]) => `${q(l)} = ${q(r)}`).join(' AND ')}`);
    ky.push(
      pairs.length === 1
        ? `  .${left ? 'leftJoin' : 'innerJoin'}('${s.to} as ${al[s.to]}', '${pairs[0][0]}', '${pairs[0][1]}')`
        : `  .${left ? 'leftJoin' : 'innerJoin'}('${s.to} as ${al[s.to]}', (join) => join${pairs.map(([l, r]) => `.onRef('${l}', '=', '${r}')`).join('')})`,
    );
    kx.push(
      pairs.length === 1
        ? `  .${left ? 'leftJoin' : 'join'}({ ${al[s.to]}: '${s.to}' }, '${pairs[0][0]}', '${pairs[0][1]}')`
        : `  .${left ? 'leftJoin' : 'join'}({ ${al[s.to]}: '${s.to}' }, function () { this${pairs.map(([l, r], i) => `.${i ? 'andOn' : 'on'}('${l}', '=', '${r}')`).join('')}; })`,
    );
  }
  sql[sql.length - 1] += ';';
  ky.push(`  .selectAll('${al[a]}')`);
  return { sql: sql.join('\n'), kysely: ky.join('\n'), knex: kx.join('\n') };
}

function pathFlags(path) {
  const flags = [];
  if (path.some((s) => s.e.to !== s.to)) flags.push(flag('One row → many', 'setnull', 'A step goes from a parent to its children, so one starting row can return several result rows. Use EXISTS or aggregate if you only filter.'));
  if (path.some((s) => s.e.to === s.to && isNullable(s.e.from, s.e.col))) flags.push(flag('LEFT JOIN', 'restrict', 'A link column can be NULL. LEFT JOIN keeps rows without a match; switch to JOIN to drop them.'));
  if (HUB && path.slice(0, -1).some((s) => s.to === HUB)) flags.push(flag(`Through ${HUB}`, 'cascade', LABELS.hubWhy || `Rows connect only because they share a ${HUB} row. Usually not what a query means.`));
  return flags.join('');
}

function chain(a, path) {
  return `<div class="chain"><span class="box">${a}</span>${path
    .map((s) => `<span class="link"><small>${s.e.col}</small><i aria-hidden="true">${s.e.to === s.to ? '⟶' : '⟵'}</i></span><span class="box">${s.to}</span>`)
    .join('')}</div>`;
}

function toolJoin(a, b) {
  const viaHub = (path) => path.slice(0, -1).filter((s) => s.to === HUB).length;
  const paths = a === b ? [] : joinPaths(a, b, 12).sort((x, y) => viaHub(x) - viaHub(y)).slice(0, 6);
  let result;
  if (a === b) result = '<p class="none big">Pick two different tables.</p>';
  else if (!paths.length) result = `<p class="none big">Not connected.</p><p class="fine">No chain of foreign keys links ${a} and ${b}.</p>`;
  else {
    const len = paths[0].length;
    const ways = paths.length > 1
      ? `<div class="ways" role="tablist">${paths
          .map((p, i) => `<button type="button" class="way" role="tab" data-way="${i}" aria-selected="${i === 0}"><b>Way ${i + 1}</b><small>${p.map((s) => s.e.col).join(' · ')}</small></button>`)
          .join('')}</div>`
      : '';
    const panels = paths
      .map((path, i) => {
        const code = joinCode(a, path);
        return `<div class="way-panel" data-panel="${i}"${i ? ' hidden' : ''}>
          ${chain(a, path)}
          <div class="flags">${pathFlags(path) || flag('Plain join', 'restrict', 'Every step goes to a parent through a NOT NULL column: one result row per starting row.')}</div>
          <div class="code-card">
            <div class="code-tabs" role="tablist">
              ${CODE.map((k, n) => `<button type="button" role="tab" data-code="${k}" aria-selected="${n === 0}">${CODE_NAME[k]}</button>`).join('')}
              <button type="button" class="copy" data-copy>Copy</button>
            </div>
            ${CODE.map((k, n) => `<pre class="code" data-lang="${k}"${n ? ' hidden' : ''}>${esc(code[k])}</pre>`).join('')}
          </div>
        </div>`;
      })
      .join('');
    result = `<div class="stats two">
        ${stat(len, len === 1 ? 'join' : 'joins', 'accent')}
        ${stat(paths.length, paths.length === 1 ? 'way to do it' : 'ways to do it', 'restrict')}
      </div>
      <section class="tsec" style="--c:var(--accent)"><h2>${paths.length > 1 ? 'Pick a way' : 'The path'}</h2>${ways}${panels}</section>`;
  }
  return `<section class="tool">
    <h1>Join path</h1>
    <div class="ask"><span>Join</span>${bigSelect('join-a', a)}<span>to</span>${bigSelect('join-b', b)}<button type="button" class="swap" data-swap aria-label="Swap the two tables" title="Swap">⇄</button></div>
    ${result}
  </section>`;
}

/* Selects navigate; Swap swaps; way and code tabs switch in place; Copy copies. */
document.addEventListener('change', (event) => {
  if (!event.target.matches('[data-tool-input]')) return;
  const v = (id) => document.getElementById(id)?.value;
  if (event.target.id === 'impact-table') location.hash = `#tools/impact/${v('impact-table')}`;
  if (event.target.id.startsWith('join-')) location.hash = `#tools/join/${v('join-a')}/${v('join-b')}`;
});
document.addEventListener('click', (event) => {
  if (event.target.closest('[data-swap]')) {
    location.hash = `#tools/join/${document.getElementById('join-b').value}/${document.getElementById('join-a').value}`;
    return;
  }
  const way = event.target.closest('[data-way]');
  if (way) {
    const box = way.closest('.tsec');
    box.querySelectorAll('[data-way]').forEach((b) => b.setAttribute('aria-selected', String(b === way)));
    box.querySelectorAll('[data-panel]').forEach((p) => {
      p.hidden = p.dataset.panel !== way.dataset.way;
      if (!p.hidden) {
        p.classList.remove('panel-in');
        void p.offsetWidth;
        p.classList.add('panel-in');
      }
    });
    return;
  }
  const tab = event.target.closest('[data-code]');
  if (tab) {
    const card = tab.closest('.code-card');
    card.querySelectorAll('[data-code]').forEach((b) => b.setAttribute('aria-selected', String(b === tab)));
    card.querySelectorAll('pre[data-lang]').forEach((pre) => (pre.hidden = pre.dataset.lang !== tab.dataset.code));
    return;
  }
  const copy = event.target.closest('[data-copy]');
  if (copy) {
    const pre = [...copy.closest('.code-card').querySelectorAll('pre[data-lang]')].find((p) => !p.hidden);
    const done = () => {
      copy.textContent = 'Copied';
      copy.classList.add('done');
      setTimeout(() => {
        copy.textContent = 'Copy';
        copy.classList.remove('done');
      }, 1400);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(pre.textContent).then(done, () => (copy.textContent = 'Select to copy'));
    else copy.textContent = 'Select to copy';
  }
});

/** The second header row inside Tools: the three tools, the current one marked. */
function toolBar(current) {
  return `<nav class="subbar-in" aria-label="Tools"><a class="subbar-up" href="#tools"${current ? '' : ' aria-current="page"'}>Tools</a><span aria-hidden="true">›</span>${[
    ['map', 'Map', '#diagram'],

/** Tab rows scroll sideways on narrow screens: keep the current tab in view and fade the edge while more is hidden. */
function tabEdges(row) {
  row.classList.toggle('less', row.scrollLeft > 2);
  row.classList.toggle('more', row.scrollLeft + row.clientWidth < row.scrollWidth - 2);
}
function fitTabs() {
  app.querySelectorAll('.tabs').forEach((row) => {
    const on = row.querySelector('[aria-current]');
    if (on) {
      // Scroll only as far as needed to show the current tab clear of the fade.
      const over = on.getBoundingClientRect().right - row.getBoundingClientRect().right + 56;
      if (over > 0) row.scrollLeft += over;
    }
    tabEdges(row);
  });
}
document.addEventListener(
  'scroll',
  (event) => {
    const row = event.target.closest?.('.tabs');
    if (row) tabEdges(row);
  },
  true,
);
window.addEventListener('resize', fitTabs);

/** Previous / next among siblings. `items` are [label, href, mono?]. */
function pager(items, index, what) {
  const prev = items[index - 1];
  const next = items[index + 1];
  if (!prev && !next) return '';
  const link = (item, dir) =>
    `<a class="${dir === 'next' ? 'to-next' : 'to-prev'}" href="${item[1]}"><small>${dir === 'next' ? `Next ${what} ›` : `‹ Previous ${what}`}</small><b class="${item[2] ? 't' : ''}">${item[0]}</b></a>`;
  return `<nav class="pager" aria-label="More ${what}s">${prev ? link(prev, 'prev') : ''}${next ? link(next, 'next') : ''}</nav>`;
}
const tablePager = (t) => {
  const list = tablesIn(t.domain);
  return pager(list.map((x) => [x.name, `#table/${x.name}`, true]), list.indexOf(t), `table in ${domainById[t.domain].name}`);
};
const areaPager = (id) => pager(DOMAINS.map((d) => [d.name, `#explore/${d.id}`]), DOMAINS.findIndex((d) => d.id === id), 'area');
const refPager = (topic) => pager(REF.map(([id, title]) => [title, `#ref/${id}`]), REF.findIndex(([id]) => id === topic), 'topic');

/* ============================================================
   Routing: #home, #tour/3, #explore, #explore/research,
   #table/papers/links, #ref, #ref/indexes
   ============================================================ */
// Older links (the previous explorer, and links inside the data) still land somewhere useful.
const ALIASES = { 'diagram/matrix': 'diagram/hubs', overview: 'home', tables: 'explore', map: 'diagram', ...(GUIDE.aliases || {}) };

function route() {
  let hash = location.hash.replace(/^#/, '') || 'home';
  if (ALIASES[hash]) {
    history.replaceState(null, '', `#${ALIASES[hash]}`);
    hash = ALIASES[hash];
  }
  const [view, a, b] = hash.split('/');
  const html =
    view === 'home' ? viewHome()
    : view === 'tour' ? viewTour(a)
    : view === 'explore' ? (a ? viewArea(a) : viewExplore())
    : view === 'table' ? viewTable(a, b)
    : view === 'ref' ? viewRef(a)
    : view === 'diagram' ? viewDiagram(a, b)
    : view === 'tools' ? viewTools()
    : viewNotFound();
  app.innerHTML = html;

  const section = { home: 'home', tour: 'tour', explore: 'explore', table: 'explore', ref: 'ref', diagram: 'tools', tools: 'tools' }[view];
  document.querySelectorAll('[data-nav]').forEach((link) => {
    if (link.dataset.nav === section) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  const sub = document.getElementById('subbar');
  const tool = view === 'diagram' ? 'map' : view === 'tools' ? a || '' : null;
  sub.hidden = tool === null;
  sub.innerHTML = tool === null ? '' : toolBar(tool);
  document.title = `${BRAND}: ${app.querySelector('h1')?.textContent || 'Home'}`;
  window.scrollTo(0, 0);
  wire();
  initCanvas();
  fitTabs();
}

/** Behaviour for the few interactive parts of the current view. */

    find.addEventListener('input', () => {

    });
  }
  document.querySelectorAll('[data-rule]').forEach((button) =>
    button.addEventListener('click', () => {
      document.querySelectorAll('[data-rule]').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
      document.getElementById('link-groups').innerHTML = linkGroups(button.dataset.rule);
    }),
  );
}

// Arrow keys move through the tour.
document.addEventListener('keydown', (event) => {
  if (!location.hash.startsWith('#tour') || event.target.closest('input')) return;
  const current = parseInt(location.hash.split('/')[1], 10) || 1;
  if (event.key === 'ArrowRight' && current < TOUR.length) location.hash = `#tour/${current + 1}`;
  if (event.key === 'ArrowLeft' && current > 1) location.hash = `#tour/${current - 1}`;
});
window.addEventListener('hashchange', route);
route();
</script>
<script>
  // Fade each new view in. Watches #app, so the router itself is untouched.
  (function () {
    const app = document.getElementById('app');
    new MutationObserver(() => {
      app.classList.remove('view-in');
      void app.offsetWidth;
      app.classList.add('view-in');
    }).observe(app, { childList: true });
    app.classList.add('view-in');
  })();
</script>
</body>
</html>
