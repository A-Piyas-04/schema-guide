"citing_paper_id":"Builds on…","cited_paper_id":"…this one","intent":"background · supporting · contrasting; NULL = unknown","s2_intents":"Semantic Scholar's own labels: background · methodology · result","is_influential":"","source":"semantic_scholar · openalex · staff","created_at":"","updated_at":""},"notes":["Semantic Scholar has no supporting or contrasting label. methodology → supporting, background → background, result alone → unknown. **contrasting is set only by staff**, and the worker never overwrites a staff edge."],"checks":["`citing_paper_id \u003c> cited_paper_id`"]},"paper_saves":{"purpose":"The bookmark (A3), independent of reading progress.","badges":["composite PK"],"columns":{"user_id":"","paper_id":"","created_at":"Orders Saved; the earliest unread one is Up next"},"notes":["Up next = saved ∧ no reading pass with step ≥ 1, earliest first."],"checks":[]},"reading_passes":{"purpose":"The three-step tracker and private note (A4): Explored → Studied → Reproduced.","badges":["composite PK","upsert"],"columns":{"user_id":"","paper_id":"","step":"0 not read · 1 Explored · 2 Studied · 3 Reproduced","note":"Private, at most 400 characters","explored_at":"","studied_at":"","reproduced_at":"","created_at":"","updated_at":""},"notes":["Lowering the step clears the later times, so \"explored this month\" never counts a step taken back.","Mark read raises the step to 1 and never lowers it."],"checks":["`step BETWEEN 0 AND 3`, and each step's time is set exactly while the step holds","`char_length(note) \u003c= 400`"]},"research_outputs":{"purpose":"Saved results of the AI research tools (A5, written by Group C), reopened for free.","badges":["public_id"],"columns":{"id":"","public_id":"","user_id":"","kind":"reading_map · landscape_map · roadmap · comparison · claim_check","title":"","params":"The inputs: topic, papers, claim","result":"","created_at":""},"notes":["Opening one reads this row: no AI call, nothing counted against an allowance."],"checks":[]},"trails":{"purpose":"Reading paths users make (A7): papers in order, one line per step.","badges":["public_id","user content"],"columns":{"id":"","public_id":"","creator_id":"","title":"","description":"","lang":"en · bn","field_id":"Optional chip","status":"draft · published · removed (moderator)","published_at":"","created_at":"","updated_at":""},"notes":["Publishing needs at least 2 papers. A published trail follows its author's visibility, like a post, and can be reported."],"checks":[]},"trail_items":{"purpose":"The ordered steps of a trail.","badges":["deferrable PK","ordered"],"columns":{"trail_id":"","position":"`DEFERRABLE INITIALLY DEFERRED`","paper_id":"Unique within a trail; published papers only","note":"At most 280 characters"},"notes":[],"checks":[]},"user_known_topics":{"purpose":"\"I already know this\": a concept the user marked as known (A13).","badges":["composite PK"],"columns":{"user_id":"","topic_id":"","created_at":""},"notes":["This is the spec’s user_known_concepts: our concepts are topics."],"checks":[]},"learn_item_completions":{"purpose":"Lessons and notes the user completed, wherever they opened them (A13).","badges":["composite PK"],"columns":{"user_id":"","learn_item_id":"","completed_at":""},"notes":["Course progress also writes it for the steps reached."],"checks":[]},"outbox_events":{"purpose":"Work for the worker, written in the same transaction as the change.","badges":["work queue","no FK"],"columns":{"id":"","event_type":"e.g. post.liked, follow.changed (new)","entity_type":"","entity_id":"**No FK**: the event outlives its target","payload":"","attempts":"At 10 the row stays as a dead letter","created_at":"","processed_at":"NULL = pending. The worker claims an event by setting it only if still NULL"},"notes":["Each event is claimed and applied in one transaction, so it takes effect exactly once. That is what makes ±1 counter updates safe."],"checks":[]},"audit_log":{"purpose":"Every admin and security action.","badges":["no FK"],"columns":{"id":"","actor_id":"Set null when the actor is purged","action":"e.g. paper.publish, user.suspend, user.purge","entity_type":"","entity_id":"**No FK**: entries outlive what they describe","changes":"","ip":"","created_at":""},"notes":[],"checks":[]}},"badges":{"public_id":"Rows have a random `public_id` that the app uses; the internal `id` never leaves the server.","soft delete":"Deleting hides a row at once (`deleted_at`); it is removed for good after 30 days.","stored counts":"Counts are stored on the row and moved by the worker, instead of counted on every view.","composite PK":"The key is a pair of columns, so the same pair can only appear once.","toggle row":"One row per pair for ever: it is switched on and off instead of deleted and re-added, so nothing is notified twice.","polymorphic target":"It points at different kinds of rows through a plain id, with no foreign key.","no FK":"It keeps a plain id with no foreign key, so it outlives what it points at.","tsvector":"Its text is indexed for full-text search.","self-reference":"Rows can point to other rows of the same table (replies).","work queue":"The worker picks up rows from it as jobs.","publishing":"Team content: it starts as a draft and the app shows it only once it is published.","deferrable PK":"Its position is part of the key and is checked at the end of a transaction, so a whole list can be reordered at once.","ordered":"Rows are kept in an order (`position`).","upsert":"Each change rewrites the same row instead of adding one.","slug":"It has a readable `slug` used in URLs.","pg_trgm":"Its name is indexed for typo-tolerant search.","ingested":"Some columns are filled by the worker from outside sources, never by the app.","per language":"There is one row per language (`en` or `bn`).","typed link":"Each row can link to one kind of content: a lesson or note, a quiz, or a reel.","user content":"Made by users, so it follows their privacy and can be reported."},"indexes":{"posts_user_feed_idx":"Profile pages and home feed (keyset)","posts_user_id_created_at_idx":"A user's posts, any status (also serves the user cascade)","posts_reels_idx":"Reels list","posts_media_id_idx":"Posts waiting on a media asset","users_suggest_idx":"People to follow, most-followed first","users_email_lower_key":"Case-insensitive login","users_username_lower_key":"Case-insensitive login","follows_following_id_idx":"Who follows me (and the user cascade)","follows_pending_idx":"Pending follow requests, newest (re)sent first","blocks_blocked_id_idx":"Block checks from the blocked side","post_likes_post_id_idx":"Likes per post (repair job, post cascade). is_active is left out on purpose","comments_paper_id_created_at_idx":"Comments per post and paper; reply threads","comments_parent_id_idx":"Comments per post and paper; reply threads","comments_post_id_created_at_idx":"Comments per post and paper; reply threads","notifications_user_id_created_at_idx":"Notifications inbox","notifications_unread_idx":"Unread badge","saved_posts_user_id_created_at_idx":"Saved posts, newest first","question_attempts_user_id_created_at_idx":"Practice history and stats","sessions_user_id_idx":"Live sessions","auth_identities_user_id_idx":"Lookups and cascades by user","auth_tokens_user_id_idx":"Lookups and cascades by user","media_assets_owner_id_idx":"Media queue; a user's uploads","media_assets_status_idx":"Media queue; a user's uploads","papers_field_id_idx":"Content by field or topic","learn_items_topic_id_idx":"Content by field or topic","questions_topic_id_idx":"Content by field or topic","papers_trend_idx":"Research collection in trend order","papers_search_idx":"Paper search, English and Bangla","papers_sync_idx":"Papers due for ingestion","paper_edges_cited_idx":"\"Built on by\"","paper_saves_user_idx":"Saved list and Up next","reading_passes_read_idx":"Read list","research_outputs_user_idx":"Saved AI outputs","trails_creator_idx":"A creator's trails, the public list, trails with a paper","trails_published_idx":"A creator's trails, the public list, trails with a paper","trail_items_paper_idx":"A creator's trails, the public list, trails with a paper","posts_topic_idx":"Reels by concept","outbox_pending_idx":"Outbox queue","reports_status_created_at_idx":"Moderation queue; lookups by target","reports_target_type_target_id_idx":"Moderation queue; lookups by target","audit_log_actor_id_created_at_idx":"Audit lookups","audit_log_entity_type_entity_id_idx":"Audit lookups","users_username_idx":"Fuzzy search","topics_name_idx":"Fuzzy search","posts_to_tsvector_idx":"Full-text search","learn_items_to_tsvector_idx":"Full-text search","courses_to_tsvector_idx":"Full-text search"},"tour":[{"title":"The database in one sentence","text":["One PostgreSQL database holds everything the app stores: **{tables} tables**, grouped into **{areas} areas**.","This tour shows one idea at a time. You don’t need to remember table names yet."],"visual":"areas"},{"title":"Every row has two ids","text":["Each row has an internal number, `id`, that tables use to point at each other.","It also has a random `public_id`. That is the only id the app ever sees, so nobody can guess or count rows from it."],"visual":{"kind":"table","head":["Column","Example","Who sees it"],"rows":[["id","1042","Only the server"],["public_id","7f3c…e91a","The app"]],"prose":[2]}},{"title":"Accounts are at the centre","text":["`users` has one row per account. {in:users} links from {inFrom:users} tables point to it, more than any other table.","Next to it are the rows that sign a person in: one per device, plus Google sign-in links and one-time email codes."],"tables":["users","sessions","auth_identities","auth_tokens"]},{"title":"What happens when something is deleted","text":["Every link between tables says what happens to a row when the row it points to is deleted. There are only three answers."],"visual":{"kind":"rules","cascade":"A person’s sessions go with their account. {cascade} links work this way.","setnull":"A comment stays as “[deleted]” so replies keep their place. {setnull} links.","restrict":"A field with papers in it can’t be deleted. {restrict} links."}},{"title":"Following and blocking","text":["A follow is one row per pair of people. Unfollowing doesn’t delete it: its status becomes `inactive`, and following again switches it back.","That is why following, unfollowing and following again sends only one notification. A block hides two people from each other everywhere."],"visual":{"kind":"flow","steps":["pending or accepted","inactive","accepted again"]},"tables":["follows","blocks"]},{"title":"Posts, likes and comments","text":["A post is text, an image or a reel. A like works like a follow: one row per person and post, switched on and off.","Comments live in one table for both posts and papers. Notifications record who did what to whom."],"tables":["posts","post_likes","saved_posts","comments","notifications"]},{"title":"Counts are stored, not counted","text":["Like, comment and follower counts are numbers kept on the row, so a profile or a post loads without counting anything.","The background worker adds or subtracts one for each change, and checks every hour that the numbers are still right."],"visual":{"kind":"flow","steps":["someone likes","event written","worker adds 1 to like_count"]},"tables":["posts","users","outbox_events"]},{"title":"Uploads","text":["Every image and video, whatever it is for, is one row in `media_assets`. The worker processes it and only then can it appear.","The table stores file keys, not web addresses, so the files can move to another storage service without changing data."],"visual":{"kind":"flow","steps":["uploading","processing","ready"]},"tables":["media_assets"]},{"title":"Learning content","text":["A `topic` is one concept, such as “Softmax”. Lessons, notes, quizzes, reels and paper prerequisites all hang off topics.","Courses put learn items in order. The database remembers how far each person got and which lessons they finished."],"tables":["topics","learn_items","courses","course_items","course_progress","learn_item_completions"]},{"title":"Practice","text":["Questions belong to a topic. A quiz is a named set of questions in a fixed order.","Every answer is kept as its own row, which is what accuracy, streaks and “quiz done” are worked out from."],"tables":["questions","quizzes","quiz_questions","question_attempts"]},{"title":"The paper collection","text":["Papers are grouped by topic chips (`fields`). Each paper has a Paper Card in English and in Bangla.","Citation counts, upvotes and other details come from OpenAlex, Semantic Scholar and Hugging Face. Only the background worker talks to them; the app just reads our tables."],"tables":["fields","papers","paper_cards"]},{"title":"Reading a paper","text":["Saving a paper is a bookmark. Reading progress is separate and has three steps, plus a private note only its owner can see.","The first saved paper not yet read is shown as “Up next”."],"visual":{"kind":"flow","steps":["saved","Explored","Studied","Reproduced"]},"tables":["paper_saves","reading_passes"]},{"title":"How papers connect","text":["Citation links show what a paper builds on and what built on it. Each paper lists the concepts to learn first, each linked to one of our lessons, quizzes or reels.","Anyone can make a trail: a reading path through papers, one line per step."],"tables":["paper_edges","paper_prerequisites","trails","trail_items"]},{"title":"The worker’s to-do list and the record of admin actions","text":["When a change needs follow-up work (a notification, a count, an email), the same transaction writes a row to `outbox_events`. The worker works through them in order.","Every admin and security action is written to `audit_log`. Both keep plain ids on purpose, so they outlive what they describe."],"tables":["outbox_events","audit_log"]},{"title":"You’ve seen the whole shape","text":["From here, open any area to see its tables, then open a table to see its columns and links one tab at a time.","Reference has the detailed lists: every link, every index, the migrations and the known gaps."],"visual":"next"}],"reference":[{"id":"conventions","title":"Conventions","desc":"The patterns almost every table follows","sections":[{"items":[{"title":"Internal keys","text":"`id bigint GENERATED ALWAYS AS IDENTITY`. For joins only; **never sent to clients**."},{"title":"Public keys","text":"`public_id uuid UNIQUE` on every row a client can name."},{"title":"Slugs","text":"`topics.slug` and `fields.slug` name those rows in URLs."},{"title":"Enums","text":"`text` with `CHECK (… IN (…))`. The same lists live in `packages/shared`; change both together."},{"title":"Timestamps","text":"`timestamptz`. `updated_at` is set by the application, not triggers."},{"title":"Soft delete","text":"`deleted_at` on `users`, `posts` and `comments`: hidden at once, purged later."},{"title":"Toggle rows","text":"Relationships that trigger side effects keep one row per pair and flip a state instead of delete + insert: `post_likes.is_active`, `follows.status = 'inactive'`. Only the first activation ever notifies.","tag":"new"},{"title":"Stored counters","text":"`posts.like_count`, `comment_count`, `users.follower_count`, `following_count`. Moved ±1 by the worker, exactly once per event; repaired hourly."},{"title":"Ingested fields","text":"Scholarly metadata is written only by the worker. Descriptive fields are filled only when empty, so staff edits win; counts, TLDR and ids refresh every 7 days.","tag":"005"},{"title":"Languages","text":"Content that exists per language has `lang` `en` or `bn` (`paper_cards`, `trails`).","tag":"005"},{"title":"Publishing workflow","text":"Team content moves `draft → published → archived`. Trails: `draft → published`, and `removed` by a moderator."},{"title":"Storage keys, not URLs","text":"`media_assets` stores keys; URLs are built at read time."},{"title":"Ordered children","text":"`position` in a `DEFERRABLE` primary key (course items, quiz questions, roadmap steps, trail items), so a list can be reordered in one transaction."},{"title":"Polymorphic references","text":"`reports.target_id`, `outbox_events.entity_id`, `audit_log.entity_id`: no FK on purpose."}]}]},{"id":"links","title":"All links between tables","desc":"Every foreign key ({links}) and what deleting does","builtin":"links"},{"id":"indexes","title":"Indexes","desc":"What is indexed, and for which screen","builtin":"indexes"},{"id":"rules","title":"Rules the database enforces","desc":"Checks on values, and the errors the API returns","sections":[{"title":"Checks on values","items":[{"title":"Post media","text":"`type = 'text' OR media_id IS NOT NULL`","on":"posts"},{"title":"Comment target","text":"`(post_id IS NULL) \u003c> (paper_id IS NULL)`","on":"comments"},{"title":"MCQ options","text":"`kind = 'short' OR cardinality(options) >= 2`","on":"questions"},{"title":"Learn item media","text":"`kind = 'text' OR media_url IS NOT NULL OR media_id IS NOT NULL`","on":"learn_items"},{"title":"Follow status","text":"`status IN ('accepted', 'pending', 'inactive')`; no self-follow","on":"follows"},{"title":"No self-block","text":"`blocker_id \u003c> blocked_id`","on":"blocks"},{"title":"Reading steps","text":"`step BETWEEN 0 AND 3`; each step's time set exactly while the step holds; note ≤ 400 characters","on":"reading_passes"},{"title":"One link at most","text":"`num_nonnulls(learn_item_id, quiz_id, reel_post_id) \u003c= 1`","on":"paper_prerequisites"},{"title":"No self-citation","text":"`citing_paper_id \u003c> cited_paper_id`","on":"paper_edges"},{"title":"Counts","text":"`citation_count >= 0`, `hf_upvotes >= 0`, `trend_rank > 0`","on":"papers"}]},{"title":"Errors the API returns","table":{"head":["When the database refuses","The API answers"],"rows":[["Unique violation","`409 ALREADY_EXISTS`"],["Foreign key still referenced (restrict)","`409 IN_USE`"],["Missing foreign key target","`400 INVALID_REFERENCE`"],["CHECK, NOT NULL or bad format","`400 INVALID_DATA`"]],"prose":[0]}}]},{"id":"lifecycle","title":"How data changes and expires","desc":"Status flows, and what is cleaned up when","sections":[{"title":"Status flows","items":[{"title":"Like","steps":["active","inactive","active"],"text":"One row for ever. Only the first activation notifies; each real change moves `like_count` by one."},{"title":"Follow","steps":["pending / accepted","inactive","pending / accepted"],"text":"`pending` for private accounts until accepted. Unfollow, withdraw, decline and block all go to `inactive`."},{"title":"Reading pass","steps":["0 not read","1 Explored","2 Studied","3 Reproduced"],"text":"Cumulative. Lowering a step clears the later step times. Mark read only raises to 1."},{"title":"Trail","steps":["draft","published","removed"],"text":"Publishing needs 2+ papers. `removed` is a moderator action."},{"title":"Paper ingestion","steps":["synced_at NULL","synced","refresh after 7 days"],"text":"Import or \"sync now\" queue a paper; the worker's papers loop takes 10 a minute."},{"title":"Media asset","steps":["uploading","processing","ready","or failed"],"text":"The worker measures duration and builds variants."},{"title":"Post","steps":["processing","published","removed"],"text":"`removed` is a moderator action, separate from `deleted_at`."},{"title":"Team content","steps":["draft","published","archived"],"text":"Papers, courses, learn items, questions and quizzes."}]},{"title":"What is cleaned up, and when","items":[{"title":"Deleted accounts","text":"Hidden at once. After 30 days: comments become `[deleted]`, the user row is deleted (cascading), their media is removed, and a `user.purge` audit entry is written."},{"title":"Deleted posts","text":"Hidden at once; row and media deleted after 30 days."},{"title":"Stored counters","text":"Post and follow counts recounted wherever they drifted (mainly after purges)."},{"title":"Inactive likes and follows","text":"Kept: they are what stops re-notification. They go when the user or post is purged."},{"title":"Research order","text":"`trend_rank` recomputed hourly and after every ingestion round."},{"title":"Paper metadata","text":"Refreshed from the sources every 7 days per paper; a failed sync keeps `sync_error` and is retried after 7 days or on \"sync now\"."},{"title":"Reading passes, saves, outputs, trails","text":"Kept until the user or the paper is deleted."},{"title":"Abandoned uploads","text":"`uploading`/`failed` assets older than 1 day that nothing uses."},{"title":"Sessions","text":"Expired or revoked more than 30 days ago."},{"title":"Email codes","text":"Expired or used more than 7 days ago."},{"title":"Outbox events","text":"Processed more than 30 days ago. Events with 10 failed attempts stay as dead letters."},{"title":"Raw uploads","text":"Deleted as soon as processing ends (they hold GPS and camera metadata)."}]}]},{"id":"research","title":"Research tab features","desc":"Each feature of the spec and the tables behind it (migration 005)","sections":[{"intro":"Group A of the Research spec, feature by feature. Open one to see what existed and what was added.","items":[{"title":"A1: Paper collection, topic chips, trending order","text":["**Already there:** Papers in a field (fields = chips); newest-first list","**Added:** Scholarly metadata on `papers`, `fields.position`, ingestion worker (OpenAlex, Semantic Scholar, Hugging Face), `trend_rank`, default `?sort=trend`"],"tables":["papers","fields"]},{"title":"A2: Search papers (EN + BN)","text":["**Already there:** English full text on title + main idea","**Added:** `paper_cards` per language, `papers.search_vector` over title, authors and both card questions, `bangla` configuration"],"tables":["papers","paper_cards"]},{"title":"A3: Save / bookmark, \"Up next\"","text":["**Already there:** \"saved\" was a tracker status","**Added:** `paper_saves`; `GET /me/papers/up-next`"],"tables":["paper_saves"]},{"title":"A4: Three-step tracker and private note","text":["**Already there:** saved · reading · completed","**Added:** `reading_passes`: step 0–3, per-step times, 400-character note, monthly counts"],"tables":["reading_passes"]},{"title":"A5: My papers","text":["**Already there:** —","**Added:** Saved / Read lists; `research_outputs` reopened without AI"],"tables":["paper_saves","reading_passes","research_outputs"]},{"title":"A6: Related papers: lineage","text":["**Already there:** \"Related\" by shared topics","**Added:** `paper_edges` with intent; `GET /papers/:id/lineage`; staff-only `contrasting`"],"tables":["paper_edges"]},{"title":"A7: Creator reading paths (trails)","text":["**Already there:** Staff roadmap, one per field","**Added:** `trails`, `trail_items`; reportable and moderated"],"tables":["trails","trail_items"]},{"title":"A9: Discussion, comments, moderation","text":["**Already there:** **Complete**: `comments.paper_id`, reports, blocks, rate limits, cursors, moderation","**Added:** Nothing (upvotes wait for A15)"],"tables":["comments","reports"]},{"title":"A10: Open the original paper","text":["**Already there:** `paper_url`","**Added:** `pdf_url`, `arxiv_id`, `links.open_url`"],"tables":["papers"]},{"title":"A13: Prerequisite → Learn matching","text":["**Already there:** Prerequisite topics with their learn items","**Added:** Label, why, typed link and `suggested_by` on `paper_prerequisites`; `user_known_topics`; `learn_item_completions`; `posts.topic_id`; computed `done`"],"tables":["paper_prerequisites","user_known_topics","learn_item_completions","posts"]}]},{"title":"How the data flows","items":[{"title":"Ingestion (worker only)","steps":["import / stale","OpenAlex","Semantic Scholar","papers + paper_edges"],"text":"Then `trend_rank`. Hugging Face daily papers every 6 h set upvotes, trending and code links."},{"title":"Search","steps":["paper or card change","refresh_paper_search()","search_vector"],"text":"Query: `websearch_to_tsquery('english', q) || websearch_to_tsquery('bangla', q)`."},{"title":"Reading loop","steps":["save","Up next","Mark read","Studied","Reproduced"],"text":"Counts per month feed Profile → Reading."},{"title":"Learn before reading","steps":["prerequisite","lesson · note · quiz · reel","done?"],"text":"Done = completed lesson or note, every quiz question answered, or \"I already know this\"."}]},{"title":"Decisions worth knowing","items":[{"title":"Semantic Scholar intents","text":"Its labels are background, methodology and result: no supporting or contrasting. Mapped without guessing; `contrasting` comes only from staff (`PUT /admin/paper-edges`)."},{"title":"Edges only inside the collection","text":"Every lineage row must be tappable. Built from each paper's own references, so every pair in the collection is found."},{"title":"Trend rank","text":"HF trending in the last 14 days first (most upvotes), then most cited, then newest. Stored as a dense 1..n for a cheap keyset page."},{"title":"Staff edits win","text":"Ingestion fills title, authors, venue, abstract only when empty; an import's empty title is filled on its first sync."},{"title":"Existing tables kept","text":"`user_papers` and the Prototype 2 summary columns on `papers` are unchanged; the new tables were backfilled from them."},{"title":"bangla = simple","text":"PostgreSQL ships no Bangla stemmer. Word splitting depends on the server locale; a C locale keeps every Bangla sign in the word."},{"title":"Concept = topic","text":"`user_known_concepts` of the spec is `user_known_topics`; reels get `posts.topic_id`."}]}]},{"id":"efficiency","title":"Efficiency changes","desc":"Toggle rows and stored counts (migration 004)","sections":[{"items":[{"title":"Likes are toggle rows","before":"Unlike deleted the row; a re-like inserted a new one and sent the author a new notification and push every time. Like → unlike → like could spam.","after":"One row per user and post with `is_active`. Unlike sets it false, re-like sets it true. Only the first like ever notifies. The toggle is a HOT update (no index writes).","where":"posts.service.ts likePost / unlikePost · worker post.liked","tables":["post_likes"]},{"title":"Follows are toggle rows","before":"Unfollow, withdraw, decline and block deleted the row, so following again re-sent the follow / request notification.","after":"Status `inactive` keeps the row; following again reactivates it. Only the first follow ever notifies. Requests are listed by `updated_at`, the time they were (re)sent.","where":"users.service.ts follow / unfollow / accept / decline / block","tables":["follows"]},{"title":"Counters move by one instead of recounting","before":"Every like, unlike, comment or comment delete made the worker `COUNT(*)` all likes *and* all comments of the post: O(n) per event on a busy post.","after":"The worker adds or subtracts 1. It claims each event (`processed_at IS NULL`) in the same transaction, so a delta is applied exactly once. The hourly repair still catches drift.","where":"worker/outbox.ts · moderation only emits comment.deleted for a live comment","tables":["posts"]},{"title":"Stored follower and following counts","before":"Every profile view ran two `COUNT(*)` over `follows`. \"People to follow\" counted followers for *every* active user, then sorted them.","after":"`users.follower_count` / `following_count`, moved by `follow.changed` events. Suggestions read `users_suggest_idx` in order and stop after the limit.","where":"migration 004 · users.service.ts getProfile / suggestUsers · worker follow.changed","tables":["users"]},{"title":"Interests write only the difference","before":"Saving interests deleted every row and inserted them all again, even when nothing changed.","after":"Removed fields are deleted, new ones inserted; unchanged rows are left alone.","where":"users.service.ts setInterests","tables":["user_fields"]},{"title":"Index for the unread badge","before":"The unread count scanned all of a user's notifications through `(user_id, created_at)`.","after":"`notifications_unread_idx (user_id) WHERE NOT is_read`: only unread rows.","where":"migration 004 · notifications.service.ts countUnread","tables":["notifications"]},{"title":"Redundant reels index dropped","before":"The Prototype 1 index `posts (created_at DESC) WHERE type = 'reel'` sat beside `posts_reels_idx`, which covers the same order with the filters the query uses.","after":"Dropped: one less index to write on every reel insert.","where":"migration 004","tables":["posts"]}]},{"title":"Looked at and left as they are","items":[{"title":"saved_posts","text":"Not toggled: unsaving has no side effects, and a re-save must move the post to the top of the list, which rewrites the indexed `created_at` anyway."},{"title":"user_papers, course_progress","text":"Already one upsert on the same row."},{"title":"blocks","text":"Rare, with no side effects. Delete + insert is fine."},{"title":"question_attempts","text":"Append-only by design: each attempt is history."},{"title":"posts_count on profiles","text":"Still `COUNT(*)`, served by the partial feed index. Store it if profiles get hot."}]}]},{"id":"migrations","title":"Migrations","desc":"The six SQL files, in order","sections":[{"items":[{"title":"1. 1795305600000_prototype-v1-schema.sql","text":"The Prototype 1 schema: 16 tables, `pg_trgm`, search indexes."},{"title":"2. 1795305600001_prototype-2.sql","text":"The Prototype 2 appendix SQL (14 new tables): public ids, slugs, user status and privacy, media, publishing, auth, safety, outbox, audit."},{"title":"3. 1795305600002_prototype-2-backfill.sql","text":"Slugs `NOT NULL`; post media into `media_assets`; drops `posts.media_url`; relaxes the learn item media check."},{"title":"4. 1795305600003_sessions-public-id-and-2fa.sql","text":"`sessions.public_id`, two-factor columns, and indexes for feed, reels, saves and follow requests."},{"title":"5. 1795305600004_toggles-and-stored-counts.sql","text":"Toggle rows for likes and follows, stored follow counts, the unread and suggestion indexes, and drops the redundant reels index. See [Efficiency (004)](#changes)."},{"title":"6. 1795305600005_research-collection.sql","text":"Research tab Group A: the `bangla` search configuration, paper metadata and `search_vector`, `paper_cards`, `paper_saves`, `reading_passes`, `research_outputs`, `paper_edges`, `trails`, `trail_items`, Learn before reading links, `user_known_topics`, `learn_item_completions`. 9 new tables. See [Research (005)](#research)."}],"note":"Never edit a migration that has been applied: add a new one. After a schema change, regenerate `src/db/types.ts` with `pnpm db:types`."}]},{"id":"gaps","title":"Known gaps","desc":"What is planned, and when","sections":[{"items":[{"title":"Random UUIDv4 public ids","text":"Switch to `uuidv7()` on PostgreSQL 18 for better index locality.","tag":"waiting on PG 18"},{"title":"One worker only (advisory lock)","text":"Lease columns plus `FOR UPDATE SKIP LOCKED`. The claim step already makes a second worker harmless.","tag":"when throughput needs it"},{"title":"Counter repair scans every row hourly","text":"Run it daily, or only for posts and users touched by purges.","tag":"at hundreds of thousands of posts"},{"title":"Practice stats aggregate all attempts","text":"A per-user, per-topic stats table updated by the worker.","tag":"when users have thousands of attempts"},{"title":"Random practice questions use `ORDER BY random()`","text":"Sample by id range or `TABLESAMPLE`.","tag":"at tens of thousands of questions"},{"title":"`user_papers` duplicates the new tracker","text":"Drop it and `/papers/:id/status` once no client uses them.","tag":"after the app moves"},{"title":"Bangla search is unstemmed","text":"Give the `bangla` configuration a real dictionary; queries stay the same.","tag":"later"},{"title":"Contrasting citations only by hand","text":"A source with citation stances, if one becomes affordable.","tag":"later"},{"title":"No discovery queue for new papers","text":"A `paper_candidates` table from Hugging Face daily papers, reviewed by staff.","tag":"later"},{"title":"Comment upvotes on paper discussion","text":"`comment_votes` plus a stored count, with Paper Clubs (A15).","tag":"with A15"},{"title":"Research Groups B and C","text":"They write `paper_cards` (source ai), `paper_prerequisites` (suggested_by ai) and `research_outputs`.","tag":"next"},{"title":"Search runs on Postgres","text":"Elasticsearch indexer reading the existing `search.sync` events.","tag":"later"},{"title":"No user locale","text":"`users.locale` for Bangla push and email.","tag":"later"},{"title":"One DB role with full rights","text":"DML-only app role, DDL migration role, PgBouncer, PITR backups.","tag":"before production"},{"title":"Large tables","text":"Partition `notifications` and `question_attempts`; read replica.","tag":"at millions of rows"}]}]}]}}</script>
<script>/* ============================================================
   Data. `facts` is read from the database; `guide` is the text
   written for people. The adapter turns both into the structures
   the views below use (DOMAINS, TABLES, INDEXES, TOUR, REF…).
   ============================================================ */
const DATA = typeof SCHEMA_GUIDE_DATA !== 'undefined' ? SCHEMA_GUIDE_DATA : JSON.parse(document.getElementById('schema-guide-data').textContent);
const FACTS = DATA.facts || { tables: [] };
const GUIDE = DATA.guide || {};
const PROJECT = { name: 'This project', code: ['sql'], ...(GUIDE.project || {}) };
const DIALECT = { mysql: 'mysql', mariadb: 'mysql', sqlite: 'sqlite' }[(FACTS.source || {}).dialect || (FACTS.source || {}).kind] || 'postgres';
const BRAND = `${PROJECT.name} schema guide`;
const HEADLINE = PROJECT.headline ? md(PROJECT.headline) : `The ${escHtml(PROJECT.name)} database, one step at a time`;
const HL = { label: 'new', short: 'added recently', note: 'Added recently.', tables: [], columns: [], indexes: [], ...(GUIDE.highlight || {}) };
const LABELS = {
  refused: 'Can be refused',
  softDeleteWhy: 'The app sets deleted_at. This real DELETE runs when the row is finally removed.',
  lookup: 'Every link, index and rule, one topic per page',
  selfCascade: 'its own rows, every depth',
  ...(GUIDE.labels || {}),
};
const CODE_NAME = { sql: 'SQL', kysely: 'Kysely', knex: 'Knex' };
const CODE = ['sql', ...(PROJECT.code || []).filter((k) => k !== 'sql' && CODE_NAME[k])];

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
/** Mini-markdown for guide text: `code`, **bold**, *em*, [[table]], [text](#route). Everything else is escaped. */
function md(text) {
  if (text == null) return '';
  const code = [];
  const s = escHtml(text)
    .replace(/`([^`]+)`/g, (_, c) => `\u0001${code.push(c) - 1}\u0001`)
    .replace(/\[\[([^\]\s]+)\]\]/g, (_, t) => `<a class="t" href="#table/${t}">${t}</a>`)
    .replace(/\[([^\]]+)\]\((#[^)\s]*)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, '$1<em>$2</em>');
  return s.replace(/\u0001(\d+)\u0001/g, (_, i) => `<code>${code[i]}</code>`);
}
const SLUG = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'area';
const RULE_OF = (d) => (d === 'cascade' ? 'cascade' : d === 'setnull' || d === 'setdefault' ? 'setnull' : 'restrict');

/* ---------- Areas: from the guide, else grouped by name prefix ---------- */
const AREAS_RAW = (() => {
  const names = FACTS.tables.map((t) => t.name);
  let areas = (GUIDE.areas || []).map((a) => ({ id: a.id || SLUG(a.name), name: a.name, desc: a.desc || '', tables: (a.tables || []).filter((n) => names.includes(n)) }));
  if (!areas.length) {
    const groups = new Map();
    for (const n of names) {
      const p = n.split(/[_.]/)[0];
      if (!groups.has(p)) groups.set(p, []);
      groups.get(p).push(n);
    }
    const big = [...groups].filter(([, l]) => l.length > 1);
    areas = big.length >= 2 && big.length <= 12
      ? big.map(([p, l]) => ({ id: SLUG(p), name: p.charAt(0).toUpperCase() + p.slice(1), desc: `Tables whose names start with \`${p}\`.`, tables: l }))
      : [{ id: 'all', name: 'All tables', desc: `Every table in the ${PROJECT.name} database.`, tables: names }];
  }
  const placed = new Set(areas.flatMap((a) => a.tables));
  const rest = names.filter((n) => !placed.has(n));
  if (rest.length) areas.push({ id: 'other', name: 'Other tables', desc: 'Tables without an area yet.', tables: rest });
  return areas.filter((a) => a.tables.length);
})();
const DOMAINS = AREAS_RAW.map((a) => ({ id: a.id, name: md(a.name), desc: md(a.desc) }));
const AREA_INDEX = Object.fromEntries(DOMAINS.map((d, i) => [d.id, i]));
const AREA_OF = Object.fromEntries(AREAS_RAW.flatMap((a) => a.tables.map((n) => [n, a.id])));

/* ---------- The hub: the table most other tables point to ---------- */
const HUB = (() => {
  const has = (n) => FACTS.tables.some((t) => t.name === n);
  if (GUIDE.hub !== undefined) return GUIDE.hub && has(GUIDE.hub) ? GUIDE.hub : null;
  const refs = new Map();
  for (const t of FACTS.tables) for (const f of t.foreignKeys || []) if (f.table !== t.name) refs.set(f.table, (refs.get(f.table) || new Set()).add(t.name));
  let best = null;
  let n = 0;
  for (const [k, s] of refs) if (s.size > n) [best, n] = [k, s.size];
  return best && n >= 3 && n >= FACTS.tables.length * 0.2 ? best : null;
})();
const HUB_AREA = HUB ? AREA_OF[HUB] : null;

/* ---------- Tables ---------- */
const BADGE_DEFAULTS = {
  public_id: 'Rows have a random <code>public_id</code> that the app uses; the internal <code>id</code> never leaves the server.',
  'soft delete': 'Deleting hides a row at once (<code>deleted_at</code>); it is removed for good later.',
  'stored counts': 'Counts are stored on the row instead of counted on every view.',
  'composite PK': 'The key is a set of columns, so the same combination can only appear once.',
  'self-reference': 'Rows can point to other rows of the same table.',
  ordered: 'Rows keep a stored position, so their order is not just sorted by time.',
  slug: 'Rows have a readable <code>slug</code> used in links.',
};
function autoBadges(ft) {
  const cols = ft.columns.map((c) => c.name);
  return [
    cols.includes('public_id') && 'public_id',
    cols.includes('deleted_at') && 'soft delete',
    cols.some((c) => /_count$/.test(c)) && 'stored counts',
    (ft.primaryKey || []).length > 1 && 'composite PK',
    (ft.foreignKeys || []).some((f) => f.table === ft.name) && 'self-reference',
    cols.some((c) => c === 'position' || c === 'sort_order') && 'ordered',
    cols.includes('slug') && 'slug',
  ].filter(Boolean);
}
function autoPurpose(ft) {
  const parents = [...new Set((ft.foreignKeys || []).map((f) => f.table).filter((n) => n !== ft.name))];
  const list = (l) => l.slice(0, 3).map((p) => `<code>${escHtml(p)}</code>`).join(l.length === 2 ? ' and ' : ', ');
  if ((ft.primaryKey || []).length > 1 && parents.length >= 2) return `Links ${list(parents)} rows.`;
  if (parents.length) return `Points to ${list(parents)}.`;
  return 'Not described yet.';
}
const NULLABLE = new Set();
const TABLES = (() => {
  const g = GUIDE.tables || {};
  const hlTables = new Set(HL.tables || []);
  const hlCols = new Set(HL.columns || []);
  const order = AREAS_RAW.flatMap((a) => a.tables);
  return order.map((name) => {
    const ft = FACTS.tables.find((t) => t.name === name);
    const gt = g[name] || {};
    const pk = new Set(ft.primaryKey || []);
    const uniq = new Set((ft.uniques || []).filter((u) => u.length === 1).map((u) => u[0]));
    const fkCols = new Set((ft.foreignKeys || []).flatMap((f) => f.columns));
    const notNull = new Map(ft.columns.map((c) => [c.name, !!c.notNull]));
    // Display order: the order of guide.tables[name].columns, then the rest in database order.
    const listed = gt.columns ? Object.keys(gt.columns) : [];
    const rank = (n) => (listed.includes(n) ? listed.indexOf(n) : listed.length + ft.columns.findIndex((c) => c.name === n));
    const fks = [...(ft.foreignKeys || [])].sort((a, b) => rank(a.columns[0]) - rank(b.columns[0])).map((f) => {
      const c = f.columns.join(', ');
      if (f.columns.some((x) => !notNull.get(x))) NULLABLE.add(`${name}.${c}`);
      return { c, cols: f.columns, to: f.table, refCols: f.refColumns && f.refColumns.length ? f.refColumns : ['id'], d: RULE_OF(f.onDelete) };
    });
    const columns = [...ft.columns].sort((a, b) => rank(a.name) - rank(b.name)).map((c) => {
      const k = [pk.has(c.name) && 'pk', fkCols.has(c.name) && 'fk', uniq.has(c.name) && 'u'].filter(Boolean).join('+');
      let note = '';
      if (gt.columns && gt.columns[c.name] != null) note = md(gt.columns[c.name]);
      else if (!gt.columns && c.values && c.values.length) note = c.values.map(escHtml).join(' · ');
      return { n: c.name, t: c.type, k: k || undefined, note, isNew: hlCols.has(`${name}.${c.name}`), values: c.values };
    });
    const checks = gt.checks
      ? gt.checks.map(md)
      : (ft.checks || []).filter((c) => !c.column).map((c) => `<code>${escHtml(c.expr)}</code>`);
    return {
      name,
      domain: AREA_OF[name],
      purpose: gt.purpose ? md(gt.purpose) : autoPurpose(ft),
      badges: gt.badges || autoBadges(ft),
      columns,
      fks,
      notes: (gt.notes || []).map(md),
      checks,
      isNewTable: hlTables.has(name),
    };
  });
})();

/* ---------- Indexes, checks ---------- */
const INDEXES = (() => {
  const gi = GUIDE.indexes || {};
  const hl = new Set(HL.indexes || []);
  const out = [];
  for (const name of AREAS_RAW.flatMap((a) => a.tables)) {
    const ft = FACTS.tables.find((t) => t.name === name);
    const order = Object.keys(gi);
    const irank = (n) => (order.includes(n) ? order.indexOf(n) : order.length);
    for (const i of [...(ft.indexes || [])].sort((a, b) => irank(a.name) - irank(b.name))) {
      const cols = (i.columns || []).join(', ');
      const auto = `${i.unique ? 'Unique on' : 'On'} ${cols}${i.where ? ', some rows only' : ''}`;
      out.push({
        t: [name],
        name: i.name,
        purpose: gi[i.name] ? md(gi[i.name]) : escHtml(auto),
        idx: `${i.unique ? 'unique ' : ''}${i.name} (${cols})${i.where ? ` WHERE ${i.where}` : ''}`,
        isNew: hl.has(i.name),
      });
    }
  }
  return out;
})();
const ALL_CHECKS = FACTS.tables.flatMap((t) => (t.checks || []).filter((c) => !c.column).map((c) => ({ table: t.name, ...c })));
const DEFAULT_IMPACT = HUB || (TABLES[0] || {}).name;
const DEFAULT_JOIN = (() => {
  if (GUIDE.joinExample && GUIDE.joinExample.length === 2) return GUIDE.joinExample;
  const parents = (n) => [...new Set(((FACTS.tables.find((t) => t.name === n) || {}).foreignKeys || []).map((f) => f.table).filter((p) => p !== n && p !== HUB))];
  const ranked = TABLES.map((t) => t.name).filter((n) => n !== HUB).sort((x, y) => parents(y).length - parents(x).length);
  for (const a of ranked) for (const p of parents(a)) for (const g of parents(p)) if (g !== a && !parents(a).includes(g)) return [a, g];
  for (const a of ranked) if (parents(a)[0]) return [a, parents(a)[0]];
  return [(TABLES[0] || {}).name, (TABLES[1] || TABLES[0] || {}).name];
})();

/* ---------- Text helpers used by the tour and the reference ---------- */
/** Numbers in guide text: {tables} {areas} {links} {cascade} {setnull} {restrict} {hub} {in:t} {inFrom:t} {out:t} {outTo:t}. */
function tokens(s) {
  return s
    .replace(/\{(tables|areas|links|cascade|setnull|restrict|hub)\}/g, (_, k) =>
      k === 'hub' ? (HUB ? `<code>${HUB}</code>` : '') : { tables: TABLES.length, areas: DOMAINS.length, links: EDGES.length, ...counts }[k],
    )
    .replace(/\{(in|inFrom|out|outTo):([\w.$-]+)\}/g, (_, k, n) =>
      k === 'in' ? into(n).length : k === 'inFrom' ? new Set(into(n).map((e) => e.from)).size : k === 'out' ? outOf(n).length : new Set(outOf(n).map((e) => e.to)).size,
    );
}
const rich = (s) => tokens(md(s));
function demoTable(v) {
  const prose = new Set(v.prose || []);
  return `<table><thead><tr>${(v.head || []).map((h) => `<th>${rich(h)}</th>`).join('')}</tr></thead><tbody>${(v.rows || [])
    .map((r) => `<tr>${r.map((c, i) => `<td${prose.has(i) ? ' style="font-family:var(--font)"' : ''}>${rich(String(c))}</td>`).join('')}</tr>`)
    .join('')}</tbody></table>`;
}

/* ---------- Tour ---------- */
function autoTour() {
  const steps = [
    { title: 'The database in one sentence', text: [`The ${PROJECT.name} database has **{tables} tables**, grouped into **{areas} areas**.`, 'This tour shows one idea at a time. You don’t need to remember table names yet.'], visual: 'areas' },
    { title: 'What happens when something is deleted', text: ['Every link between tables says what happens to a row when the row it points to is deleted. There are only three answers.'], visual: 'rules' },
  ];
  if (HUB) steps.push({ title: `\`${HUB}\` is at the centre`, text: [`{in:${HUB}} links from {inFrom:${HUB}} tables point to \`${HUB}\`, more than to any other table.`], tables: [HUB] });
  for (const a of AREAS_RAW) steps.push({ title: a.name, text: [a.desc], tables: a.tables.slice(0, 8) });
  steps.push({ title: 'You’ve seen the whole shape', text: ['From here, open any area to see its tables, then open a table to see its columns and links one tab at a time.', 'Reference has the detailed lists.'], visual: 'next' });
  return steps;
}
function tourVisual(v) {
  const kind = typeof v === 'string' ? v : v.kind;
  if (kind === 'areas') return `<ul class="areas">${DOMAINS.map((d) => `<li><a href="#explore/${d.id}">${d.name}</a><span>${count(tablesIn(d.id).length, 'table', 'tables')}</span></li>`).join('')}</ul>`;
  if (kind === 'rules') {
    const say = {
      cascade: 'The rows that point to it go too. {cascade} links work this way.',
      setnull: 'The rows stay, and their link is cleared. {setnull} links.',
      restrict: 'The delete stops while rows still point to it. {restrict} links.',
      ...(typeof v === 'object' ? v : {}),
    };
    return `<div class="three">${['cascade', 'setnull', 'restrict'].map((r) => `<div class="rule ${r}"><b>${RULE_NAME[r]}</b>${rich(say[r])}</div>`).join('')}</div>`;
  }
  if (kind === 'flow') return flow((v.steps || []).map(rich));
  if (kind === 'table') return `<div class="demo">${demoTable(v)}</div>`;
  if (kind === 'next') return `<div class="chips"><a class="btn primary" href="#explore">Explore the tables</a><a class="btn" href="#ref">Open the reference</a></div>`;
  return '';
}
function buildTour() {
  const steps = GUIDE.tour && GUIDE.tour.length ? GUIDE.tour : autoTour();
  return steps.map((s) => ({
    title: rich(s.title || ''),
    text: (Array.isArray(s.text) ? s.text : [s.text || '']).filter(Boolean).map(rich),

/* ---------- Reference ---------- */
const BUILTIN_REF = {

  indexes: { title: 'Indexes', desc: 'What is indexed, and why' },

let REF_TOPICS = [];
function buildRef() {
  const list = GUIDE.reference && GUIDE.reference.length ? GUIDE.reference : [{ builtin: 'links' }, { builtin: 'indexes' }, { builtin: 'checks' }];
  REF_TOPICS = list
    .map((r) => {
      const b = BUILTIN_REF[r.builtin] || {};
      return { id: r.id || r.builtin || SLUG(r.title), builtin: r.builtin, title: r.title || b.title || '', desc: r.desc || b.desc || '', sections: r.sections || [] };
    })
    .filter((r) => r.sections.length || (r.builtin === 'links' && EDGES.length) || (r.builtin === 'indexes' && INDEXES.length) || (r.builtin === 'checks' && ALL_CHECKS.length));
  return REF_TOPICS.map((r) => [r.id, rich(r.title), rich(r.desc)]);
}
function refItem(it) {
  const paras = it.text == null ? [] : Array.isArray(it.text) ? it.text : [it.text];
  const parts = [];
  if (it.steps) parts.push(flow(it.steps.map(rich)));
  paras.forEach((p, i) => parts.push(`<p${it.steps && i === 0 ? ' style="margin-top:12px"' : ''}>${rich(p)}</p>`));
  if (it.before || it.after) parts.push(`<div class="ba"><div class="before"><b>Before.</b> ${rich(it.before || '')}</div><div class="after"><b>After.</b> ${rich(it.after || '')}</div></div>`);
  if (it.where) parts.push(`<p class="hint" style="margin-top:10px">Where: ${rich(it.where)}</p>`);
  if (it.on) parts.push(`<p class="hint">On ${tlink(it.on)}</p>`);
  if (it.tables && it.tables.length) parts.push(chips(it.tables));
  return fold(rich(it.title || ''), parts.join(''), it.tag ? escHtml(it.tag) : '');
}
function refSection(s, first) {
  const head = s.title ? `<h2${first ? '' : ' class="block"'}>${rich(s.title)}</h2>` : '';
  const intro = s.intro ? `<p>${rich(s.intro)}</p>` : '';
  let body = (s.items || []).map(refItem).join('');
  if (body && s.title) body = `<div class="block" style="margin-top:12px">${body}</div>`;
  const table = s.table ? `<div class="demo${s.title ? ' block' : ''}" style="margin-top:12px">${demoTable(s.table)}</div>` : '';
  const note = s.note ? `<p class="hint block">${rich(s.note)}</p>` : '';
  return head + intro + body + table + note;
}
const BUILTIN_PAGE = {

};
function buildRefPages() {

/** "This table points to X": what happens to this row when the row it points to is deleted. */
function outSentence(e) {
  const then = {
    cascade: 'this row is deleted with it',
    setnull: `this row stays and <code>${e.col}</code> is cleared`,
    restrict: 'the delete is refused while this row exists',
  }[e.d];
  return `Each row points to one ${tlink(e.to)} row through <code>${e.col}</code>.<small>If that ${e.to} row is deleted, ${then}.</small>`;
}
/** "X points to this table": what happens to X's rows when a row here is deleted. */
function inSentence(e) {
  const then = {
    cascade: `its ${e.from} rows are deleted too`,
    setnull: `its ${e.from} rows stay, with <code>${e.col}</code> cleared`,
    restrict: `it can't be deleted while ${e.from} rows use it`,
  }[e.d];
  return `${tlink(e.from)} points here through <code>${e.col}</code>.<small>If a row here is deleted, ${then}.</small>`;
}

function panelLinks(t) {

const fold = (summary, inner, small = '') => `<details><summary>${summary}${small ? `<small>${small}</small>` : ''}</summary><div class="inner">${inner}</div></details>`;

const REF_PAGES = buildRefPages();

function linkGroups(rule) {
  const rows = EDGES.filter((e) => rule === 'all' || e.d === rule);
  const targets = [...new Set(rows.map((e) => e.to))].sort((a, b) => into(b).length - into(a).length || a.localeCompare(b));

    })
