<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showpass schema guide</title>
<script>
  // The page opens light. A saved choice is applied before the first paint, so it doesn't flash.
  try { const saved = localStorage.getItem('schema-guide-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* One idea per screen: Home → Tour (step by step), Explore (area → table → one tab), Reference (one topic per page). */
:root{
  --bg:#F6F7F4;          /* the app's own background */
  --surface:#FFFFFF;
  --ink:#1D2A2A;
  --ink-2:#465655;
  --muted:#6C7978;
  --line:#DDE3DF;
  --accent:#0E6E62;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3F0EC;
  --cascade:#B2432F; --cascade-soft:#F7E6E2;
  --setnull:#8C6400; --setnull-soft:#F5EDD9;
  --restrict:#56626D; --restrict-soft:#E8EBEE;
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121817; --surface:#1A2221; --ink:#E4ECEA; --ink-2:#B5C2BF; --muted:#86938F; --line:#2B3634;
    --accent:#5CC3B2; --accent-ink:#0C1514; --accent-soft:#1D3330;
    --cascade:#E58C7A; --cascade-soft:#3A2622; --setnull:#D9B45E; --setnull-soft:#352D1A; --restrict:#A2AEB9; --restrict-soft:#262E35;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1A2221; --ink:#E4ECEA; --ink-2:#B5C2BF; --muted:#86938F; --line:#2B3634;
  --accent:#5CC3B2; --accent-ink:#0C1514; --accent-soft:#1D3330;
  --cascade:#E58C7A; --cascade-soft:#3A2622; --setnull:#D9B45E; --setnull-soft:#352D1A; --restrict:#A2AEB9; --restrict-soft:#262E35;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
h1{font-size:2rem;letter-spacing:-.01em;margin-bottom:14px}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0 0 1em;max-width:68ch}
code,.t{font-family:var(--mono);font-size:.92em}
code{background:var(--accent-soft);color:var(--ink);padding:.05em .35em;border-radius:5px}
ul,ol{padding-left:1.2em}

/* ---- top bar ---- */
.bar{border-bottom:1px solid var(--line);background:var(--surface)}
.bar-in{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;justify-content:space-between}
.brand{font-weight:700;color:var(--ink);text-decoration:none}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{color:var(--ink-2);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.95rem}
nav.main a:hover{background:var(--accent-soft);color:var(--ink)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.theme-toggle{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;font-size:.95rem;color:var(--ink-2);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;margin-left:6px;cursor:pointer}
.theme-toggle:hover{border-color:var(--accent);color:var(--ink)}
.theme-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

main{max-width:760px;margin:0 auto;padding:36px 20px 80px}
.lede{font-size:1.15rem;color:var(--ink-2)}
.crumbs{font-size:.92rem;color:var(--muted);margin:0 0 18px;display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}
.crumbs span[aria-hidden]{opacity:.6}
.hint{color:var(--muted);font-size:.95rem}
.stack > * + *{margin-top:14px}
.block{margin-top:34px}
.block > h2{margin-bottom:12px}

/* ---- home: three ways in ---- */
.paths{display:grid;gap:14px;margin-top:28px}
.path{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.path:hover{border-color:var(--accent)}
.path b{display:block;font-size:1.2rem;margin-bottom:2px}
.path span{color:var(--ink-2)}
.path.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.path.primary span{color:inherit;opacity:.9}

/* ---- the tour: a row of cells that fills in ---- */
.row-progress{display:grid;grid-template-columns:repeat(var(--n),1fr);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin-bottom:10px}
.row-progress a{height:22px;border-left:1.5px solid var(--ink);background:var(--surface)}
.row-progress a:first-child{border-left:none}
.row-progress a.done{background:var(--accent)}
.row-progress a.now{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
.step-count{font-size:.92rem;color:var(--muted);margin:0 0 26px}
.tour h1{margin-bottom:16px}
.tour .visual{margin:26px 0}
.tour-nav{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.btn{display:inline-block;font:inherit;font-weight:600;padding:10px 20px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn[aria-disabled="true"]{visibility:hidden}

/* ---- small visual pieces ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.92rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.flow b{font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.flow i{font-style:normal;color:var(--muted)}
.demo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);max-width:520px}
.demo table{border-collapse:collapse;width:100%}
.demo th,.demo td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.demo tr:last-child td{border-bottom:none}
.demo th{font-size:.9rem;color:var(--muted);font-weight:600}
.demo td{font-family:var(--mono);font-size:.95rem}
.three{display:grid;gap:12px}
.rule{border-left:5px solid;border-radius:10px;padding:12px 16px}
.rule b{display:block}
.rule.cascade{border-color:var(--cascade);background:var(--cascade-soft)}
.rule.setnull{border-color:var(--setnull);background:var(--setnull-soft)}
.rule.restrict{border-color:var(--restrict);background:var(--restrict-soft)}
.areas{display:grid;gap:8px;padding:0;list-style:none;margin:0}
.areas li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0}
.areas li span{color:var(--muted)}

/* ---- lists of things to open ---- */
.list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.list > li{border-bottom:1px solid var(--line)}
.list a.item{display:block;padding:16px 4px;text-decoration:none;color:var(--ink)}
.list a.item:hover{background:var(--surface)}
.list a.item b{display:block;font-size:1.08rem}
.list a.item b.t{font-weight:500}
.list a.item span{color:var(--ink-2);font-size:.97rem}
.list a.item small{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
.search{width:100%;font:inherit;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);margin:18px 0 8px}
.search:focus{border-color:var(--accent);outline:none}

/* ---- table page ---- */
.table-title{font-family:var(--mono);font-weight:500;font-size:2rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:26px 0 24px;border-bottom:1px solid var(--line)}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--ink-2);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--ink-2);padding:0;list-style:none;margin:0 0 24px}
.facts b{color:var(--ink)}
.know{padding-left:1.1em}
.know li{margin-bottom:10px}
.cols{list-style:none;padding:0;margin:0}
.cols li{padding:14px 0;border-bottom:1px solid var(--line)}
.cols li:first-child{padding-top:0}
.col-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.col-head .t{font-weight:500;font-size:1.02rem}
.col-head .type{color:var(--muted);font-size:.88rem;font-family:var(--mono)}
.cols p{margin:4px 0 0;color:var(--ink-2)}
.pill{display:inline-block;font-size:.8rem;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.key{border-color:var(--accent);color:var(--accent)}
.pill.p-new,.pill.new{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.links{list-style:none;padding:0;margin:0}
.links li{padding:12px 14px;border-radius:10px;border-left:5px solid;margin-bottom:10px;background:var(--surface)}
.links li.cascade{border-color:var(--cascade)}
.links li.setnull{border-color:var(--setnull)}
.links li.restrict{border-color:var(--restrict)}
.links li small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--muted);margin:0 0 16px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.next{margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}

details{border-bottom:1px solid var(--line)}
details:first-of-type{border-top:1px solid var(--line)}
/* A small chevron inside the column (the default marker hangs outside it); it turns when the row opens. */
summary{cursor:pointer;padding:14px 4px;font-weight:600;list-style:none;display:flex;align-items:baseline;gap:12px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";flex:none;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(-45deg);transition:transform .15s}
details[open] > summary::before{transform:translateY(-4px) rotate(45deg)}
summary:hover::before{border-color:var(--accent)}
summary small{font-weight:400;color:var(--muted)}
details > .inner{padding:0 4px 18px}
details > .inner p:last-child{margin-bottom:0}
.ba{display:grid;gap:10px}
.ba div{border-radius:10px;padding:10px 14px}
.ba .before{background:var(--cascade-soft)}
.ba .after{background:var(--accent-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.filters button{font:inherit;font-size:.92rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.empty{color:var(--muted);padding:18px 4px}

footer{max-width:760px;margin:0 auto;padding:0 20px 48px;color:var(--muted);font-size:.9rem}
@media (max-width:560px){
  body{font-size:16px}
  h1,.table-title{font-size:1.6rem}
  main{padding:26px 16px 64px}
  .bar-in{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---- Map: connected diagrams (added) ---- */
:root{
  --a0:#2F6A9C; --a1:#8A4C9E; --a2:#B4532A; --a3:#7C6A1F; --a4:#2C8456; --a5:#A66414; --a6:#147A86; --a7:#5C6670; --a8:#A23D62; --a9:#4A5BB0; --a10:#5F7A1E; --a11:#8A5236;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --a0:#7DB3E3; --a1:#C896DA; --a2:#E8977A; --a3:#CDB866; --a4:#7CCB9C; --a5:#E3A35E; --a6:#6CC6D1; --a7:#A6B0BA; --a8:#E58DAE; --a9:#9DAAF2; --a10:#B6CC6A; --a11:#D9A27E;
  }
}
:root[data-theme="dark"]{
  --a0:#7DB3E3; --a1:#C896DA; --a2:#E8977A; --a3:#CDB866; --a4:#7CCB9C; --a5:#E3A35E; --a6:#6CC6D1; --a7:#A6B0BA; --a8:#E58DAE; --a9:#9DAAF2; --a10:#B6CC6A; --a11:#D9A27E;
}
.mapview .tabs{margin:18px 0 0}
.mapview .tabs + .areakey{margin-top:16px}
.map-wrap{overflow-x:auto;margin:22px 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.map{display:block;width:100%;height:auto;min-width:640px}
.map .node{cursor:pointer;transition:opacity .15s}
.map .node rect{stroke-width:1.6}
.map .node text{font-family:var(--font);font-size:14px;font-weight:600;fill:var(--ink)}
.map .node text.mono{font-family:var(--mono);font-size:13px;font-weight:500}
.map .node text.sub{font-size:12px;font-weight:400;fill:var(--muted)}
.map .node.center text{font-size:15px}
.map .node.muted rect{stroke-dasharray:4 3}
.map .node.muted text{fill:var(--ink-2)}
.map .node:focus{outline:none}
.map .node:focus-visible rect{stroke-width:3.5}
.map .edge{transition:opacity .15s}
.map .edge line,.map .edge path{fill:none;stroke-width:1.6}
.map .e-cascade line,.map .e-cascade path{stroke:var(--cascade)}
.map .e-setnull line,.map .e-setnull path{stroke:var(--setnull)}
.map .e-restrict line,.map .e-restrict path{stroke:var(--restrict)}
.map .e-dangle line,.map .e-dangle path{stroke:var(--dangle);stroke-dasharray:5 4}
.map .e-area line{stroke:var(--muted);stroke-opacity:.55}
.map .e-mixed line{stroke:var(--muted)}
:root{--dangle:#3F6B8C; --dangle-soft:#E6EEF5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--dangle:#8DB6D4; --dangle-soft:#1C2730}}
:root[data-theme="dark"]{--dangle:#8DB6D4; --dangle-soft:#1C2730}
.rule.dangle,.links li.dangle{--c:var(--dangle)}
.links li.dangle{border-color:var(--dangle)}
.rule.dangle{border-color:var(--dangle);background:var(--dangle-soft)}
.unverified{display:flex;gap:10px;align-items:flex-start;margin:0 0 18px;padding:10px 13px;border:1px solid var(--dangle);border-radius:10px;background:var(--dangle-soft);font-size:14px;line-height:1.45}
.unverified b{white-space:nowrap}
.noschema{margin:0 0 26px;padding:20px 22px;border:2px solid var(--cascade);border-radius:14px;background:var(--cascade-soft)}
.noschema h2{margin:0 0 10px;font-size:clamp(1.35rem,3.6vw,1.9rem);line-height:1.2;letter-spacing:-.01em;color:var(--cascade)}
.noschema p{margin:0 0 8px;font-size:clamp(1rem,2.2vw,1.1rem);line-height:1.5}
.noschema p:last-child{margin-bottom:0}
.noschema .what{font-size:.92rem;color:var(--muted)}
.strip{display:block;margin:0 0 18px;padding:9px 14px;border-radius:9px;font-size:14px;line-height:1.4;border:1px solid var(--cascade);background:var(--cascade-soft)}
.strip b{color:var(--cascade)}
.strip.soft{border-color:var(--dangle);background:var(--dangle-soft)}
.strip.soft b{color:var(--dangle)}
.map .edge text{font-family:var(--mono);font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.map .edge text.count{font-family:var(--font);font-size:12px;font-weight:600;fill:var(--ink-2)}
.map.focusing .edge{opacity:.07}
.map.focusing .edge.on{opacity:1}
.map.focusing .node{opacity:.28}
.map.focusing .node.on{opacity:1}
.areakey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem;color:var(--muted);margin:0 0 8px}
.areakey span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
/* ================================================================
   Skin: ink on paper, hairline structure, one cobalt accent.
   Overrides the look above; layout, markup and behaviour are unchanged.
   ================================================================ */
:root{
  --bg:#FAFAF8; --surface:#FFFFFF; --ink:#15181C; --ink-2:#434A53; --muted:#737A83; --line:#E2E4E7; --line-2:#CDD1D6;
  --accent:#2547C4; --accent-ink:#FFFFFF; --accent-soft:#EEF1FB;
  --cascade:#B3402D; --cascade-soft:#FBEEEB; --setnull:#8F6000; --setnull-soft:#FAF3E2; --restrict:#58626E; --restrict-soft:#EFF1F3;
  --code-bg:rgba(21,24,28,.055);
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --surface:#15181D; --ink:#E7E9EC; --ink-2:#B2B8C0; --muted:#7F868F; --line:#252A31; --line-2:#363C45;
    --accent:#8EA5FF; --accent-ink:#0F1114; --accent-soft:#1A2140;
    --cascade:#E8907E; --cascade-soft:#2C1C19; --setnull:#DDB45C; --setnull-soft:#2A2314; --restrict:#A3ADB8; --restrict-soft:#1D2229;
    --code-bg:rgba(231,233,236,.07);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#15181D; --ink:#E7E9EC; --ink-2:#B2B8C0; --muted:#7F868F; --line:#252A31; --line-2:#363C45;
  --accent:#8EA5FF; --accent-ink:#0F1114; --accent-soft:#1A2140;
  --cascade:#E8907E; --cascade-soft:#2C1C19; --setnull:#DDB45C; --setnull-soft:#2A2314; --restrict:#A3ADB8; --restrict-soft:#1D2229;
  --code-bg:rgba(231,233,236,.07);
}

body{font-size:16.5px;line-height:1.65;font-feature-settings:"ss01" 1}
::selection{background:var(--accent);color:var(--accent-ink)}
h1{font-size:2.3rem;letter-spacing:-.025em;font-weight:700;line-height:1.15}
h2{font-size:1.15rem;letter-spacing:-.01em}
a{text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
code{background:var(--code-bg);color:var(--ink);border-radius:3px;padding:.08em .32em;font-size:.86em}
.t{font-size:.9em}
main{max-width:740px;padding-top:48px}
.lede{font-size:1.1rem;line-height:1.6;color:var(--ink-2)}
.hint{font-size:.92rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

/* top bar: text navigation with an underline marker instead of pills */
.bar{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar-in{max-width:740px;padding:0 20px;min-height:58px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand::before{content:"";width:14px;height:14px;border:2px solid var(--ink);border-radius:2px;box-shadow:3px 3px 0 var(--accent)}
nav.main{gap:2px;align-items:center}
nav.main a{border-radius:0;padding:18px 9px 16px;font-weight:500;color:var(--muted);box-shadow:inset 0 -2px 0 transparent}
nav.main a:hover{background:none;color:var(--ink)}
nav.main a[aria-current="page"]{background:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.theme-toggle{border-radius:4px;border:1px solid var(--line-2);padding:4px 10px;font-weight:500;color:var(--ink-2);margin-left:10px}
.theme-toggle:hover{border-color:var(--ink)}

.crumbs{font-size:.88rem}
.crumbs a{text-decoration-color:var(--line-2)}

/* home: three ruled rows, not cards */
.paths{gap:0;margin-top:36px;border-bottom:1px solid var(--line)}
.path,.path.primary{background:none;border:0;border-top:1px solid var(--line);border-radius:0;color:var(--ink);padding:22px 0 22px 18px;position:relative}
.path b{font-size:1.3rem;letter-spacing:-.015em;margin-bottom:4px}
.path span,.path.primary span{color:var(--ink-2);opacity:1}
.path.primary b{color:var(--accent)}
.path::before{content:"";position:absolute;left:0;top:24px;bottom:24px;width:3px;background:var(--line-2)}
.path.primary::before{background:var(--accent)}
.path:hover::before{background:var(--ink)}
.path:hover b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

/* tour: a thin segmented row */
.row-progress{border:0;border-radius:0;gap:3px;margin-bottom:12px}
.row-progress a,.row-progress a:first-child{height:6px;border:0;background:var(--line);border-radius:1px}
.row-progress a:hover{background:var(--line-2)}
.row-progress a.done{background:var(--ink)}
.row-progress a.now{background:var(--accent);box-shadow:none}
.step-count{font-family:var(--mono);font-size:.8rem;letter-spacing:.02em}
.tour h1{font-size:2.1rem}
.tour-nav{border-top:1px solid var(--line)}
.btn{border-radius:4px;border:1px solid var(--line-2);padding:9px 18px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* small pieces */
.chips{gap:6px}
.chip{border-radius:3px;font-size:.84rem;padding:3px 9px;border-color:var(--line-2)}
.chip:hover{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.flow b{border-radius:3px;font-weight:500;border-color:var(--line-2)}
.demo{border-radius:4px}
.demo th{font-weight:500}
.rule{border-left-width:3px;border-radius:0 4px 4px 0}
.areas li{padding:10px 0}

/* lists: a ruled index with a marker on hover */
.list a.item{padding:16px 14px;position:relative}
.list a.item:hover{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.list a.item b{font-size:1.05rem;letter-spacing:-.01em}
.list a.item:hover b{color:var(--accent)}
.search{border-radius:4px;border:1px solid var(--line-2);padding:11px 14px}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* table pages */
.table-title{font-size:2.1rem;letter-spacing:-.02em}
.tabs{gap:2px}
.tabs a{font-weight:500;padding:9px 12px}
.tabs a[aria-current="page"]{font-weight:600;border-bottom-width:2px}
.facts{gap:6px 0}
.facts li{padding-right:18px;margin-right:18px;border-right:1px solid var(--line)}
.facts li:last-child{border-right:0}
.col-head .t{font-size:.98rem}
.pill{border-radius:3px;font-size:.72rem;font-weight:600;letter-spacing:.01em;padding:1px 7px;border-color:var(--line-2)}
.pill.key{border-color:var(--accent);color:var(--accent)}
.links li{border-left-width:3px;border-radius:0 4px 4px 0;padding:11px 14px}
summary:hover{color:var(--accent)}
details > .inner{padding-left:19px}
.ba div{border-radius:4px}
.filters button{border-radius:4px;border:1px solid var(--line-2)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.next a{font-weight:600}

/* diagrams: engineering-paper canvas, tighter boxes */
.map-wrap{border-radius:6px;border-color:var(--line);
  background-color:var(--surface);
  background-image:radial-gradient(var(--line-2) 1px, transparent 1.2px);background-size:22px 22px}
.map .node rect{rx:4px;stroke-width:1.4}
.map .node:hover rect{stroke-width:2.4}
.map .edge line,.map .edge path{stroke-width:1.4}
.map .node text.mono{font-size:12.5px}
.areakey{font-size:.86rem}
.legend{font-size:.86rem}
.legend span::before{border-radius:1px}

footer{max-width:740px;font-size:.85rem;padding-top:0}
footer::before{content:"";display:block;border-top:1px solid var(--line);margin-bottom:20px}
/* ---- Tools (added) ---- */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:30px}
.door{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:4px;padding:24px 22px 26px}
.door b{display:block;font-size:1.6rem;letter-spacing:-.02em;line-height:1.15}
.door span{display:block;margin-top:8px;color:var(--ink-2);font-size:1.05rem}
.door:hover{border-color:var(--line-2);border-top-color:var(--c);box-shadow:0 10px 24px -18px rgba(0,0,0,.35)}
.door:hover b{color:var(--c)}

.tool h1{margin-bottom:6px}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:22px 0 30px;font-size:1.6rem;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.big-select{font-family:var(--mono);font-size:1.25rem;font-weight:500;color:var(--accent);background:var(--surface);border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;padding:4px 8px;max-width:100%;cursor:pointer}
.big-select:hover{background:var(--accent-soft)}
.ask .big-select{width:min(300px,100%);font-size:1.08rem}
.big-select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.swap{font:inherit;font-size:1.3rem;line-height:1;width:44px;height:44px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.swap:hover{border-color:var(--ink);transform:rotate(180deg)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stats.two{grid-template-columns:repeat(2,minmax(0,220px))}
.stat{border-top:3px solid var(--c);padding-top:12px}
.stat b{display:block;font-size:2.8rem;font-weight:700;letter-spacing:-.04em;line-height:1}
.stat span{display:block;margin-top:6px;color:var(--ink-2);font-size:.98rem;font-weight:500}

.flags{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.flag{display:inline-flex;align-items:center;font-size:.85rem;font-weight:600;padding:5px 11px;border-radius:3px;color:var(--c);background:var(--cs, var(--accent-soft));cursor:help}

.tsec{margin-top:42px}
.tsec h2{display:flex;align-items:center;gap:10px;font-size:1.3rem;letter-spacing:-.015em;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tsec h2::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--c);flex:none}
.tsec h2 small{margin-left:auto;font-size:1rem;font-weight:600;color:var(--muted)}
.none{color:var(--muted);font-size:1.05rem;margin:0}
.none.big{font-size:1.6rem;font-weight:600;color:var(--ink-2);margin-top:8px}
.fine{color:var(--muted);font-size:.88rem;margin:12px 0 0}

.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{margin:4px 0 4px 10px;padding-left:22px;border-left:2px solid var(--line)}
.tree li{padding:6px 0}
.node-name a,.pairs a{font-family:var(--mono);font-size:1.05rem;font-weight:500;text-decoration:none;color:var(--ink)}
.node-name a:hover,.pairs a:hover{color:var(--accent);text-decoration:underline}
.tree li::marker{content:none}
.tree .via,.pairs .via{font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-left:10px}
.tree .tag{font-size:.78rem;font-weight:600;color:var(--muted);margin-left:10px;padding:1px 7px;border:1px solid var(--line-2);border-radius:3px}
.tree li.also .node-name a{color:var(--muted)}
.pairs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pairs li{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:0 4px 4px 0;padding:10px 12px}
.pairs .via{display:block;margin:2px 0 0}

.ways{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.way{font:inherit;text-align:left;min-width:140px;padding:10px 14px;border:1px solid var(--line-2);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
.way b{display:block;font-size:1rem}
.way small{display:block;margin-top:2px;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.way:hover{border-color:var(--ink)}
.way[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}

.chain{display:flex;flex-wrap:wrap;align-items:center;gap:10px 0;margin:4px 0 16px}
.chain .box{font-family:var(--mono);font-size:1.02rem;font-weight:500;border:1.5px solid var(--ink);border-radius:4px;padding:7px 13px;background:var(--surface)}
.chain .link{display:inline-flex;flex-direction:column;align-items:center;padding:0 10px;line-height:1.1}
.chain .link small{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.chain .link i{font-style:normal;font-size:1.3rem;color:var(--accent)}

.code-card{margin-top:16px;border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden}
.code-tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--bg)}
.code-tabs button{font:inherit;font-size:.9rem;font-weight:600;padding:10px 16px;border:0;background:none;color:var(--muted);cursor:pointer;box-shadow:inset 0 -2px 0 transparent}
.code-tabs button:hover{color:var(--ink)}
.code-tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.code-tabs .copy{margin-left:auto;color:var(--ink-2);border-left:1px solid var(--line)}
.code-tabs .copy.done{color:var(--accent)}
.code-card pre.code{border:0;border-radius:0;margin:0;font-family:var(--mono);font-size:.88rem;line-height:1.65;padding:16px 18px;overflow-x:auto;color:var(--ink);background:var(--surface)}
@media (max-width:560px){
  .ask{font-size:1.3rem}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat b{font-size:2.1rem}
}

/* ---- Smooth transitions across the guide (added) ---- */
@keyframes view-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fold-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#app.view-in > *{animation:view-in .32s cubic-bezier(.2,.7,.2,1)}
details[open] > .inner,.panel-in{animation:fold-in .22s ease-out}
a,button,select,input,summary,.chip,.path,.list a.item,.tabs a,nav.main a,.links li,.btn,.way,.door,.swap,.pairs li,.flag{
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease,opacity .2s ease,transform .25s ease}
body,.bar,.map-wrap,pre.code,.code-card,.search,.demo,.rule,.links li,.stat,.tsec h2{transition:background-color .3s ease,color .3s ease,border-color .3s ease}
.row-progress a{transition:background-color .3s ease}
summary::before{transition:transform .2s ease}
/* Six nav items and the theme button on one line: the button shows only its icon (label kept for screen readers). */
nav.main a{padding-left:7px;padding-right:7px}
.theme-toggle{font-size:0;gap:0;padding:6px 8px;margin-left:8px}
.theme-toggle svg{width:16px;height:16px}
/* ================================================================
   Depth instead of coloured edge bars: surfaces sit on a soft shadow
   from every side and lift on hover. Colour shows as a small square.
   ================================================================ */
:root{
  --lift-1:0 0 0 1px rgba(17,21,27,.07),0 1px 2px rgba(17,21,27,.05),0 3px 8px -4px rgba(17,21,27,.08);
  --lift-2:0 0 0 1px rgba(17,21,27,.09),0 2px 4px rgba(17,21,27,.06),0 12px 24px -8px rgba(17,21,27,.18),0 28px 44px -28px rgba(17,21,27,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --lift-1:0 0 0 1px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4),0 4px 10px -4px rgba(0,0,0,.5);
    --lift-2:0 0 0 1px rgba(255,255,255,.1),0 2px 4px rgba(0,0,0,.45),0 14px 28px -8px rgba(0,0,0,.6),0 30px 48px -28px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --lift-1:0 0 0 1px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4),0 4px 10px -4px rgba(0,0,0,.5);
  --lift-2:0 0 0 1px rgba(255,255,255,.1),0 2px 4px rgba(0,0,0,.45),0 14px 28px -8px rgba(0,0,0,.6),0 30px 48px -28px rgba(0,0,0,.7);
}
/* the colour marker used in place of edge bars */
.rule.cascade,.links li.cascade{--c:var(--cascade)}
.rule.setnull,.links li.setnull{--c:var(--setnull)}
.rule.restrict,.links li.restrict{--c:var(--restrict)}

/* Explore, Reference and area lists: separate cards that lift */
.list{border-top:0}
.list > li{border-bottom:0;margin-bottom:10px}
.list a.item{background:var(--surface);border-radius:8px;box-shadow:var(--lift-1);padding:16px 20px}
.list a.item:hover{background:var(--surface);box-shadow:var(--lift-2);transform:translateY(-2px)}

/* Home: three ways in */
.paths{border-bottom:0;gap:12px}
.path,.path.primary{border:0;border-radius:8px;background:var(--surface);box-shadow:var(--lift-1);padding:22px 24px}
.path::before{display:none}
.path:hover{box-shadow:var(--lift-2);transform:translateY(-2px)}
.path:hover b{text-decoration:none}

/* Tour: the three delete answers */
.rule{border-left:0;border-radius:8px;background:var(--surface);box-shadow:var(--lift-1);padding:14px 18px}
.rule b::before,.door b::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);margin-right:10px;vertical-align:1px}

/* Link sentences on table pages and in Reference */
.links li{border-left:0;border-radius:8px;box-shadow:var(--lift-1);padding:12px 16px 12px 38px;position:relative;margin-bottom:10px}
.links li::before{content:"";position:absolute;left:15px;top:19px;width:10px;height:10px;border-radius:3px;background:var(--c)}

/* Tools */
.door{border:0;border-radius:8px;box-shadow:var(--lift-1)}
.door:hover{box-shadow:var(--lift-2);transform:translateY(-3px)}
.door:hover b{color:var(--ink)}
.big-select,.ask .big-select{border:0;border-radius:8px;box-shadow:var(--lift-1);padding:7px 12px}
.big-select:hover{background:var(--surface);box-shadow:var(--lift-2)}
.stat{border-top:0;background:var(--surface);border-radius:8px;box-shadow:var(--lift-1);padding:16px 18px}
.stat b{color:var(--c)}
.pairs li{border:0;border-radius:8px;box-shadow:var(--lift-1);padding:11px 14px 11px 36px;position:relative}
.pairs li::before{content:"";position:absolute;left:14px;top:17px;width:10px;height:10px;border-radius:3px;background:var(--c)}
.way{border:0;border-radius:8px;box-shadow:var(--lift-1)}
.way:hover{box-shadow:var(--lift-2);transform:translateY(-2px)}
.way[aria-selected="true"]{background:var(--ink);color:var(--bg);box-shadow:var(--lift-2)}
.way[aria-selected="true"] small{color:var(--bg);opacity:.7}
.code-card,.map-wrap,.demo{border:0;border-radius:8px;box-shadow:var(--lift-1)}
.chain .box{border:0;border-radius:6px;box-shadow:var(--lift-1)}
.swap{border:0;border-radius:8px;box-shadow:var(--lift-1)}
.swap:hover{box-shadow:var(--lift-2)}
/* ---- Navigation and overflow (added) ---- */
/* Menu order: header (sections) > header row 2 (the tools, inside Tools) > crumbs (only below a menu item) > tabs (views of one page) > pager (siblings). */
.subbar{border-top:1px solid var(--line)}
.subbar-in{max-width:740px;margin:0 auto;padding:0 20px;min-height:46px;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.subbar-in::-webkit-scrollbar{display:none}
.subbar a{flex:none;padding:6px 12px;border-radius:7px;text-decoration:none;white-space:nowrap;color:var(--ink-2);font-weight:600;font-size:.9rem}
.subbar a:hover{color:var(--ink);background:var(--surface)}
.subbar a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.subbar a.subbar-up{padding-left:0;padding-right:4px;color:var(--muted);font-weight:500}
.subbar a.subbar-up:hover{background:none;color:var(--ink)}
.subbar a.subbar-up[aria-current="page"]{background:none;color:var(--ink);font-weight:600}
.subbar span[aria-hidden]{flex:none;color:var(--muted);opacity:.6;margin-right:6px}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:0;box-shadow:inset 0 -1px 0 var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;white-space:nowrap;margin-bottom:0}
.tabs.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.tabs.less{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px);mask-image:linear-gradient(90deg,transparent,#000 48px)}
.tabs.less.more{-webkit-mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
/* Phones: a compact header that scrolls away, so the page keeps the screen. */
@media (max-width:560px){
  .bar{position:static}
  .bar-in{padding:12px 16px 0;row-gap:2px;min-height:0}
  .brand{width:100%}
  nav.main{margin-left:-7px}
  nav.main a{padding-top:10px;padding-bottom:11px}
  .subbar-in{padding:0 16px;min-height:42px}
}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.pager a{display:block;min-width:0;padding:14px 18px;border-radius:8px;background:var(--surface);box-shadow:var(--lift-1);text-decoration:none;color:var(--ink);overflow-wrap:anywhere}
.pager a:hover{box-shadow:var(--lift-2);transform:translateY(-2px)}
.pager a.to-next{grid-column:2;text-align:right}
.pager small{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.pager b{font-weight:600;font-size:1.02rem}
.pager b.t{font-family:var(--mono);font-weight:500}
/* Long table and column names wrap inside their box instead of running out of it. */
.pairs{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.pairs li,.links li,.list a.item,.path,.door,.stat,.way,.chain .box,.chip,.tree li,.flag,.cols li,.col-head,.crumbs,summary,.areas li a{min-width:0;overflow-wrap:anywhere}
.chain .box{max-width:100%}
.table-title{overflow-wrap:anywhere}
/* ---- Map: canvas and analysis views (added) ---- */
.mapview .tabs + .stats{margin-top:22px}
/* The canvas is wider than the reading column, centred on the page. */
.canvas-wrap{--cw:min(1180px, calc(100vw - 32px));position:relative;width:var(--cw);margin:20px 0 12px calc((100% - var(--cw)) / 2);height:min(74vh,780px);min-height:420px;border-radius:10px;overflow:hidden;
  background-color:var(--surface);background-image:radial-gradient(var(--line-2) 1px, transparent 1.2px);background-size:22px 22px;box-shadow:var(--lift-1);touch-action:none;outline:none}
.canvas-wrap:focus-visible{box-shadow:0 0 0 2px var(--accent),var(--lift-1)}
.canvas-wrap svg{display:block;width:100%;height:100%;min-width:0;cursor:grab;user-select:none;-webkit-user-select:none}
.canvas-wrap.dragging svg{cursor:grabbing}
.map.is-canvas .viewport{transform-origin:0 0}
.map.is-canvas .viewport.animate{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.map.is-canvas .node,.map.is-canvas .edge{transition:opacity .25s ease,filter .25s ease}
.map.is-canvas.selecting .node:not(.on),.map.is-canvas.selecting .edge:not(.on){opacity:.16;filter:blur(1.6px)}
.map.is-canvas .node.sel rect{stroke-width:3.4}
.map.is-canvas .edge.on line,.map.is-canvas .edge.on path{stroke-width:2.3}
.canvas-tools{position:absolute;top:12px;left:12px;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 330px)}
.canvas-tools button{width:34px;height:34px;border:0;border-radius:8px;background:var(--surface);box-shadow:var(--lift-1);font:inherit;font-size:1.05rem;font-weight:600;color:var(--ink);cursor:pointer}
.canvas-tools button:hover{box-shadow:var(--lift-2)}
.canvas-tools button.wide{width:auto;padding:0 13px;font-size:.88rem}
.zoom-level{min-width:46px;text-align:center;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.canvas-find{width:190px;height:34px;padding:0 12px;border:0;border-radius:8px;background:var(--surface);box-shadow:var(--lift-1);font:inherit;font-size:.88rem;color:var(--ink)}
.canvas-find:focus{outline:none;box-shadow:0 0 0 2px var(--accent),var(--lift-1)}
.canvas-panel{position:absolute;top:12px;right:12px;z-index:2;width:290px;max-height:calc(100% - 24px);overflow:auto;padding:16px 18px 18px;border-radius:10px;background:var(--surface);box-shadow:var(--lift-2)}
.canvas-panel h3{font-size:1.1rem;margin:0 26px 6px 0;overflow-wrap:anywhere}
.canvas-panel h3.t{font-family:var(--mono);font-weight:500;font-size:1.05rem}
.canvas-panel h4{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-2);margin:14px 0 8px}
.canvas-panel h4 small{color:var(--muted)}
.panel-note{color:var(--muted);font-size:.88rem;margin:0}
.panel-area{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.88rem;margin:0 0 8px}
.panel-area span{width:10px;height:10px;border-radius:3px;background:var(--c)}
.panel-purpose{font-size:.9rem;color:var(--ink-2);margin:0}
.panel-chips{display:flex;flex-wrap:wrap;gap:6px}
.panel-chips .chip{font:inherit;font-family:var(--mono);font-size:.78rem;cursor:pointer;color:var(--ink);background:var(--bg)}
.panel-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.panel-actions .btn{padding:7px 12px;font-size:.84rem}
.panel-close{position:absolute;top:10px;right:10px;width:28px;height:28px;border:0;border-radius:6px;background:var(--bg);color:var(--ink-2);font-size:1.1rem;line-height:1;cursor:pointer}
.panel-close:hover{color:var(--ink)}
.canvas-help{position:absolute;left:12px;bottom:10px;z-index:1;display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:5px 10px;border-radius:6px;font-size:.78rem;color:var(--muted);background:color-mix(in srgb, var(--surface) 88%, transparent)}
@media (max-width:760px){
  .canvas-wrap{height:72vh}
  .canvas-tools{max-width:calc(100% - 24px)}
  .canvas-find{width:140px}
  .canvas-panel{top:auto;bottom:12px;left:12px;right:12px;width:auto;max-height:42%}
  .canvas-help{display:none}
}

/* Like the canvas, the level columns use the wider strip so five or six levels fit. */
.layers{--cw:min(1180px, calc(100vw - 32px));display:flex;gap:14px;overflow-x:auto;padding:4px 4px 16px;width:var(--cw);margin:0 0 0 calc((100% - var(--cw)) / 2)}
.layer{flex:1 1 0;min-width:176px;display:flex;flex-direction:column;gap:8px}
.layer h3{display:flex;justify-content:space-between;font-size:.98rem;margin:0}
.layer h3 small{color:var(--muted);font-weight:600}
.layer-sub{margin:-4px 0 4px;color:var(--muted);font-size:.8rem}
.layer-card{display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-family:var(--mono);font-size:.84rem;padding:9px 12px;border:0;border-radius:8px;background:var(--surface);box-shadow:var(--lift-1);color:var(--ink);cursor:pointer;overflow-wrap:anywhere;min-width:0}
.layer-card::before{content:"";flex:none;width:9px;height:9px;border-radius:3px;background:var(--c)}
.layer-card:hover{box-shadow:var(--lift-2);transform:translateY(-1px)}
.layer-card,.layers .layer-card{transition:opacity .25s ease,filter .25s ease,box-shadow .2s ease,transform .25s ease,background-color .2s ease,color .2s ease}
.layers.selecting .layer-card:not(.on){opacity:.18;filter:blur(1.3px)}
.layer-card.needs{box-shadow:0 0 0 2px var(--accent),var(--lift-1)}
.layer-card.needed{box-shadow:0 0 0 2px var(--setnull),var(--lift-1)}
.layer-card.sel{background:var(--ink);color:var(--bg)}
.layer-card .loop{margin-left:auto;padding-left:8px;font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--muted)}
.layer-info{margin:6px 0 0;font-size:1rem;color:var(--ink-2);min-height:1.6em}
.layer-info .t{font-weight:500}

details.own > summary .t{font-family:var(--mono);font-weight:500}
details.own .tree{margin-top:2px}

.hubs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hub{display:grid;grid-template-columns:minmax(0,210px) 1fr auto;align-items:center;gap:14px;padding:11px 16px;border-radius:8px;background:var(--surface);box-shadow:var(--lift-1);color:var(--ink);text-decoration:none}
.hub:hover{box-shadow:var(--lift-2);transform:translateY(-2px)}
.hub .t{font-family:var(--mono);font-weight:500;overflow-wrap:anywhere}
.hub-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg)}
.hub-bar i{display:block;height:100%}
.hub-bar i.in{background:var(--accent)}
.hub-bar i.out{background:var(--setnull)}
.hub small{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap;min-width:12ch;text-align:right}

.vals{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vals i{font-style:normal;color:var(--muted);font-size:.85rem}
.val{font-family:var(--mono);font-size:.82rem;padding:3px 9px;border-radius:6px;background:var(--bg);box-shadow:0 0 0 1px var(--line-2);overflow-wrap:anywhere}
.val-card{padding:14px 16px;border-radius:10px;background:var(--surface);box-shadow:var(--lift-1);margin-bottom:12px}
.val-used{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line)}
.val-used span{font-size:.8rem;font-weight:600;color:var(--muted);margin-right:2px}
.val-used a{font-family:var(--mono);font-size:.82rem;padding:3px 9px;border-radius:6px;background:var(--accent-soft);color:var(--ink-2);text-decoration:none;overflow-wrap:anywhere}
.val-used a b{color:var(--ink);font-weight:600}
.val-used a:hover{color:var(--accent)}
.val-row{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:8px 14px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start}
.val-row:last-child{border-bottom:0}
.val-row > a{font-size:.88rem;overflow-wrap:anywhere;text-decoration:none;color:var(--ink-2)}
.val-row > a b{color:var(--ink);font-weight:600}
.val-hint{margin:6px 0 0;font-size:.8rem;color:var(--muted)}
.caveat{display:block;margin-top:7px;opacity:.85}
:root{--gold:#9A7B1F; --gold-line:rgba(190,154,58,.5); --gold-aura:rgba(190,154,58,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#E0C274; --gold-line:rgba(224,194,116,.42); --gold-aura:rgba(224,194,116,.12)}}
:root[data-theme="dark"]{--gold:#E0C274; --gold-line:rgba(224,194,116,.42); --gold-aura:rgba(224,194,116,.12)}
.credit{display:flex;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dev-link{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border:1.5px solid var(--gold-line);border-radius:999px;font-size:.85rem;font-weight:600;color:var(--gold);text-decoration:none;white-space:nowrap;box-shadow:0 0 0 3px var(--gold-aura),0 1px 7px var(--gold-aura);transition:box-shadow .15s,border-color .15s}
.dev-link:hover,.dev-link:focus-visible{border-color:var(--gold);box-shadow:0 0 0 5px var(--gold-aura),0 2px 12px var(--gold-aura)}
.dev-link svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){
  .val-row{grid-template-columns:1fr}
  .hub{grid-template-columns:1fr auto}
  .hub .hub-bar{grid-column:1 / -1;order:3}
}
</style>
</head>

      <script>
        // Light / dark toggle. The page opens light; a choice made here is remembered per reader.
        (function () {
          const button = document.getElementById('theme-toggle');
          const root = document.documentElement;
          const current = () => root.dataset.theme || 'light';
          const sun = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
          const moon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
          function show() {
            const next = current() === 'dark' ? 'light' : 'dark';
            button.innerHTML = next === 'dark' ? `${moon}Dark` : `${sun}Light`;
            button.setAttribute('aria-label', `Switch to ${next} mode`);
            button.title = `Switch to ${next} mode`;
          }
          button.addEventListener('click', () => {
            const next = current() === 'dark' ? 'light' : 'dark';
            root.dataset.theme = next;
            try { localStorage.setItem('schema-guide-theme', next); } catch (e) {}
            show();
          });
          show();
        })();
      </script>
    </nav>

<script>
  document.addEventListener('keydown', (event) => {
    const find = document.getElementById('find');
    if (!find) return;
    if (event.key === '/' && document.activeElement !== find) { event.preventDefault(); find.focus(); }
    if (event.key === 'Escape' && document.activeElement === find && find.value) { find.value = ''; find.dispatchEvent(new Event('input')); }
  });
</script>
