const TOOLS = [
  ['map', 'Map', 'See how tables connect', 'accent'],
  ['impact', 'Delete impact', 'What goes when a row goes', 'cascade'],
  ['join', 'Join path', 'How two tables connect', 'accent'],
];

const isNullable = (table, column) => NULLABLE.has(`${table}.${column}`);
const SOFT_DELETE = TABLES.filter((t) => (t.badges || []).includes('soft delete')).map((t) => t.name);

function bigSelect(id, selected) {
  return `<select id="${id}" class="big-select" data-tool-input aria-label="Table">${DOMAINS.map(
    (d) => `<optgroup label="${d.name}">${tablesIn(d.id).map((t) => `<option value="${t.name}"${t.name === selected ? ' selected' : ''}>${t.name}</option>`).join('')}</optgroup>`,
  ).join('')}</select>`;
}

const stat = (n, label, color) => `<div class="stat" style="--c:var(--${color})"><b>${n}</b><span>${label}</span></div>`;
const section = (title, n, color, body) =>
  `<section class="tsec" style="--c:var(--${color})"><h2>${title}<small>${n}</small></h2>${body}</section>`;
const flag = (text, color, why) => `<span class="flag" style="--c:var(--${color});--cs:var(--${color}-soft)" title="${esc(why)}">${text}</span>`;

function viewTools() {
  const [, tool, a, b] = location.hash.replace(/^#/, '').split('/');
  if (!tool) {
    return `<section>
      <h1>Tools</h1>
      <p class="lede">See the schema, and answer two everyday questions.</p>
      <div class="doors">${TOOLS.map(
        ([id, title, phrase, color]) => `<a class="door" href="${id === 'map' ? '#diagram' : `#tools/${id}`}" style="--c:var(--${color})"><b>${title}</b><span>${phrase}</span></a>`,
      ).join('')}</div>
    </section>`;
  }
  if (tool === 'impact') return toolImpact(byName[a] ? a : DEFAULT_IMPACT);
  if (tool === 'join') return toolJoin(byName[a] ? a : DEFAULT_JOIN[0], byName[b] ? b : DEFAULT_JOIN[1]);
  return viewNotFound();
}

/* ---------- Delete impact ---------- */

/**
 * What one DELETE on `start` does. Walks incoming links breadth first: cascade links recurse into
 * the child table, set-null links clear a column, restrict (NO ACTION) links can stop the delete.
 * Each table is expanded once, at its shallowest point; later arrivals are marked "also".
 */
function deleteImpact(start) {
  const deleted = new Set([start]);
  const root = { name: start, children: [] };
  const queue = [root];
  const cleared = [];
  const blocking = [];
  const dangling = [];
  while (queue.length) {
    const node = queue.shift();
    for (const e of into(node.name)) {
      if (e.from === node.name) {
        node.self = e; // a self-cascade: its own child rows go too, at every depth
        continue;
      }
      if (e.d === 'dangle') {
        dangling.push(e);
        continue;
      }
      if (e.d === 'cascade') {
        if (deleted.has(e.from)) {
          node.children.push({ name: e.from, e, also: true });
          continue;
        }
        deleted.add(e.from);
        const child = { name: e.from, e, children: [] };
        node.children.push(child);
        queue.push(child);
      } else {
        (e.d === 'setnull' ? cleared : blocking).push(e);
      }
    }
  }
  return { root, deleted: [...deleted], cleared, blocking, dangling };
}

function impactTree(node) {
  const rows = [];
  if (node.self) rows.push(`<li><span class="node-name">${tlink(node.name)}</span><span class="via">${node.self.col}</span><span class="tag">${LABELS.selfCascade}</span></li>`);
  for (const c of node.children) {
    if (c.also) {
      rows.push(`<li class="also"><span class="node-name">${tlink(c.name)}</span><span class="via">${c.e.col}</span><span class="tag">also above</span></li>`);
      continue;
    }
    const sub = c.children.length || c.self ? impactTree(c) : '';
    rows.push(`<li><span class="node-name">${tlink(c.name)}</span><span class="via">${c.e.col}</span>${sub}</li>`);
  }
  return rows.length ? `<ul>${rows.join('')}</ul>` : '';
}

function toolImpact(start) {
  const r = deleteImpact(start);
  const lost = r.deleted.length - 1;
  const flags = [
    SOFT_DELETE.includes(start) ? flag('Soft delete in the app', 'restrict', LABELS.softDeleteWhy) : '',
    r.blocking.length ? flag(LABELS.refused, 'cascade', 'A NO ACTION link refuses the delete if matching rows still exist at the end of the statement.') : '',
  ].join('');
  const linkRows = (list) =>
    `<ul class="pairs">${list.map((e) => `<li>${tlink(e.from)}<span class="via">${e.col}</span></li>`).join('')}</ul>`;
  return `<section class="tool">
    <h1>Delete impact</h1>
    <div class="ask"><span>Delete one row from</span>${bigSelect('impact-table', start)}</div>
    <div class="stats">
      ${stat(lost, lost === 1 ? 'table loses rows' : 'tables lose rows', 'cascade')}
      ${stat(r.cleared.length, r.cleared.length === 1 ? 'column set to NULL' : 'columns set to NULL', 'setnull')}
      ${stat(r.blocking.length, r.blocking.length === 1 ? 'link can block it' : 'links can block it', 'restrict')}
      ${r.dangling.length ? stat(r.dangling.length, r.dangling.length === 1 ? 'row set left dangling' : 'row sets left dangling', 'dangle') : ''}
    </div>
    ${flags ? `<div class="flags">${flags}</div>` : ''}
    ${section('Deleted with it', lost, 'cascade', lost || r.root.self ? `<div class="tree">${impactTree(r.root)}</div>` : '<p class="none">Nothing else.</p>')}
    ${section('Kept, column cleared', r.cleared.length, 'setnull', r.cleared.length ? `${linkRows(r.cleared)}<p class="fine">Only rows not already deleted above.</p>` : '<p class="none">Nothing.</p>')}
    ${section('Can block the delete', r.blocking.length, 'restrict', r.blocking.length ? linkRows(r.blocking) : `<p class="none">${
      r.dangling.length
        ? 'Nothing in the database stops it.'
        : EDGES.length
          ? 'Nothing. The delete always succeeds.'
          : 'No link in the schema stops it. Nothing here is enforced by the database, so check the code before deleting.'
    }</p>`)}
    ${
      r.dangling.length
        ? section('Left pointing at nothing', r.dangling.length, 'dangle', `${linkRows(r.dangling)}<p class="fine">The database doesn't enforce these links, so it won't stop the delete, clear the column or remove these rows. They keep the old id and point at a row that no longer exists. Whatever cleans that up lives in application code.</p>`)
        : ''
    }
  </section>`;
}

/* ---------- Join path ---------- */

/** All shortest foreign-key paths between two tables (links walked either way), up to `limit`. */
function joinPaths(a, b, limit = 6) {
  if (a === b) return [[]];
  const dist = new Map([[a, 0]]);
  const preds = new Map();
  let frontier = [a];
  while (frontier.length && !dist.has(b)) {
    const next = [];
    for (const n of frontier) {
      for (const e of EDGES) {
        const other = e.from === n ? e.to : e.to === n ? e.from : null;
        if (!other || other === n) continue;
        if (!dist.has(other)) {
          dist.set(other, dist.get(n) + 1);
          preds.set(other, []);
          next.push(other);
        }
        if (dist.get(other) === dist.get(n) + 1) preds.get(other).push({ prev: n, e });
      }
    }
    frontier = next;
  }
  if (!dist.has(b)) return [];
  const paths = [];
  const walk = (node, acc) => {
    if (paths.length >= limit) return;
    if (node === a) return void paths.push(acc.slice().reverse());
    for (const p of preds.get(node)) {
      acc.push({ e: p.e, from: p.prev, to: node });
      walk(p.prev, acc);
      acc.pop();
    }
  };
  walk(b, []);
  return paths;
}

const RESERVED = new Set('all and as asc between by case check column constraint create default delete desc distinct drop else end exists from group having in index inner insert into is join key left like limit not null offset on or order outer primary references right select set table then to union unique update user using values when where with'.split(' '));
/** Quote a table or column name only when it needs it (reserved word, capitals, odd characters). */
const qi = (name) =>
  String(name)
    .split('.')
    .map((p) => (/^[a-z_][a-z0-9_]*$/.test(p) && !RESERVED.has(p) ? p : DIALECT === 'mysql' ? `\`${p.replace(/`/g, '``')}\`` : `"${p.replace(/"/g, '""')}"`))
    .join('.');

function aliasesFor(names) {
  const used = new Set();
  const out = {};
  for (const n of names) {
    if (out[n]) continue;
    const base = n.split(/[_.]/).filter(Boolean).map((w) => w[0].toLowerCase()).join('') || 't';
    let alias = base;
    for (let i = 2; used.has(alias) || RESERVED.has(alias); i++) alias = `${base}${i}`;
    used.add(alias);
    out[n] = alias;
  }
  return out;
}

/**
 * SQL and ORM code for one path. Towards a parent: parent.ref = child.col (a LEFT JOIN when that
 * column allows NULL). Towards a child: child.col = parent.ref (one row can match many).
 * Composite links join on every column pair.
 */
function joinCode(a, path) {
  const al = aliasesFor([a, ...path.map((s) => s.to)]);
  const sql = [`SELECT ${al[a]}.*`, `FROM ${qi(a)} AS ${al[a]}`];
  const ky = [`db.selectFrom('${a} as ${al[a]}')`];
  const kx = [`knex.select('${al[a]}.*').from({ ${al[a]}: '${a}' })`];
  for (const s of path) {
    const toParent = s.e.to === s.to;
    const left = toParent && isNullable(s.e.from, s.e.col);
    const child = toParent ? s.from : s.to;
    const parent = toParent ? s.to : s.from;
    const pairs = s.e.cols.map((c, i) => {
      const cc = `${al[child]}.${c}`;
      const pc = `${al[parent]}.${s.e.refCols[i] || 'id'}`;
      return toParent ? [pc, cc] : [cc, pc];
    });
    const q = (ref) => ref.split('.').map((p, i) => (i ? qi(p) : p)).join('.');
    sql.push(`${left ? 'LEFT JOIN' : 'JOIN'} ${qi(s.to)} AS ${al[s.to]} ON ${pairs.map(([l, r]) => `${q(l)} = ${q(r)}`).join(' AND ')}`);
    ky.push(
      pairs.length === 1
        ? `  .${left ? 'leftJoin' : 'innerJoin'}('${s.to} as ${al[s.to]}', '${pairs[0][0]}', '${pairs[0][1]}')`
        : `  .${left ? 'leftJoin' : 'innerJoin'}('${s.to} as ${al[s.to]}', (join) => join${pairs.map(([l, r]) => `.onRef('${l}', '=', '${r}')`).join('')})`,
    );
    kx.push(
      pairs.length === 1
        ? `  .${left ? 'leftJoin' : 'join'}({ ${al[s.to]}: '${s.to}' }, '${pairs[0][0]}', '${pairs[0][1]}')`
        : `  .${left ? 'leftJoin' : 'join'}({ ${al[s.to]}: '${s.to}' }, function () { this${pairs.map(([l, r], i) => `.${i ? 'andOn' : 'on'}('${l}', '=', '${r}')`).join('')}; })`,
    );
  }
  sql[sql.length - 1] += ';';
  ky.push(`  .selectAll('${al[a]}')`);
  return { sql: sql.join('\n'), kysely: ky.join('\n'), knex: kx.join('\n') };
}

/** The databases a path touches. More than one means no single server can run the join. */
function pathDbs(a, path) {
  return [...new Set([a, ...path.map((s) => s.to)].map((n) => (byName[n] || {}).db || ''))].filter(Boolean);
}

function pathFlags(a, path) {
  const flags = [];
  if (pathDbs(a, path).length > 1) flags.push(flag('Crosses databases', 'dangle', `This chain runs through ${pathDbs(a, path).join(' and ')}. No single SQL query can join them: fetch from one, then look the ids up in the other.`));
  if (path.some((s) => s.e.soft)) flags.push(flag('Not enforced', 'dangle', 'A step uses a link the database does not enforce, so there may be rows whose id points at nothing. Expect gaps.'));
  if (path.some((s) => s.e.to !== s.to)) flags.push(flag('One row → many', 'setnull', 'A step goes from a parent to its children, so one starting row can return several result rows. Use EXISTS or aggregate if you only filter.'));
  if (path.some((s) => s.e.to === s.to && isNullable(s.e.from, s.e.col))) flags.push(flag('LEFT JOIN', 'restrict', 'A link column can be NULL. LEFT JOIN keeps rows without a match; switch to JOIN to drop them.'));
  if (HUB && path.slice(0, -1).some((s) => s.to === HUB)) flags.push(flag(`Through ${HUB}`, 'cascade', LABELS.hubWhy || `Rows connect only because they share a ${HUB} row. Usually not what a query means.`));
  return flags.join('');
}

function chain(a, path) {
  return `<div class="chain"><span class="box">${a}</span>${path
    .map((s) => `<span class="link"><small>${s.e.col}</small><i aria-hidden="true">${s.e.to === s.to ? '⟶' : '⟵'}</i></span><span class="box">${s.to}</span>`)
    .join('')}</div>`;
}

function toolJoin(a, b) {
  const viaHub = (path) => path.slice(0, -1).filter((s) => s.to === HUB).length;
  const paths = a === b ? [] : joinPaths(a, b, 12).sort((x, y) => viaHub(x) - viaHub(y)).slice(0, 6);
  let result;
  if (a === b) result = '<p class="none big">Pick two different tables.</p>';
  else if (!paths.length)
    result = `<p class="none big">Not connected.</p><p class="fine">${
      EDGES.length
        ? `No chain of links in the schema joins ${a} and ${b}.`
        : `This schema records no links at all, so no chain can be found. If the code treats columns as references the database doesn't enforce, they belong in the schema as unenforced links.`
    }</p>`;
  else {
    const len = paths[0].length;
    const ways = paths.length > 1
      ? `<div class="ways" role="tablist">${paths
          .map((p, i) => `<button type="button" class="way" role="tab" data-way="${i}" aria-selected="${i === 0}"><b>Way ${i + 1}</b><small>${p.map((s) => s.e.col).join(' · ')}</small></button>`)
          .join('')}</div>`
      : '';
    const panels = paths
      .map((path, i) => {
        const code = joinCode(a, path);
        const split = pathDbs(a, path).length > 1;
        return `<div class="way-panel" data-panel="${i}"${i ? ' hidden' : ''}>
          ${chain(a, path)}
          <div class="flags">${pathFlags(a, path) || flag('Plain join', 'restrict', 'Every step goes to a parent through a NOT NULL column: one result row per starting row.')}</div>
          ${split ? `<p class="hint">The query below is what the join would be if these tables shared a database. They don't, so it can't be run as it stands.</p>` : ''}
          <div class="code-card">
            <div class="code-tabs" role="tablist">
              ${CODE.map((k, n) => `<button type="button" role="tab" data-code="${k}" aria-selected="${n === 0}">${CODE_NAME[k]}</button>`).join('')}
              <button type="button" class="copy" data-copy>Copy</button>
            </div>
            ${CODE.map((k, n) => `<pre class="code" data-lang="${k}"${n ? ' hidden' : ''}>${esc(code[k])}</pre>`).join('')}
          </div>
        </div>`;
      })
      .join('');
    result = `<div class="stats two">
        ${stat(len, len === 1 ? 'join' : 'joins', 'accent')}
        ${stat(paths.length, paths.length === 1 ? 'way to do it' : 'ways to do it', 'restrict')}
      </div>
      <section class="tsec" style="--c:var(--accent)"><h2>${paths.length > 1 ? 'Pick a way' : 'The path'}</h2>${ways}${panels}</section>`;
  }
  return `<section class="tool">
    <h1>Join path</h1>
    <div class="ask"><span>Join</span>${bigSelect('join-a', a)}<span>to</span>${bigSelect('join-b', b)}<button type="button" class="swap" data-swap aria-label="Swap the two tables" title="Swap">⇄</button></div>
    ${result}
  </section>`;
}

/* Selects navigate; Swap swaps; way and code tabs switch in place; Copy copies. */
document.addEventListener('change', (event) => {
  if (!event.target.matches('[data-tool-input]')) return;
  const v = (id) => document.getElementById(id)?.value;
  if (event.target.id === 'impact-table') location.hash = `#tools/impact/${v('impact-table')}`;
  if (event.target.id.startsWith('join-')) location.hash = `#tools/join/${v('join-a')}/${v('join-b')}`;
});
document.addEventListener('click', (event) => {
  if (event.target.closest('[data-swap]')) {
    location.hash = `#tools/join/${document.getElementById('join-b').value}/${document.getElementById('join-a').value}`;
    return;
  }
  const way = event.target.closest('[data-way]');
  if (way) {
    const box = way.closest('.tsec');
    box.querySelectorAll('[data-way]').forEach((b) => b.setAttribute('aria-selected', String(b === way)));
    box.querySelectorAll('[data-panel]').forEach((p) => {
      p.hidden = p.dataset.panel !== way.dataset.way;
      if (!p.hidden) {
        p.classList.remove('panel-in');
        void p.offsetWidth;
        p.classList.add('panel-in');
      }
    });
    return;
  }
  const tab = event.target.closest('[data-code]');
  if (tab) {
    const card = tab.closest('.code-card');
    card.querySelectorAll('[data-code]').forEach((b) => b.setAttribute('aria-selected', String(b === tab)));
    card.querySelectorAll('pre[data-lang]').forEach((pre) => (pre.hidden = pre.dataset.lang !== tab.dataset.code));
    return;
  }
  const copy = event.target.closest('[data-copy]');
  if (copy) {
    const pre = [...copy.closest('.code-card').querySelectorAll('pre[data-lang]')].find((p) => !p.hidden);
    const done = () => {
      copy.textContent = 'Copied';
      copy.classList.add('done');
      setTimeout(() => {
        copy.textContent = 'Copy';
        copy.classList.remove('done');
      }, 1400);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(pre.textContent).then(done, () => (copy.textContent = 'Select to copy'));
    else copy.textContent = 'Select to copy';
  }
});

/* ---- Navigation helpers (added) ---- */
/** The second header row inside Tools: the three tools, the current one marked. */
function toolBar(current) {
  return `<nav class="subbar-in" aria-label="Tools"><a class="subbar-up" href="#tools"${current ? '' : ' aria-current="page"'}>Tools</a><span aria-hidden="true">›</span>${[
    ['map', 'Map', '#diagram'],
    ['impact', 'Delete impact', '#tools/impact'],
    ['join', 'Join path', '#tools/join'],
  ]
    .map(([key, text, href]) => `<a href="${href}"${key === current ? ' aria-current="page"' : ''}>${text}</a>`)
    .join('')}</nav>`;
}

/** Tab rows scroll sideways on narrow screens: keep the current tab in view and fade the edge while more is hidden. */
function tabEdges(row) {
  row.classList.toggle('less', row.scrollLeft > 2);
  row.classList.toggle('more', row.scrollLeft + row.clientWidth < row.scrollWidth - 2);
}
function fitTabs() {
  app.querySelectorAll('.tabs').forEach((row) => {
    const on = row.querySelector('[aria-current]');
    if (on) {
      // Scroll only as far as needed to show the current tab clear of the fade.
      const over = on.getBoundingClientRect().right - row.getBoundingClientRect().right + 56;
      if (over > 0) row.scrollLeft += over;
    }
    tabEdges(row);
  });
}
document.addEventListener(
  'scroll',
  (event) => {
    const row = event.target.closest?.('.tabs');
    if (row) tabEdges(row);
  },
  true,
);
window.addEventListener('resize', fitTabs);

/** Previous / next among siblings. `items` are [label, href, mono?]. */
function pager(items, index, what) {
  const prev = items[index - 1];
  const next = items[index + 1];
  if (!prev && !next) return '';
  const link = (item, dir) =>
    `<a class="${dir === 'next' ? 'to-next' : 'to-prev'}" href="${item[1]}"><small>${dir === 'next' ? `Next ${what} ›` : `‹ Previous ${what}`}</small><b class="${item[2] ? 't' : ''}">${item[0]}</b></a>`;
  return `<nav class="pager" aria-label="More ${what}s">${prev ? link(prev, 'prev') : ''}${next ? link(next, 'next') : ''}</nav>`;
}
const tablePager = (t) => {
  const list = tablesIn(t.domain);
  return pager(list.map((x) => [x.name, `#table/${x.name}`, true]), list.indexOf(t), `table in ${domainById[t.domain].name}`);
};
const areaPager = (id) => pager(DOMAINS.map((d) => [d.name, `#explore/${d.id}`]), DOMAINS.findIndex((d) => d.id === id), 'area');
const refPager = (topic) => pager(REF.map(([id, title]) => [title, `#ref/${id}`]), REF.findIndex(([id]) => id === topic), 'topic');

/* ============================================================
   Routing: #home, #tour/3, #explore, #explore/research,
   #table/papers/links, #ref, #ref/indexes
   ============================================================ */
// Older links (the previous explorer, and links inside the data) still land somewhere useful.
const ALIASES = { 'diagram/matrix': 'diagram/hubs', overview: 'home', tables: 'explore', map: 'diagram', ...(GUIDE.aliases || {}) };

function route() {
  let hash = location.hash.replace(/^#/, '') || 'home';
  if (ALIASES[hash]) {
    history.replaceState(null, '', `#${ALIASES[hash]}`);
    hash = ALIASES[hash];
  }
  const [view, a, b] = hash.split('/');
  const html =
    view === 'home' ? viewHome()
    : view === 'tour' ? viewTour(a)
    : view === 'explore' ? (a ? viewArea(a) : viewExplore())
    : view === 'table' ? viewTable(a, b)
    : view === 'ref' ? viewRef(a)
    : view === 'diagram' ? viewDiagram(a, b)
    : view === 'tools' ? viewTools()
    : viewNotFound();
  app.innerHTML = (view === 'home' ? '' : STRIP) + html;

  const section = { home: 'home', tour: 'tour', explore: 'explore', table: 'explore', ref: 'ref', diagram: 'tools', tools: 'tools' }[view];
  document.querySelectorAll('[data-nav]').forEach((link) => {
    if (link.dataset.nav === section) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  const sub = document.getElementById('subbar');
  const tool = view === 'diagram' ? 'map' : view === 'tools' ? a || '' : null;
  sub.hidden = tool === null;
  sub.innerHTML = tool === null ? '' : toolBar(tool);
  document.title = `${BRAND}: ${app.querySelector('h1')?.textContent || 'Home'}`;
  window.scrollTo(0, 0);
  wire();
  initCanvas();
  fitTabs();
}

/** Behaviour for the few interactive parts of the current view. */
function wire() {
  const find = document.getElementById('find');
  if (find) {
    find.addEventListener('input', () => {
      const q = find.value.trim().toLowerCase();
      document.getElementById('results').innerHTML = q ? searchResults(q) : areaList();
    });
  }
  document.querySelectorAll('[data-rule]').forEach((button) =>
    button.addEventListener('click', () => {
      document.querySelectorAll('[data-rule]').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
      document.getElementById('link-groups').innerHTML = linkGroups(button.dataset.rule);
    }),
  );
}

// Arrow keys move through the tour.
document.addEventListener('keydown', (event) => {
  if (!location.hash.startsWith('#tour') || event.target.closest('input')) return;
  const current = parseInt(location.hash.split('/')[1], 10) || 1;
  if (event.key === 'ArrowRight' && current < TOUR.length) location.hash = `#tour/${current + 1}`;
  if (event.key === 'ArrowLeft' && current > 1) location.hash = `#tour/${current - 1}`;
});
window.addEventListener('hashchange', route);
route();
</script>
<script>
  // Fade each new view in. Watches #app, so the router itself is untouched.
  (function () {
    const app = document.getElementById('app');
    new MutationObserver(() => {
      app.classList.remove('view-in');
      void app.offsetWidth;
      app.classList.add('view-in');
    }).observe(app, { childList: true });
    app.classList.add('view-in');
  })();
</script>
