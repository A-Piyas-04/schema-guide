save, in one statement.","examples":[["0","first in the list"],["2","third"]]},"created_at":{"means":"When the session was first saved.","examples":["2026-10-10 15:02:11+00"]}}},{"name":"When and where it runs","text":"Each session has its own start and end, written in UTC (`+00`) like every timestamp here. The database checks that a session ends after it starts.","columns":{"starts_at":{"means":"When this sitting begins.","examples":["2026-12-19 10:00:00+00"]},"ends_at":{"means":"When it ends. Always after `starts_at`, or the row is refused.","examples":["2026-12-19 11:15:00+00"]},"seating_zone_id":{"means":"The [[seating_zones]] row for the part of the venue this sitting uses, set when it only uses part of it. NULL means the whole venue, or that the zone it named has since been deleted.","examples":[["211","only the Balcony at Harbour Hall"],["NULL","the whole venue"]]}}}],"records":[{"name":"The first sitting","text":"Uses the whole of Harbour Hall, so `seating_zone_id` is empty. First in the list, so `position` is `0`.","values":{"id":5301,"event_id":3064,"seating_zone_id":null,"name":"Saturday morning","position":0,"starts_at":"2026-12-19 10:00:00+00","ends_at":"2026-12-19 11:15:00+00","created_at":"2026-10-10 15:02:11+00"}},{"name":"Later the same day","text":"The same event and the same day, with its own times.","values":{"id":5302,"event_id":3064,"seating_zone_id":null,"name":"Saturday afternoon","position":1,"starts_at":"2026-12-19 14:00:00+00","ends_at":"2026-12-19 15:15:00+00","created_at":"2026-10-10 15:02:11+00"}},{"name":"Part of the venue only","text":"Uses only the Balcony, so it points at that zone. It was added two days after the other two.","values":{"id":5303,"event_id":3064,"seating_zone_id":211,"name":"Sunday morning","position":2,"starts_at":"2026-12-20 10:00:00+00","ends_at":"2026-12-20 11:15:00+00","created_at":"2026-10-12 09:40:00+00"}}],"scenarios":[{"title":"The Balcony zone is deleted","text":"Harbour Hall removes its Balcony zone. The Sunday morning session stays, with `seating_zone_id` cleared.","values":{"name":"Sunday morning","seating_zone_id":null}},{"title":"A session is moved up the list","text":"Sunday morning is moved to the top and the list is saved. The application renumbers every session of the event from 0, so Sunday morning becomes `0`, Saturday morning `1` and Saturday afternoon `2`.","values":{"name":"Sunday morning","position":0}},{"title":"Someone tries to delete the event","text":"Deleting an event deletes its sessions with it. Family Puppet Weekend has orders, though, and an event with orders can't be deleted, so its three sessions stay."}]}},"events":{"purpose":"One row per event on sale.","columns":{"venue_id":"NULL for an online-only event","created_by":"The organizer who first saved it. NULL once their account is deleted","slug":"Used in the public URL, unique inside the organization","status":"`sold_out` is set by the checkout job, not by hand","timezone":"IANA name. All the timestamps are absolute; this is how they are shown","doors_open_at":"NULL means doors open at `starts_at`","cancelled_at":"Set together with `status = 'cancelled'`; refunds are queued from here"},"notes":["An event can't be deleted while an organization still exists for it, and the organization can't be deleted while it has events.","Cancelling is not deleting: the row stays so tickets, payments and refunds still make sense."],"examples":{"intro":"An event is one thing an organization sells tickets for, such as a concert or a show. `status` is the one column that decides whether the public can see it and whether tickets can be bought.","groups":[{"name":"Which event","text":"Two ids for the same row: one for the database, one for everyone else.","columns":{"id":{"means":"The internal number. Ticket types, sessions, orders and tickets all join on it. It is never sent to a client.","examples":["3051"]},"public_id":{"means":"The event's id outside the server, wherever a client names it. Random, so nobody can guess another event's id or count how many there are from a URL.","examples":["a8e3f0c2-6d41-4b9a-8f27-1c5e9d03b7a6"]}}},{"name":"Whose it is, and where","text":"An event always belongs to one organization. It may or may not have a venue.","columns":{"organization_id":{"means":"The organization selling the event. An organization can't be deleted while it has events.","examples":["12"]},"venue_id":{"means":"The [[venues]] row for where it is held. NULL for an online-only event. A venue can't be deleted while an event, even a cancelled one, still points at it.","examples":[["140","Harbour Hall"],["NULL","online only"]]},"created_by":{"means":"The organizer who first saved the event, as a [[users]] row. NULL once that person's account is deleted; the event itself stays.","examples":[["2207","the organizer"],["NULL","their account has been deleted"]]}}},{"name":"What the public reads","text":"`title` and `summary` are the words; `slug` is the readable part of the web address.","columns":{"title":{"means":"The event's name.","examples":["Winter Jazz Night","Family Puppet Weekend"]},"slug":{"means":"A *slug* is a short, readable name used in a web address, like `winter-jazz-night`. Up to 80 characters. It is unique inside the organization, not across the platform, so two organizations can each have a `winter-jazz-night`.","examples":["winter-jazz-night","family-puppet-weekend"]},"summary":{"means":"A short description, when one was written. It can be empty.","examples":["An evening of big-band jazz in the main hall."]}}},{"name":"Where it is in its life","text":"An event moves `draft` → `on_sale` → `sold_out` → `completed`, and can be `cancelled` from any step. The two timestamps say when it was published and when it was cancelled.","columns":{"status":{"means":"Where the event is now. It decides whether the public can see the event and whether tickets can be bought.","examples":{"draft":"Still being set up; not on sale.","on_sale":"On sale: tickets can be bought.","sold_out":"Every ticket type is full. Set by the checkout job when the last type fills, never by hand, and put back to `on_sale` when a refund frees stock.","cancelled":"Called off. Possible from any step. The row stays, so its tickets, payments and refunds still make sense.","completed":"The event has taken place."}},"published_at":{"means":"When the event was published, if it has been. A ticket type with no `sales_start_at` is on sale from this moment.","examples":[["2026-10-01 09:00:00+00","published"],["NULL","not published yet"]]},"cancelled_at":{"means":"When the event was cancelled. Set together with `status = 'cancelled'`, and refunds are queued from there. Empty for an event that isn't cancelled.","examples":["2026-11-10 16:45:12+00"]}}},{"name":"When it happens","text":["Every timestamp is an absolute moment, written here in UTC (the `+00` at the end). `timezone` only decides how they are shown: Winter Jazz Night is stored as starting at 19:00 UTC and shown as 20:00 in Amsterdam.","The database checks the order: `ends_at` must be after `starts_at`, and the doors may not open after the start."],"columns":{"timezone":{"means":"How this event's times are shown, as a name from the *IANA time zone database*: the list every operating system uses, written `Region/City`, which also knows when summer time starts and ends. Every event has one, online events too.","examples":{"Europe/Amsterdam":"UTC+1 in winter, UTC+2 in summer","Europe/Lisbon":"UTC+0 in winter, UTC+1 in summer"}},"doors_open_at":{"means":"When the doors open. NULL means they open at `starts_at`. Never later than `starts_at`.","examples":[["2026-12-12 18:00:00+00","an hour before the start"],["NULL","doors open at the start"]]},"starts_at":{"means":"When the event begins.","examples":["2026-12-12 19:00:00+00"]},"ends_at":{"means":"When it ends. Always after `starts_at`, or the row is refused.","examples":["2026-12-12 22:30:00+00"]}},"table":{"head":["Column","Stored","Shown in Europe/Amsterdam"],"rows":[["doors_open_at","2026-12-12 18:00:00+00","12 December, 19:00"],["starts_at","2026-12-12 19:00:00+00","12 December, 20:00"],["ends_at","2026-12-12 22:30:00+00","12 December, 23:30"]],"prose":[2]}},{"name":"Timestamps","columns":{"created_at":{"means":"When the event was first saved.","examples":["2026-09-20 14:12:08+00"]},"updated_at":{"means":"The last change to the row. The application sets it, not a database trigger.","examples":["2026-10-01 09:00:00+00"]}}}],"records":[{"name":"On sale at a venue","text":"A one-night concert at Harbour Hall. Its ticket types are rows in [[ticket_types]], and the [[orders]] for it use the same event id.","values":{"id":3051,"public_id":"a8e3f0c2-6d41-4b9a-8f27-1c5e9d03b7a6","organization_id":12,"venue_id":140,"created_by":2207,"title":"Winter Jazz Night","slug":"winter-jazz-night","summary":"An evening of big-band jazz in the main hall.","status":"on_sale","timezone":"Europe/Amsterdam","doors_open_at":"2026-12-12 18:00:00+00","starts_at":"2026-12-12 19:00:00+00","ends_at":"2026-12-12 22:30:00+00","published_at":"2026-10-01 09:00:00+00","cancelled_at":null,"created_at":"2026-09-20 14:12:08+00","updated_at":"2026-10-01 09:00:00+00"}},{"name":"An online draft","text":"Online only, so `venue_id` is empty, but it still has a `timezone`: every event needs one to show its times. Not published yet, and nobody has written a summary.","values":{"id":3077,"public_id":"e19b5d07-3c8f-4e21-b6a0-7d4f2c95e831","organization_id":12,"venue_id":null,"created_by":2207,"title":"Songwriting Q&A","slug":"songwriting-q-and-a","summary":null,"status":"draft","timezone":"Europe/Amsterdam","doors_open_at":null,"starts_at":"2027-01-14 18:30:00+00","ends_at":"2027-01-14 19:30:00+00","published_at":null,"cancelled_at":null,"created_at":"2026-11-26 10:05:00+00","updated_at":"2026-11-26 10:22:40+00"}},{"name":"Sold out, running three times","text":"A weekend show with three sittings, which are rows in [[event_sessions]]; nothing is sold per session, only per event. The checkout job set `sold_out` when its last ticket type filled. `doors_open_at` is empty, so the doors open at the start.","values":{"id":3064,"public_id":"7f2c9a14-b05e-4d73-9a1c-e8b6f3027d59","organization_id":12,"venue_id":140,"created_by":2207,"title":"Family Puppet Weekend","slug":"family-puppet-weekend","summary":"Three short puppet shows for children and their families.","status":"sold_out","timezone":"Europe/Amsterdam","doors_open_at":null,"starts_at":"2026-12-19 10:00:00+00","ends_at":"2026-12-20 11:15:00+00","published_at":"2026-10-15 08:00:00+00","cancelled_at":null,"created_at":"2026-10-10 14:55:00+00","updated_at":"2026-11-22 20:41:17+00"}},{"name":"Cancelled","text":"Called off before the night. `cancelled_at` is set and the row stays. Lisbon is on UTC in winter, so the stored times read the same as the local ones. The organizer who created it has since deleted their account, so `created_by` is empty.","values":{"id":3012,"public_id":"0b6d3e85-f1a2-47c9-8e40-5a9c1d7b2f06","organization_id":12,"venue_id":141,"created_by":null,"title":"Lakeside Acoustic Night","slug":"lakeside-acoustic-night","summary":"Three acoustic sets on the terrace.","status":"cancelled","timezone":"Europe/Lisbon","doors_open_at":"2026-11-21 19:00:00+00","starts_at":"2026-11-21 20:00:00+00","ends_at":"2026-11-21 22:30:00+00","published_at":"2026-09-01 10:00:00+00","cancelled_at":"2026-11-10 16:45:12+00","created_at":"2026-08-25 11:30:00+00","updated_at":"2026-11-10 16:45:12+00"}}],"scenarios":[{"title":"An event sells out, then a ticket comes back","text":["Family Puppet Weekend sells its last ticket. The checkout job sets `sold_out`, because the last of its ticket types has filled.","Later a buyer is refunded, which frees stock, and the event goes back to `on_sale`."],"steps":["on_sale","sold_out","on_sale"],"values":{"status":"on_sale"}},{"title":"An event is cancelled","text":["Lakeside Acoustic Night is called off. `status` becomes `cancelled` and `cancelled_at` is set with it.","Refunds are queued from there: the cancellation job writes the [[refunds]] rows, with the reason `event_cancelled`. The event row stays."],"steps":["on_sale","cancelled"],"values":{"status":"cancelled","cancelled_at":"2026-11-10 16:45:12+00"}},{"title":"Someone tries to delete an event","text":["Deleting an event takes its sessions, ticket types, discount codes, attendees, check-ins and waitlist with it.","It is refused while the event has orders. Winter Jazz Night has them, so it stays. A draft nobody has bought from, like Songwriting Q&A, can be deleted."]}]}},"notifications":{"purpose":"One row per message the platform sent to one person.","columns":{"event_id":"What the message was about. Cleared if the event is deleted, which keeps the send record","channel":"Which transport was used","template_key":"Names the template in `app/mailers/`, e.g. `order.confirmed`","status":"`skipped` means the person had turned this message off","error":"Provider message for a `failed` send, kept for support"},"examples":{"intro":"A notification is one message to one person: an email, a text or a push message. The row records what was sent, how, and whether it went out.","groups":[{"name":"Who it was for","text":"Always one person with an account: `user_id` can't be empty.","columns":{"organization_id":{"means":"The organization the message was sent for. If the organization row is deleted, its notifications go with it.","examples":["12"]},"user_id":{"means":"The person, a row in [[users]]. Their `locale` there decides which language messages are sent in. If their account row is deleted, their notifications go with it.","examples":[["4310","Priya Nair"]]}}},{"name":"What it was about","columns":{"template_key":{"means":"Which message it was: the name of its template in `app/mailers/`.","examples":[["order.confirmed","the order confirmation"],["waitlist.offered","an offer from the waitlist"]]},"event_id":{"means":"The event the message was about, when it was about one. If the event is deleted this is cleared, and the record of the send stays.","examples":[["2990","the event Priya bought tickets for"],["NULL","the event has since been deleted"]]}},"scenarios":[{"title":"The event is deleted later","text":"An event the person was messaged about is deleted. The message stays here: only the link is cleared, and the row still says who was sent what, how and when.","values":{"event_id":null,"status":"sent"}}]},{"name":"How it was sent","columns":{"channel":{"means":"Which transport carried the message.","examples":{"email":"An email.","sms":"A text message to a phone.","push":"A push message to a phone or browser signed in through [[user_devices]]."}}}},{"name":"What happened to it","text":"A new row starts as `queued`, the column's default. The send worker's queue is exactly the `queued` rows.","columns":{"status":{"means":"Whether the message went out.","examples":{"queued":"Waiting for the send worker.","sent":"It went out.","failed":"The send failed; `error` says why.","skipped":"Not sent: the person had turned this message off."}},"sent_at":{"means":"When the message went out. Empty while it is `queued`, and for a `skipped` message, which never went out.","examples":["2026-11-20 09:14:58+00"]},"error":{"means":"The provider's message for a `failed` send, kept for support. The *provider* is the outside service that delivers the email, text or push for the platform.","examples":["550 5.1.1 Mailbox unavailable","Invalid 'To' phone number"]}},"scenarios":[{"title":"A send fails","text":"The mail provider rejects the address. The row stays, with the provider's own words in `error` for support to read.","values":{"status":"failed","error":"550 5.1.1 Mailbox unavailable"}}]},{"name":"The row itself","columns":{"id":{"means":"The internal number, for joins only. It is never sent to a client.","examples":["770314"]},"created_at":{"means":"When the message was queued: the row exists before anything is sent.","examples":["2026-11-20 09:14:53+00"]}}}],"records":[{"name":"A sent confirmation","text":"Priya's order confirmation for order 88120, sent by email a few seconds after it was queued.","values":{"id":770314,"organization_id":12,"user_id":4310,"event_id":2990,"channel":"email","template_key":"order.confirmed","status":"sent","sent_at":"2026-11-20 09:14:58+00","error":null,"created_at":"2026-11-20 09:14:53+00"}},{"name":"Still in the queue","text":"The waitlist release job has just offered Lena a ticket and queued this push message. The send worker hasn't picked it up yet.","values":{"id":771902,"organization_id":12,"user_id":5873,"event_id":3051,"channel":"push","template_key":"waitlist.offered","status":"queued","sent_at":null,"error":null,"created_at":"2026-11-28 10:05:02+00"}},{"name":"Skipped","text":"This person had turned this message off, so the text never went out and `sent_at` is empty.","values":{"id":771655,"organization_id":12,"user_id":6034,"event_id":3051,"channel":"sms","template_key":"order.confirmed","status":"skipped","sent_at":null,"error":null,"created_at":"2026-11-27 20:11:40+00"}}],"scenarios":[{"title":"A waitlist place opens up","text":["The waitlist release job runs every five minutes. It offers freed stock to the oldest `waiting` entry in [[waitlist_entries]], Lena's, and queues a notification: a new row here, `queued`.","The send worker picks it up and sends it."],"steps":["queued","sent"],"values":{"user_id":5873,"template_key":"waitlist.offered","channel":"push","status":"sent","sent_at":"2026-11-28 10:05:09+00"}},{"title":"A person deletes their account","text":["Priya deletes her account. It is hidden at once, and the nightly purge removes the [[users]] row once it has been deleted for more than 30 days.","Her notifications go with that row. `user_id` is a cascading link, unlike `event_id`, which is only cleared."]}]}},"order_lines":{"purpose":"One row per ticket type in an order, with how many were bought.","columns":{"line_no":"Numbered from 1 inside the order, and never reused","unit_price_cents":"The price at the moment of checkout, not today's price","line_total_cents":"`unit_price_cents × quantity`, stored so historic orders never move"},"notes":["Editing a paid order is not allowed. A mistake is refunded and bought again."],"examples":{"intro":"An order line is one ticket type in an order: how many were bought, and at what price. An order for two kinds of ticket has two lines.","groups":[{"name":"Which line","text":"A line has no id of its own. Its key is the pair `(order_id, line_no)`: a *composite key*, two columns that only name one row together. [[attendees]] points at a line with both.","columns":{"order_id":{"means":"The order the line belongs to, from [[orders]]. Deleting the order deletes its lines too.","examples":["90412","88120"]},"line_no":{"means":"The line's number inside its order, counting from 1. A number is never reused inside the same order.","examples":[["1","the order's first line"],["2","its second line"]]}}},{"name":"What was bought","text":"One line per ticket type. Each ticket on it becomes its own row in [[attendees]], so a line for 2 makes two tickets.","columns":{"ticket_type_id":{"means":"The ticket type bought, from [[ticket_types]]. A ticket type that any line points at can't be deleted: the database refuses.","examples":[["7101","General admission, event 3051"],["5980","Stalls, reserved, event 2990"]]},"quantity":{"means":"How many tickets of that type. Always at least 1; the database checks it.","examples":["2","1"]}}},{"name":"The money","text":["Whole cents, in the order's `currency`: the line has no currency of its own.","The database checks the sum: `line_total_cents` must equal `unit_price_cents × quantity`, or the row is refused. An order's lines added up give its `subtotal_cents`. The table shows Priya's order 88120, which has two lines."],"columns":{"unit_price_cents":{"means":"The price of one ticket at the moment of checkout, not today's price. If the organizer changes the price later, this keeps the old one.","examples":[["2500","25.00"],["3500","35.00"],["0","a free *comp* (complimentary) ticket"]]},"line_total_cents":{"means":"`unit_price_cents × quantity`, stored so a past order's total never moves.","examples":[["5000","2 × 2500"],["7000","2 × 3500"]]}},"table":{"head":["line_no","Ticket type","quantity × unit_price_cents","line_total_cents"],"rows":[["1","Stalls, reserved","2 × 3500","7000"],["2","Standing","2 × 2500","5000"],["","The order's `subtotal_cents`","","12000"]],"prose":[1]},"scenarios":[{"title":"The price changes after checkout","text":"The organizer raises General admission at event 3051 from 25.00 to 30.00. Amira's line was priced at checkout, so it keeps the old price, and her order's totals don't move.","values":{"unit_price_cents":2500,"line_total_cents":5000}}]}],"records":[{"name":"Two tickets of one type","text":"Amira's order 90412: two General admission tickets at 25.00, on one line. They become two rows in [[attendees]].","values":{"order_id":90412,"line_no":1,"ticket_type_id":7101,"quantity":2,"unit_price_cents":2500,"line_total_cents":5000}},{"name":"The first of two lines","text":"Priya's order 88120 mixes two ticket types, so it has two lines. This one is two reserved seats. The order was later partly refunded, but a paid order is never edited, so the line still shows what was bought.","values":{"order_id":88120,"line_no":1,"ticket_type_id":5980,"quantity":2,"unit_price_cents":3500,"line_total_cents":7000}},{"name":"The second line","text":"The same order's standing tickets, with `line_no` 2. 7000 + 5000 is the order's `subtotal_cents` of 12000.","values":{"order_id":88120,"line_no":2,"ticket_type_id":5981,"quantity":2,"unit_price_cents":2500,"line_total_cents":5000}},{"name":"A free ticket","text":"A `comp` ticket costs nothing, so its price and total are 0. It still needs a line, because every ticket in [[attendees]] hangs off one.","values":{"order_id":90433,"line_no":1,"ticket_type_id":7104,"quantity":1,"unit_price_cents":0,"line_total_cents":0}}],"scenarios":[{"title":"A paid order has a mistake in it","text":["A buyer pays for three tickets but meant to buy two.","Editing a paid order is not allowed, so the line stays as it is. The mistake is refunded, as a row in [[refunds]], and bought again."]},{"title":"Someone tries to delete a ticket type that has sold","text":"The organizer tries to delete General admission at event 3051. Amira's line points at it, so the database refuses the delete."},{"title":"An order is deleted","text":"Deleting an order takes its lines with it, and their attendees and check-ins. The delete is refused while a payment or a refund points at the order."}]}},"orders":{"purpose":"One row per basket, which becomes a purchase once it is paid.","columns":{"user_id":"NULL for guest checkout, which is most orders","discount_code_id":"Cleared if the code is deleted; `discount_cents` keeps the money that was taken off","buyer_email":"Where the tickets were sent. The only way to find a guest order","status":"`cart` rows are not purchases and are excluded from every report","subtotal_cents":"Sum of the order lines, before discount and fee","fee_cents":"The platform's cut, taken from `organizations.fee_bps` at checkout","total_cents":"What the buyer was charged. The database checks it against the other three","placed_at":"Set when the basket is submitted; NULL while `status = 'cart'`","expires_at":"When an unpaid basket releases its held tickets"},"notes":["A basket is a row here from the first ticket added, so held stock is visible to everyone.","Abandoned baskets are swept hourly: `status` becomes `expired` and the held quantities go back."],"examples":{"intro":"An order is a basket from the moment the first ticket goes in, and a purchase once it is paid. Most of its columns are about money, and every amount is in whole cents.","groups":[{"name":"Which order","text":"Two ids for the same row: one for the database, one for everyone else.","columns":{"id":{"means":"The internal number. Other tables join on it; it is never sent to a browser or the app.","examples":["90412"]},"public_id":{"means":"The order's id outside the server: in receipt links, emails and the API. Random, so nobody can guess another order's id or count how many there are.","examples":["6f1c2a9e-4b7d-4e0a-9c3f-2d8e5b1a7c40"]}}},{"name":"Who is buying, and what for","text":"An order is always for one event. The buyer may or may not have an account.","columns":{"organization_id":{"means":"The organization selling the tickets.","examples":["12"]},"event_id":{"means":"The event the tickets are for. One order never mixes events.","examples":["3051"]},"user_id":{"means":"The signed-in buyer, when there is one. NULL for guest checkout, which is most orders.","examples":[["5521","a buyer with an account"],["NULL","a guest"]]},"buyer_email":{"means":"Where the tickets were sent. For a guest order it is the only way to find the order again, so it is required even when `user_id` is set.","examples":["amira.k@example.com"]},"buyer_name":{"means":"The buyer's name, when one was given. It can be empty.","examples":["Amira Khan"]}}},{"name":"Where it is in its life","text":"`status` says what the order is right now; the two timestamps say when it was submitted and when an unpaid basket gives up.","columns":{"status":{"means":"What the order is right now. Only `cart` rows are not purchases, and every report leaves them out.","examples":{"cart":"A basket still being filled. Its tickets are held, but nothing is bought yet.","pending":"Submitted; waiting for the payment to go through.","paid":"Paid in full.","partially_refunded":"Some of the money has gone back to the buyer.","refunded":"All of the money has gone back.","cancelled":"Cancelled by the organizer.","expired":"An unpaid basket the hourly sweeper closed; its held tickets went back on sale."}},"placed_at":{"means":"When the basket was submitted. NULL while the order is still a `cart`, and for a basket that expired without being submitted.","examples":["2026-11-27 18:02:41+00"]},"expires_at":{"means":"When an unpaid basket gives back the tickets it is holding.","examples":["2026-11-27 18:15:00+00"]}}},{"name":"The money","text":["Every amount is whole cents in the order's `currency`, so 47.25 euros is stored as `4725`. Whole numbers never pick up rounding errors the way decimals can.","The database itself checks the sum: `total_cents` must equal `subtotal_cents − discount_cents + fee_cents`, or the row is refused."],"columns":{"currency":{"means":"The three-letter currency code (ISO 4217) every amount on this row is in.","examples":{"EUR":"euros","USD":"US dollars","GBP":"pounds sterling"}},"subtotal_cents":{"means":"The order lines added up, before any discount or fee.","examples":[["5000","two tickets at 25.00"]]},"discount_code_id":{"means":"The discount code the buyer entered, if any. If the code is deleted later this is cleared, but `discount_cents` keeps the amount that was taken off.","examples":[["77","the code SPRING10"],["NULL","no code used"]]},"discount_cents":{"means":"How much the discount took off. `0` when no code was used.","examples":[["500","10% of 5000"],["0","no discount"]]},"fee_cents":{"means":"The platform's cut, worked out from the organization's `fee_bps` (basis points: 100 = 1%) at checkout.","examples":["225"]},"total_cents":{"means":"What the buyer was charged.","examples":[["4725","5000 − 500 + 225"]]}},"table":{"head":["Column","Value","Why"],"rows":[["subtotal_cents","5000","Two tickets at 25.00 EUR"],["discount_cents","500","The code SPRING10 takes 10% off"],["fee_cents","225","The platform's cut, from the organization's `fee_bps`"],["total_cents","4725","5000 − 500 + 225: the database checks this"]],"prose":[2]},"scenarios":[{"title":"The discount code is deleted later","text":"The organizer deletes SPRING10 after the sale ends. The order keeps the money that was taken off; only the link to the code goes.","values":{"discount_code_id":null,"discount_cents":500,"total_cents":4725}}]},{"name":"Timestamps","columns":{"created_at":{"means":"When the row was made: the moment the first ticket went into the basket, not when it was paid.","examples":["2026-11-27 17:58:10+00"]},"updated_at":{"means":"The last change to the row. The application sets it, not a database trigger.","examples":["2026-11-27 18:02:55+00"]}}}],"records":[{"name":"A paid guest order","text":"Amira buys two tickets without an account, using the code SPRING10.","values":{"id":90412,"public_id":"6f1c2a9e-4b7d-4e0a-9c3f-2d8e5b1a7c40","organization_id":12,"event_id":3051,"user_id":null,"discount_code_id":77,"buyer_email":"amira.k@example.com","buyer_name":"Amira Khan","status":"paid","currency":"EUR","subtotal_cents":5000,"discount_cents":500,"fee_cents":225,"total_cents":4725,"placed_at":"2026-11-27 18:02:41+00","expires_at":"2026-11-27 18:15:00+00","created_at":"2026-11-27 17:58:10+00","updated_at":"2026-11-27 18:02:55+00"}},{"name":"A basket in progress","text":"Jonas, who has an account, has one ticket in his basket and hasn't checked out yet. The fee is only worked out at checkout.","values":{"id":90418,"public_id":"b2d97e10-5f3a-4c61-8e0b-7a4c19d3e256","organization_id":12,"event_id":3051,"user_id":5521,"discount_code_id":null,"buyer_email":"jonas.weber@example.com","buyer_name":"Jonas Weber","status":"cart","currency":"EUR","subtotal_cents":2500,"discount_cents":0,"fee_cents":0,"total_cents":2500,"placed_at":null,"expires_at":"2026-11-27 18:40:00+00","created_at":"2026-11-27 18:25:00+00","updated_at":"2026-11-27 18:25:00+00"}},{"name":"An expired basket","text":"Someone filled a basket and left. The sweeper closed it after `expires_at`; the row stays, but it was never a purchase.","values":{"id":90377,"public_id":"0c8a4f52-e1b9-47d3-a6f0-93d25b7e1c84","organization_id":12,"event_id":3051,"user_id":null,"discount_code_id":null,"buyer_email":"sam.lee@example.com","buyer_name":null,"status":"expired","currency":"EUR","subtotal_cents":7500,"discount_cents":0,"fee_cents":0,"total_cents":7500,"placed_at":null,"expires_at":"2026-11-27 16:10:00+00","created_at":"2026-11-27 15:55:00+00","updated_at":"2026-11-27 17:00:03+00"}},{"name":"A partly refunded order","text":"A paid order for four tickets, where one ticket's money has gone back. The refund itself is a row in [[refunds]].","values":{"id":88120,"public_id":"e47b1d06-9a2c-4f85-b3e7-1d60c8a5f913","organization_id":12,"event_id":2990,"user_id":4310,"discount_code_id":null,"buyer_email":"priya.n@example.com","buyer_name":"Priya Nair","status":"partially_refunded","currency":"EUR","subtotal_cents":12000,"discount_cents":0,"fee_cents":600,"total_cents":12600,"placed_at":"2026-11-20 09:14:22+00","expires_at":"2026-11-20 09:25:00+00","created_at":"2026-11-20 09:10:05+00","updated_at":"2026-11-24 11:30:47+00"}}],"scenarios":[{"title":"A buyer abandons a basket","text":["Sam adds three tickets and closes the tab. The row has existed since the first ticket went in, so those tickets are held from everyone else.","Once `expires_at` has passed, the hourly basket sweeper closes the basket and gives the held tickets back."],"steps":["cart","expired"],"values":{"status":"expired","placed_at":null}},{"title":"A guest checks out","text":"Amira submits her basket without signing in, and her payment goes through.","steps":["cart","pending","paid"],"values":{"status":"paid","user_id":null,"buyer_email":"amira.k@example.com","placed_at":"2026-11-27 18:02:41+00"}},{"title":"Some of the money goes back","text":"Priya returns one of her four tickets. A [[refunds]] row records the money, and the order moves on from `paid`.","steps":["paid","partially_refunded"],"values":{"status":"partially_refunded"}}]}},"org_members":{"purpose":"One row per person who may act for an organization.","columns":{"role":"What this person may do in the organizer dashboard","invited_by":"Who sent the invitation. NULL once that account is deleted","accepted_at":"NULL while the invitation is still outstanding"},"notes":["No surrogate key: the pair of ids is the primary key, so one person can hold one role per organization."],"examples":{"intro":"One row says that one person may act for one organization, and in which role. The row is there from the moment the invitation is sent; `accepted_at` says whether it has been taken up.","groups":[{"name":"Who, and for which organization","text":["There is no `id` column. The pair of ids *is* the key, so one person holds one role per organization.","The same person can still belong to several organizations, with a different role in each."],"columns":{"organization_id":{"means":"The organization the person may act for. If the organization is deleted for real, its memberships go with it.","examples":["12"]},"user_id":{"means":"The person, in [[users]]. It can't be empty, so even an invitation nobody has accepted yet names an existing account. If that account is deleted for real, the membership goes with it.","examples":["5388"]}},"table":{"head":["organization_id","user_id","role","What it shows"],"rows":[["12","5104","owner","Mei at Lakeside Jazz Club"],["12","5388","organizer","Ana at the same organization"],["41","5388","admin","Ana again, at a venue group's sub-account, with another role"]],"prose":[3]}},{"name":"What they may do","columns":{"role":{"means":"What this person may do in the organizer dashboard. The database only checks that it is one of these five names; what each one allows is decided by the application.","examples":{"owner":"The organization's owner.","admin":"An administrator for the organization.","organizer":"Someone who works on the organization's events.","finance":"Someone who looks after the organization's money.","viewer":"Someone who may look at the dashboard."}}},"scenarios":[{"title":"A member's role is changed","text":"Leo moves from `viewer` to `organizer`. His row is changed in place: there can't be a second row for the same person and organization. [[audit_log]] gets an entry with the action `role_changed`.","values":{"organization_id":12,"user_id":5602,"role":"organizer"}}]},{"name":"The invitation","text":"Each row records an invitation: who sent it, when, and when it was accepted. While `accepted_at` is empty the invitation is outstanding, and it appears in the organization's list of outstanding invitations.","columns":{"invited_by":{"means":"Who sent the invitation, in [[users]]. NULL once that account is deleted; the membership itself stays.","examples":[["5104","Mei Tanaka"],["NULL","the inviter's account has since been deleted"]]},"invited_at":{"means":"When the invitation was sent. If nothing else is given, the database fills in the moment the row is made.","examples":["2026-11-25 09:00:00+00"]},"accepted_at":{"means":"When the person accepted. NULL while the invitation is still outstanding.","examples":[["2026-03-02 14:40:18+00","accepted"],["NULL","not accepted yet"]]}},"scenarios":[{"title":"An invitation is accepted","text":"Mei invites Leo as a `viewer`. His row is there at once, with `accepted_at` empty. When he accepts, `accepted_at` gets the time.","steps":["invited","accepted"],"values":{"organization_id":12,"user_id":5602,"accepted_at":"2026-11-28 10:02:11+00"}}]}],"records":[{"name":"A member who accepted","text":"Mei invited Ana to Lakeside Jazz Club as an `organizer`, and Ana accepted the same afternoon.","values":{"organization_id":12,"user_id":5388,"role":"organizer","invited_by":5104,"invited_at":"2026-03-02 10:15:00+00","accepted_at":"2026-03-02 14:40:18+00"}},{"name":"An invitation still outstanding","text":"Mei invited Leo on 25 November. Until he accepts, `accepted_at` stays empty and the invitation is listed among the organization's outstanding ones.","values":{"organization_id":12,"user_id":5602,"role":"viewer","invited_by":5104,"invited_at":"2026-11-25 09:00:00+00","accepted_at":null}},{"name":"The inviter's account is gone","text":"Tom was invited by someone whose account has since been deleted. `invited_by` was cleared; Tom's membership and role are untouched.","values":{"organization_id":12,"user_id":5230,"role":"finance","invited_by":null,"invited_at":"2025-01-20 16:30:00+00","accepted_at":"2025-01-21 08:05:44+00"}}],"scenarios":[{"title":"A member's account is deleted","text":["Mei's [[users]] row is removed for real. Her own membership, as owner of Lakeside Jazz Club, goes with it.","The memberships she sent invitations for stay. Ana's and Leo's rows keep their roles, with `invited_by` cleared."],"values":{"organization_id":12,"user_id":5388,"invited_by":null}}]}},"organizations":{"purpose":"One row per organizer account that sells tickets.","columns":{"parent_org_id":"Set for a venue group's sub-accounts, which share billing. NULL for a standalone organizer","slug":"Used in the public URL and unique across the whole platform","plan":"Decides the feature flags, not the fee","payout_currency":"Payouts are made in this currency; events may still sell in another","fee_bps":"Platform fee in basis points, copied onto each order at checkout","deleted_at":"Hides the organization. Events, orders and payments are kept"},"notes":["The tenant root: almost everything else is reachable from a row here."],"examples":{"intro":"One row is one organizer account that sells tickets. It is the tenant root: almost every other row in the database can be traced back to an organization.","groups":[{"name":"Which organization","text":"Three ways to name the same row: an internal number for joins, a random id for everyone outside the server, and a readable `slug` for the web address.","columns":{"id":{"means":"The internal number. Other tables join on it; it is never sent to a browser or the app.","examples":["12"]},"public_id":{"means":"The organization's id outside the server. Random, so nobody can guess another organization's id or count how many there are.","examples":["9d4e7b21-3c8a-4f16-b5e2-71a0c6d93f48"]},"name":{"means":"The organization's name.","examples":["Lakeside Jazz Club","Example Venue Group"]},"slug":{"means":"The short name in the organization's public web address (URL), at most 63 characters. It is unique across the whole platform, not just inside one account. The rule counts hidden (soft-deleted) organizations too, so a slug stays taken for as long as its row exists.","examples":["lakeside-jazz-club","example-venue-group"]}},"scenarios":[{"title":"A second organization asks for a slug that is taken","text":"A new organizer tries to use `lakeside-jazz-club`. The database refuses the row, because that slug already belongs to organization 12.","values":{"id":12,"slug":"lakeside-jazz-club"}}]},{"name":"Part of a venue group","text":"A venue group runs several sub-accounts under one parent organization, and they share billing. The parent is just another row in this same table.","columns":{"parent_org_id":{"means":"The parent organization, for a venue group's sub-account. NULL for a standalone organizer.","examples":[["40","a sub-account of Example Venue Group"],["NULL","a standalone organizer"]]}},"scenarios":[{"title":"The parent organization is deleted","text":"When the parent row is deleted for real, its sub-accounts stay, with `parent_org_id` cleared. Nothing cascades.","values":{"id":41,"parent_org_id":null}}]},{"name":"Plan, currency and fee","text":["`plan` switches features on and off. It does not set the fee: that is `fee_bps`, on the same row.","`fee_bps` is in *basis points*, hundredths of a percent: `100` is 1%, and the default `250` is 2.5%. The database refuses anything outside 0 to 2000, which is 0% to 20%."],"columns":{"plan":{"means":"Which plan the organization is on. It decides the feature flags (the switches in the application that turn features on or off), not the fee.","examples":{"free":"Where every new organization starts: it is the column's default.","pro":"Switches on the features the application ties to `pro`.","enterprise":"Switches on the features the application ties to `enterprise`."}},"payout_currency":{"means":"The three-letter currency code (ISO 4217, the international list of currency codes) the organization's payouts are made in. Its events may still sell tickets in another currency.","examples":{"USD":"US dollars, the default","EUR":"euros","GBP":"pounds sterling"}},"fee_bps":{"means":"The platform's fee, in basis points (100 = 1%). It is copied onto each order at checkout, so changing it later never changes an order already placed.","examples":[["250","2.5%, the default"],["500","5%"],["0","no fee at all"]]}},"table":{"head":["fee_bps","As a percent","Fee on a 100.00 sale"],"rows":[["0","0%","0.00"],["250","2.5%, the default","2.50"],["500","5%","5.00"],["2000","20%, the most the database allows","20.00"]],"prose":[1,2]},"scenarios":[{"title":"The fee is changed","text":"Lakeside Jazz Club's fee is lowered from `500` to `400`. Orders it has already sold keep the 5% fee they were charged; only checkouts from now on use 4%.","values":{"id":12,"fee_bps":400}}]},{"name":"Timestamps and deletion","text":"Organizations are soft-deleted: deleting one sets `deleted_at` and hides it, while its events, orders and payments are kept.","columns":{"created_at":{"means":"When the organization's row was made.","examples":["2024-03-18 11:02:45+00"]},"updated_at":{"means":"The last change to the row. The application sets it, not a database trigger.","examples":["2026-10-05 08:30:12+00"]},"deleted_at":{"means":"When the organization was deleted. Setting it hides the organization at once (a *soft delete*); its events, orders and payments are kept. The nightly purge job removes rows soft-deleted more than 30 days ago.","examples":[["NULL","a live organization"],["2026-11-02 15:40:00+00","hidden since then"]]}}}],"records":[{"name":"A standalone organizer","text":"Lakeside Jazz Club sells its own events, with no parent. It is the organizer behind the sample rows in [[orders]]: paid out in euros, with a 5% fee.","values":{"id":12,"public_id":"9d4e7b21-3c8a-4f16-b5e2-71a0c6d93f48","parent_org_id":null,"name":"Lakeside Jazz Club","slug":"lakeside-jazz-club","plan":"pro","payout_currency":"EUR","fee_bps":500,"created_at":"2024-03-18 11:02:45+00","updated_at":"2026-10-05 08:30:12+00","deleted_at":null}},{"name":"A venue group's sub-account","text":"Riverside Hall is one of the sub-accounts under Example Venue Group (organization 40). They share billing through the parent.","values":{"id":41,"public_id":"c03a85f6-7e21-4b9d-a4c8-5f12e0b76d39","parent_org_id":40,"name":"Example Venue Group: Riverside Hall","slug":"example-venue-group-riverside-hall","plan":"enterprise","payout_currency":"GBP","fee_bps":250,"created_at":"2025-06-02 13:47:20+00","updated_at":"2025-06-02 13:47:20+00","deleted_at":null}},{"name":"A new organization on the defaults","text":"Every column left out when the row was made took its default: plan `free`, payouts in US dollars, and a 2.5% fee.","values":{"id":57,"public_id":"5e9b0d14-2a6f-4c37-8b1e-e4d7a3920c65","parent_org_id":null,"name":"Example Comedy Nights","slug":"example-comedy-nights","plan":"free","payout_currency":"USD","fee_bps":250,"created_at":"2026-11-27 14:12:09+00","updated_at":"2026-11-27 14:12:09+00","deleted_at":null}},{"name":"A deleted organization","text":"Hidden since 2 November, but the row is still here, so its slug is still taken. The nightly purge job removes rows soft-deleted more than 30 days ago.","values":{"id":33,"public_id":"a71f2c98-0d4b-4e63-9f5a-38c6b1e7d204","parent_org_id":null,"name":"Example Test Account","slug":"example-test-account","plan":"free","payout_currency":"USD","fee_bps":250,"created_at":"2025-01-09 10:20:31+00","updated_at":"2026-11-02 15:40:00+00","deleted_at":"2026-11-02 15:40:00+00"}}],"scenarios":[{"title":"An organization is deleted","text":["Deleting an organization sets `deleted_at`. It is hidden at once, and its events, orders and payments are all kept.","The nightly purge job removes rows soft-deleted more than 30 days ago. Removing the row for real is refused while the organization still has events, orders, payments or payout batches. Its members, venues, discount codes and [[audit_log]] entries don't stop it: they go with the row."],"steps":["live","hidden: `deleted_at` set"],"values":{"id":33,"deleted_at":"2026-11-02 15:40:00+00"}}]}},"payments":{"purpose":"One row per attempt to charge a buyer.","columns":{"payout_batch_id":"Set when the payment is swept into a payout. NULL until then","provider":"Which processor took the money","provider_charge_id":"The processor's own id, unique per provider. NULL for an attempt that never reached them","status":"`disputed` is set from a provider webhook and never by the application","failure_code":"The provider's code for a `failed` attempt"},"notes":["A failed attempt stays. An order can have several rows here and at most one that succeeded.","Nothing here is ever deleted: both the order and the organization refuse to go while payments exist."],"examples":{"intro":"A payment is one attempt to charge a buyer for an order. A declined card is a row too, so an order can have several attempts here, and at most one of them succeeded.","groups":[{"name":"Which payment","text":"Two ids for the same row, as on [[orders]]: one for the database, one for everyone else.","columns":{"id":{"means":"The internal number. Other tables join on it; it is never sent to a client.","examples":["62144"]},"public_id":{"means":"The payment's id outside the server. Random, so nobody can guess another payment's id or count how many there are.","examples":["a3e5c7d9-1f2b-4c6d-8e0a-5b7c9d1e3f42"]}}},{"name":"What it pays for","text":"Every attempt is against one order. Neither the order nor the organization can be deleted while a payment points at it, so rows here are never deleted.","columns":{"organization_id":{"means":"The organization selling the tickets. It can't be deleted while it has payments.","examples":["12"]},"order_id":{"means":"The order this attempt tries to pay for. Failed attempts stay, so one order can have several rows here, and at most one that succeeded.","examples":[["90412","Amira's order, 47.25 EUR"],["88120","Priya's order, 126.00 EUR"]]}}},{"name":"Who took the money","text":"A *payment processor* is the outside company that actually charges the buyer's card or account and moves the money, such as Stripe or PayPal.","columns":{"provider":{"means":"Which processor took the money.","examples":{"stripe":"Charged through Stripe.","paypal":"Paid through PayPal."}},"provider_charge_id":{"means":"The processor's own id for this charge (its *charge id*). The pair `provider` + `provider_charge_id` is unique, so the same charge is never recorded twice. NULL for an attempt that never reached the processor.","examples":[["ch_3QxDEMO0090412","a Stripe charge"],["DEMO-PP-0088120","a PayPal one"],["NULL","the attempt never reached the processor"]]}}},{"name":"How much","text":"Whole cents in the payment's own `currency`, like every amount in this database: 47.25 euros is stored as `4725`.","columns":{"amount_cents":{"means":"What this attempt tried to charge. The database refuses `0` or less.","examples":[["4725","47.25: order 90412's total"],["12600","126.00: order 88120's total"]]},"currency":{"means":"The three-letter currency code (ISO 4217) that `amount_cents` is in.","examples":{"EUR":"euros","GBP":"pounds sterling","USD":"US dollars"}}}},{"name":"How it went","text":"A new attempt starts as `pending`, the column's default. `failure_code` and `paid_at` say how it ended.","columns":{"status":{"means":"Where the attempt stands.","examples":{"pending":"Started; the outcome isn't known yet.","succeeded":"The money was taken. Succeeded payments are the ones the weekly payout sweep picks up.","failed":"The charge didn't go through. The row stays, with the processor's reason in `failure_code`.","disputed":"The buyer has challenged the charge with their bank or the processor (a *chargeback*). Set from a *webhook*, a message the processor sends to the platform, and never by the application."}},"failure_code":{"means":"The processor's short code for why a `failed` attempt failed. Only a failed attempt has one.","examples":{"card_declined":"the card's bank said no","insufficient_funds":"not enough money on the card","expired_card":"the card is past its expiry date"}},"paid_at":{"means":"When the money was taken.","examples":["2026-11-27 18:02:53+00"]},"created_at":{"means":"When the attempt was started and the row was made.","examples":["2026-11-27 18:02:42+00"]}}},{"name":"Passing the money on","text":["Takings reach the organizer in batches. The weekly payout sweep opens a [[payout_batches]] row per organization and sets `payout_batch_id` on the succeeded payments inside the period.","Until then a succeeded payment has no batch. An index lists exactly those rows, by organization and `paid_at`, so the next sweep can find them."],"columns":{"payout_batch_id":{"means":"The payout this payment's money went out in. NULL until the sweep picks it up. A payment is in at most one batch; if that batch row were deleted, this would be cleared and the payment kept.","examples":[["418","organization 12's payout for 16–22 November"],["NULL","not paid out yet"]]}},"scenarios":[{"title":"The weekly sweep picks a payment up","text":"Order 88120's payment succeeded on 20 November. The sweep opens batch 418 for organization 12, for 16–22 November, and sets `payout_batch_id` on this payment along with the week's other succeeded ones.","values":{"status":"succeeded","paid_at":"2026-11-20 09:14:51+00","payout_batch_id":418}}]}],"records":[{"name":"Paid, not paid out yet","text":"Amira's order 90412, charged through Stripe on 27 November. The weekly sweep hasn't picked it up yet, so `payout_batch_id` is empty.","values":{"id":62144,"public_id":"a3e5c7d9-1f2b-4c6d-8e0a-5b7c9d1e3f42","organization_id":12,"order_id":90412,"payout_batch_id":null,"provider":"stripe","provider_charge_id":"ch_3QxDEMO0090412","amount_cents":4725,"currency":"EUR","status":"succeeded","failure_code":null,"paid_at":"2026-11-27 18:02:53+00","created_at":"2026-11-27 18:02:42+00"}},{"name":"Paid, and paid out","text":"Priya's order 88120, paid through PayPal and swept into organization 12's payout for 16–22 November. The ticket refunded later is a row in [[refunds]] pointing at this payment; there is no refunded status here.","values":{"id":61877,"public_id":"5d0b8e21-7c4a-4f93-b6e2-0a9c3d7f1e58","organization_id":12,"order_id":88120,"payout_batch_id":418,"provider":"paypal","provider_charge_id":"DEMO-PP-0088120","amount_cents":12600,"currency":"EUR","status":"succeeded","failure_code":null,"paid_at":"2026-11-20 09:14:51+00","created_at":"2026-11-20 09:14:23+00"}},{"name":"A declined card","text":"Tomás's first card for order 90431 was declined. The attempt reached Stripe, so it has a charge id, and it stays as a `failed` row next to the attempt that worked.","values":{"id":62149,"public_id":"c81f4a06-2e9d-4b37-a5c8-6f0e2d9b4a13","organization_id":12,"order_id":90431,"payout_batch_id":null,"provider":"stripe","provider_charge_id":"ch_3QxDEMO0090431a","amount_cents":2625,"currency":"EUR","status":"failed","failure_code":"card_declined","paid_at":null,"created_at":"2026-11-27 19:41:05+00"}}],"scenarios":[{"title":"A card is declined, then another one works","text":["Tomás's first card is declined. That attempt stays, as `failed` with the processor's code.","He tries a second card and it goes through. That is a second row for the same order, with its own charge id, and the only one of the two that `succeeded`."],"values":{"order_id":90431,"provider_charge_id":"ch_3QxDEMO0090431b","status":"succeeded","failure_code":null,"paid_at":"2026-11-27 19:42:31+00"}},{"title":"A buyer disputes a charge","text":"Some time later, a buyer challenges a charge with their bank. The processor tells the platform through a webhook, and that webhook is what sets `disputed`: the application never does.","steps":["succeeded","disputed"],"values":{"status":"disputed"}}]}},"payout_batches":{"purpose":"One row per transfer of takings to an organizer.","columns":{"period_start":"First day of takings in this batch, inclusive","period_end":"Last day of takings in this batch, inclusive","gross_cents":"Sum of the successful payments swept into the batch","fee_cents":"Sum of the platform fees on those payments","net_cents":"What was actually sent. The database checks it against the other two","status":"`sent` means handed to the bank; `paid` means the bank confirmed it"},"examples":{"intro":"A payout batch is one transfer of takings to an organizer: the succeeded payments of one period added up, minus the platform's fees on them.","groups":[{"name":"Who is paid","columns":{"id":{"means":"The internal number. Each [[payments]] row swept into this batch points at it through `payout_batch_id`.","examples":["418"]},"organization_id":{"means":"The organization being paid. It can't be deleted while it has payout batches.","examples":["12"]}}},{"name":"Which takings it covers","text":["Both dates are included: a batch for 16–22 November covers every day from the 16th to the 22nd. They are plain dates, with no time of day.","The database refuses a period that ends before it starts, and a second batch for the same organization with the same two dates."],"columns":{"period_start":{"means":"The first day of takings in this batch, included.","examples":["2026-11-16"]},"period_end":{"means":"The last day of takings in this batch, included. It may be the same day as `period_start`, never earlier.","examples":["2026-11-22"]}},"scenarios":[{"title":"The same period twice","text":"Organization 12 already has batch 418 for 16–22 November. Another row for organization 12 with those same two dates would be refused by the database."}]},{"name":"The money","text":["*Gross* is the money before the platform's fees come off; *net* is what the organizer actually receives. All three amounts are whole cents in the batch's `currency`, so 12,500.00 euros is `1250000`.","The database checks the sum: `net_cents` must equal `gross_cents − fee_cents`, or the row is refused."],"columns":{"gross_cents":{"means":"The succeeded payments swept into the batch, added up.","examples":[["1312500","13,125.00 euros"]]},"fee_cents":{"means":"The platform's fees on those same payments, added up.","examples":[["62500","625.00 euros"]]},"net_cents":{"means":"What was actually sent to the organizer.","examples":[["1250000","1312500 − 62500"]]},"currency":{"means":"The three-letter currency code (ISO 4217) the amounts are in. An organization's payouts are made in its `payout_currency` on [[organizations]], even when its events sell in another.","examples":{"EUR":"euros","GBP":"pounds sterling","USD":"US dollars"}}},"table":{"head":["Column","Value","Why"],"rows":[["gross_cents","1312500","Organization 12's succeeded payments for 16–22 November, order 88120's 12600 among them"],["fee_cents","62500","The platform's fees on those payments, order 88120's 600 among them"],["net_cents","1250000","1312500 − 62500: the database checks this"]],"prose":[2]}},{"name":"Where the transfer is","text":"`status` follows the transfer from the batch being opened to the bank confirming it.","columns":{"status":{"means":"Where the transfer stands. A new batch starts as `open`, the column's default.","examples":{"open":"Opened by the weekly payout sweep; not handed to the bank yet.","sent":"Handed to the bank.","paid":"The bank confirmed the transfer.","failed":"The transfer did not go through."}},"sent_at":{"means":"When the batch was handed to the bank. Empty while it is still `open`.","examples":["2026-11-23 10:00:00+00"]},"created_at":{"means":"When the batch was opened.","examples":["2026-11-23 03:00:02+00"]}}}],"records":[{"name":"Paid out","text":"Organization 12's takings for 16–22 November, including Priya's order 88120. The bank has confirmed the transfer.","values":{"id":418,"organization_id":12,"period_start":"2026-11-16","period_end":"2026-11-22","gross_cents":1312500,"fee_cents":62500,"net_cents":1250000,"currency":"EUR","status":"paid","sent_at":"2026-11-23 10:00:00+00","created_at":"2026-11-23 03:00:02+00"}},{"name":"Sent, not yet confirmed","text":"An organizer paid out in pounds. The batch is with the bank, which hasn't confirmed it yet.","values":{"id":419,"organization_id":27,"period_start":"2026-11-16","period_end":"2026-11-22","gross_cents":486000,"fee_cents":19440,"net_cents":466560,"currency":"GBP","status":"sent","sent_at":"2026-11-24 10:05:00+00","created_at":"2026-11-23 03:00:01+00"}},{"name":"Still open","text":"Opened by the sweep but not handed to the bank yet, so `sent_at` is empty.","values":{"id":420,"organization_id":31,"period_start":"2026-11-16","period_end":"2026-11-22","gross_cents":98700,"fee_cents":4935,"net_cents":93765,"currency":"USD","status":"open","sent_at":null,"created_at":"2026-11-23 03:00:04+00"}}],"scenarios":[{"title":"A week's takings are paid out","text":["The weekly payout sweep opens batch 418 for organization 12, for 16–22 November, and sets `payout_batch_id` on that period's succeeded [[payments]], order 88120's among them.","The batch is handed to the bank and becomes `sent`. Once the bank confirms the transfer, it is `paid`."],"steps":["open","sent","paid"],"values":{"status":"paid","gross_cents":1312500,"fee_cents":62500,"net_cents":1250000,"sent_at":"2026-11-23 10:00:00+00"}}]}},"refunds":{"purpose":"One row per amount sent back to a buyer.","columns":{"order_id":"Carried so refunds can be totalled per order without joining `payments`","requested_by":"The staff member who asked for it. NULL for an automatic refund after a cancellation","amount_cents":"May be less than the payment: partial refunds are normal","reason":"Why the money went back"},"notes":["Several partial refunds against one payment are allowed. The application keeps their sum within the payment."],"examples":{"intro":"A refund is money sent back to a buyer, against one payment. Refunds can be partial, and one payment can have several of them.","groups":[{"name":"What the money goes back against","text":"Each refund points at the [[payments]] row whose money it returns, and at that payment's order as well.","columns":{"id":{"means":"The internal number, for joins only. It is never sent to a client.","examples":["2207"]},"payment_id":{"means":"The payment whose money goes back. If that payment row were deleted its refunds would go with it, but payments are never deleted.","examples":[["61877","the PayPal payment for order 88120"]]},"order_id":{"means":"The order the payment was for. It repeats what `payment_id` already leads to, so refunds can be totalled per order without joining [[payments]]. An order can't be deleted while a refund points at it.","examples":[["88120","Priya's order"]]}}},{"name":"Who asked, and why","text":"`requested_by` says which staff member asked for the refund; `reason` says why the money went back.","columns":{"requested_by":{"means":"The staff member who asked for the refund, a row in [[users]]. NULL for an automatic refund after a cancellation. If that person's account row is deleted, this is cleared and the refund stays.","examples":[["1043","a staff member of organization 12"],["NULL","written by the cancellation job"]]},"reason":{"means":"Why the money went back.","examples":{"requested_by_buyer":"The buyer asked for their money back.","event_cancelled":"The event was cancelled. Written by the cancellation job, not by a person, so `requested_by` is NULL.","fraud":"A fraud case. Besides sending the money back, this closes the order and voids its tickets in [[attendees]], and a void ticket is refused at the door."}}}},{"name":"How much","text":"Whole cents, so 30.00 is stored as `3000`. The row has no `currency` column; the payment it points at has one.","columns":{"amount_cents":{"means":"How much goes back. It may be less than the payment: partial refunds are normal. The database refuses `0` or less.","examples":[["3000","one 30.00 ticket out of the 126.00 paid for order 88120"],["5250","the whole 52.50 of a payment"]]}},"scenarios":[{"title":"A second ticket goes back","text":["Suppose Priya later returns a second ticket. That is a second refund row against the same payment, with its own amount.","The database only checks that each amount is above zero. Keeping the refunds' sum within the payment is the application's job: here 3000 + 3000, well inside 12600."],"values":{"payment_id":61877,"order_id":88120,"amount_cents":3000,"reason":"requested_by_buyer"}}]},{"name":"Where it stands","text":"A new refund starts as `pending`, the column's default.","columns":{"status":{"means":"Whether the money has gone back yet.","examples":{"pending":"Asked for; not settled yet.","succeeded":"The money has gone back.","failed":"The refund did not go through."}},"created_at":{"means":"When the refund was recorded.","examples":["2026-11-24 11:28:10+00"]},"settled_at":{"means":"When the refund was settled. Empty while it is still `pending`.","examples":["2026-11-24 11:30:41+00"]}}}],"records":[{"name":"A partial refund a buyer asked for","text":"Priya returns one of her four 30.00 tickets on order 88120. Staff member 1043 asked for the refund, and the money has gone back.","values":{"id":2207,"payment_id":61877,"order_id":88120,"requested_by":1043,"amount_cents":3000,"reason":"requested_by_buyer","status":"succeeded","created_at":"2026-11-24 11:28:10+00","settled_at":"2026-11-24 11:30:41+00"}},{"name":"After a cancellation","text":"Event 3112 has just been cancelled. The cancellation job wrote this refund, so nobody is named in `requested_by`, and it hasn't settled yet.","values":{"id":2231,"payment_id":60512,"order_id":89950,"requested_by":null,"amount_cents":5250,"reason":"event_cancelled","status":"pending","created_at":"2026-11-28 08:00:12+00","settled_at":null}},{"name":"A fraud case","text":"Order 90290 turned out to be fraudulent. The refund sends the money back, and because the reason is `fraud`, the order is closed and its tickets are voided too.","values":{"id":2219,"payment_id":62017,"order_id":90290,"requested_by":1043,"amount_cents":10500,"reason":"fraud","status":"succeeded","created_at":"2026-11-26 14:05:33+00","settled_at":"2026-11-26 14:06:02+00"}}],"scenarios":[{"title":"Some of the money goes back","text":"Priya returns one of her four tickets. A staff member asks for a refund of that ticket's 30.00 against her payment, and the order moves from `paid` to `partially_refunded`.","steps":["pending","succeeded"],"values":{"order_id":88120,"requested_by":1043,"amount_cents":3000,"status":"succeeded"}},{"title":"An event is cancelled","text":["The organizer cancels event 3112. Refunds are queued from the event's cancellation, and the cancellation job writes them.","No staff member asked, so `requested_by` is NULL and `reason` is `event_cancelled`."],"values":{"order_id":89950,"requested_by":null,"reason":"event_cancelled","status":"pending"}}]}},"seating_zones":{"purpose":"One row per named part of a venue, such as a stand or a tier.","columns":{"capacity":"Seats in this zone. The sum across zones may be below the venue's own `capacity`","position":"Display order; the application renumbers from 0 on every save"},"notes":["Deleting a zone leaves its ticket types and sessions in place with an empty zone."],"examples":{"intro":"A seating zone is a named part of one venue, such as a stand, a tier or a balcony. Reserved ticket types point at a zone, and so does a session that only uses part of the room.","groups":[{"name":"Which zone, in which venue","text":"A zone belongs to one venue, and its name is unique inside that venue.","columns":{"id":{"means":"The internal number. [[ticket_types]] and [[event_sessions]] point at it.","examples":["211"]},"venue_id":{"means":"The venue this zone is part of. Deleting the venue deletes its zones with it.","examples":[["140","Harbour Hall"],["141","Lakeside Pavilion"]]},"name":{"means":"What the zone is called. Harbour Hall can have only one zone called Balcony; another venue can have a Balcony of its own.","examples":["Floor","Balcony","Terrace"]},"created_at":{"means":"When the zone was first saved.","examples":["2026-03-04 10:18:40+00"]}}},{"name":"Size and order","text":["`capacity` is how many people the zone holds. A venue's zones don't have to add up to the venue's own `capacity` on [[venues]]: the sum may be below it.","At Harbour Hall the two zones hold 1100 together, while the venue as a whole holds 1200."],"columns":{"capacity":{"means":"How many people this zone holds. Always at least 1: the database refuses `0` or less.","examples":[["800","the Floor at Harbour Hall"],["300","its Balcony"]]},"position":{"means":"Where the zone comes in its venue's list of zones. Lower numbers come first, starting at `0`. The application renumbers a venue's zones from 0 on every save, in one statement, so after a save they always run 0, 1, 2…","examples":[["0","first in the list"],["1","second"]]}},"table":{"head":["Zone","capacity","position"],"rows":[["Floor","800","0"],["Balcony","300","1"],["Harbour Hall as a whole (`capacity` on [[venues]])","1200",""]],"prose":[0]}}],"records":[{"name":"The main floor","text":"First in Harbour Hall's list, so `position` is `0`.","values":{"id":210,"venue_id":140,"name":"Floor","capacity":800,"position":0,"created_at":"2026-03-04 10:18:40+00"}},{"name":"The balcony","text":"Second at Harbour Hall. The reserved *Balcony seat* tickets for Winter Jazz Night point here in [[ticket_types]], and so does the Sunday morning session of Family Puppet Weekend in [[event_sessions]].","values":{"id":211,"venue_id":140,"name":"Balcony","capacity":300,"position":1,"created_at":"2026-03-04 10:19:02+00"}},{"name":"A zone at another venue","text":"Lakeside Pavilion's first zone. `position` starts again at `0`, because each venue keeps its own order.","values":{"id":230,"venue_id":141,"name":"Hall","capacity":300,"position":0,"created_at":"2026-05-18 08:44:30+00"}}],"scenarios":[{"title":"A zone is deleted","text":["Harbour Hall removes its Balcony zone.","The ticket types and sessions that pointed at it stay, with `seating_zone_id` cleared. The *Balcony seat* ticket type keeps its row; only its link to the zone goes."]},{"title":"The zones are put in a new order","text":"Balcony is moved to the top of Harbour Hall's list and the list is saved. The application renumbers every zone of the venue from 0 in one statement: Balcony becomes `0` and Floor `1`.","values":{"name":"Balcony","position":0}},{"title":"The venue is deleted","text":"Deleting Harbour Hall would delete both of its zones with it. While any event still points at the venue, though, the venue can't be deleted, so its zones stay too."}]}},"ticket_types":{"purpose":"One row per thing a buyer can put in a basket.","columns":{"seating_zone_id":"Set for `reserved` types. Cleared if the zone is deleted","kind":"Decides whether a seat label is assigned and whether money is taken","price_cents":"`0` for `comp` tickets, which still create attendees","quantity_total":"How many may ever be sold, including the ones already sold","quantity_sold":"Raised inside the checkout transaction; the database refuses to let it pass `quantity_total`","max_per_order":"Per-basket cap shown on the ticket page","sales_start_at":"NULL means on sale as soon as the event is published","sales_end_at":"NULL means on sale until the event starts","position":"Display order on the ticket page; renumbered from 0 on every save"},"badges":["public_id","stored counts","ordered"],"notes":["Price and name can change. Sold orders keep their own copy, so changing them never moves a past total."],"examples":{"intro":"A ticket type is one thing a buyer can put in a basket: a name, a price and how many there are, such as *General admission* or *Balcony seat*. An event can have several, listed on its ticket page in `position` order.","groups":[{"name":"Which ticket type","text":"A ticket type belongs to one event, and its name is unique inside that event.","columns":{"id":{"means":"The internal number. [[order_lines]], [[attendees]] and [[waitlist_entries]] point at it. It is never sent to a client.","examples":["7101"]},"public_id":{"means":"The type's id outside the server, wherever a client names it. Random, so nobody can guess or count ids from a URL.","examples":["3d5b8e21-0f6c-4a97-b2d4-8e1f7a60c935"]},"event_id":{"means":"The event it sells tickets for. Deleting the event deletes its ticket types, but an event with orders can't be deleted.","examples":[["3051","Winter Jazz Night"]]},"created_at":{"means":"When the type was first saved.","examples":["2026-09-20 14:20:31+00"]}}},{"name":"What the buyer picks","text":"`kind` decides whether each ticket gets a seat label and whether money is taken. `position` sets the order on the ticket page.","columns":{"name":{"means":"What the buyer sees in the list. It can be changed later.","examples":["General admission","Balcony seat","Guest list"]},"kind":{"means":"What sort of ticket it is. It decides whether a seat label is assigned and whether money is taken.","examples":{"general":"General admission: no seat is assigned, so the tickets have no seat label.","reserved":"A seat in a particular zone: `seating_zone_id` points at the zone, and each ticket in [[attendees]] gets a seat label.","vip":"A VIP ticket. Like `general`, it gets no seat label: only `reserved` tickets have one.","comp":"Short for *complimentary*: a free ticket. `price_cents` is `0`, but each one still creates an [[attendees]] row, like a paid ticket."}},"seating_zone_id":{"means":"The [[seating_zones]] row these seats are in. Set for `reserved` types, empty for the others. Cleared if the zone is deleted, so a `reserved` type can end up with no zone.","examples":[["211","the Balcony at Harbour Hall"],["NULL","not a reserved type"]]},"position":{"means":"Where the type comes on the ticket page. Lower numbers come first, starting at `0`. The application renumbers an event's types from 0 on every save.","examples":[["0","top of the list"],["3","fourth"]]}}},{"name":"The price","text":"Whole cents in the row's own `currency`, so 25.00 euros is stored as `2500`. Like all money in this database: no floats, and the currency is always on the same row, never assumed.","columns":{"price_cents":{"means":"The price of one ticket, in cents. Never negative; `0` for `comp` tickets. Orders already sold keep their own copy in [[order_lines]] (`unit_price_cents`), so changing it never moves a past total.","examples":[["2500","25.00"],["9500","95.00"],["0","a free `comp` ticket"]]},"currency":{"means":"The three-letter currency code (ISO 4217) the price is in. It can differ from the organization's `payout_currency`: an event may sell in one currency and be paid out in another.","examples":{"EUR":"euros","GBP":"pounds sterling","USD":"US dollars"}}},"scenarios":[{"title":"The price goes up","text":"General admission goes from 25.00 to 30.00. Amira's paid order keeps 25.00 on its [[order_lines]] row, so her total doesn't move.","values":{"name":"General admission","price_cents":3000}}]},{"name":"How many can be sold","text":["`quantity_total` is the whole stock and `quantity_sold` is how much of it is taken. The database refuses a row where `quantity_sold` is below 0 or above `quantity_total`, and the ticket page lists as buyable only the types with some left.","`quantity_sold` is a *stored count*: a running total kept on the row so the ticket page doesn't count orders on every view. The checkout transaction moves it, and a nightly job recounts it from the orders and corrects any drift."],"columns":{"quantity_total":{"means":"How many may ever be sold, including the ones already sold.","examples":["600","50"]},"quantity_sold":{"means":"How many are taken. Raised inside the checkout transaction. Tickets held in an unpaid basket count too: when the basket sweeper closes an expired basket, it lowers this by what the basket held.","examples":[["412","of 600"],["50","of 50: none left"]]},"max_per_order":{"means":"The most of this type one basket may hold, shown on the ticket page. At least 1, and `10` unless set otherwise.","examples":[["10","the default"],["4","a smaller cap"]]}},"table":{"head":["Ticket type","quantity_total","quantity_sold","Left"],"rows":[["General admission","600","412","188"],["Balcony seat","300","158","142"],["VIP lounge","50","50","0: full"],["Guest list","40","12","28"]],"prose":[0]},"scenarios":[{"title":"Two buyers want the last VIP ticket","text":"VIP lounge has 49 of 50 sold, and two buyers check out at the same moment. Each checkout raises `quantity_sold` inside its transaction, but the database won't let it pass `quantity_total`, so whichever comes second is refused.","values":{"quantity_total":50,"quantity_sold":50}}]},{"name":"When it is on sale","text":"Two optional dates. Left empty, a type is on sale from the moment the event is published until the event starts.","columns":{"sales_start_at":{"means":"When this type goes on sale. NULL means as soon as the event is published.","examples":[["2026-10-08 09:00:00+00","a week after the event was published"],["NULL","from publishing"]]},"sales_end_at":{"means":"When this type stops selling. NULL means on sale until the event starts.","examples":[["2026-12-12 17:00:00+00","an hour before the doors open"],["NULL","until the event starts"]]}}}],"records":[{"name":"General admission","text":"Unreserved tickets at 25.00 EUR, the ones in Amira's order in [[orders]]. Both sales dates are empty, so it sells from publishing until the event starts.","values":{"id":7101,"public_id":"3d5b8e21-0f6c-4a97-b2d4-8e1f7a60c935","event_id":3051,"seating_zone_id":null,"name":"General admission","kind":"general","price_cents":2500,"currency":"EUR","quantity_total":600,"quantity_sold":412,"max_per_order":10,"sales_start_at":null,"sales_end_at":null,"position":0,"created_at":"2026-09-20 14:20:31+00"}},{"name":"A reserved seat","text":"Seats in Harbour Hall's Balcony zone, so each ticket gets a seat label. It went on sale a week after the event was published and stops an hour before the doors open.","values":{"id":7102,"public_id":"9a41c7e3-2b58-4d06-a1f9-5c7e0d83b214","event_id":3051,"seating_zone_id":211,"name":"Balcony seat","kind":"reserved","price_cents":4000,"currency":"EUR","quantity_total":300,"quantity_sold":158,"max_per_order":6,"sales_start_at":"2026-10-08 09:00:00+00","sales_end_at":"2026-12-12 17:00:00+00","position":1,"created_at":"2026-09-20 14:24:02+00"}},{"name":"A full type","text":"`quantity_sold` has reached `quantity_total`, so it is no longer listed as buyable. The event stays `on_sale`: it only becomes `sold_out` when its last ticket type fills.","values":{"id":7103,"public_id":"c06e2f94-7d13-48ba-9e52-1b8a4f6d0c77","event_id":3051,"seating_zone_id":null,"name":"VIP lounge","kind":"vip","price_cents":9500,"currency":"EUR","quantity_total":50,"quantity_sold":50,"max_per_order":4,"sales_start_at":null,"sales_end_at":null,"position":2,"created_at":"2026-09-20 14:27:45+00"}},{"name":"Free guest tickets","text":"A `comp` type: the price is `0` and no money is taken, but every ticket still becomes an [[attendees]] row with its own barcode.","values":{"id":7104,"public_id":"51f8b0d2-e6a7-4c39-8d14-0f2b9c7a5e63","event_id":3051,"seating_zone_id":null,"name":"Guest list","kind":"comp","price_cents":0,"currency":"EUR","quantity_total":40,"quantity_sold":12,"max_per_order":4,"sales_start_at":null,"sales_end_at":null,"position":3,"created_at":"2026-10-02 11:03:19+00"}}],"scenarios":[{"title":"A basket is abandoned","text":["Sam puts three General admission tickets in a basket and leaves. The basket is already a real [[orders]] row, and its three tickets count in `quantity_sold`.","Once the basket's `expires_at` has passed, the hourly basket sweeper closes it and lowers `quantity_sold` by three, so those tickets can be bought again."],"steps":["held in a basket","basket expired","back on sale"],"values":{"name":"General admission","quantity_sold":409}},{"title":"Someone tries to delete a type that has sold","text":["General admission has been bought, so [[order_lines]] and [[attendees]] rows point at it. Those links refuse the delete, and the row stays.","A type nobody has bought can be deleted. A [[waitlist_entries]] row waiting for it just has its `ticket_type_id` cleared."]},{"title":"Its zone is deleted","text":"Harbour Hall removes its Balcony zone. *Balcony seat* stays, still `reserved`, with `seating_zone_id` cleared.","values":{"name":"Balcony seat","kind":"reserved","seating_zone_id":null}}]}},"user_devices":{"purpose":"One row per phone or browser signed in for push messages.","columns":{"platform":"Which push service the token belongs to","push_token":"The provider's token. Unique across the platform, because the provider reissues it","label":"Device name the person can recognise in their settings","last_seen_at":"Last time the app opened. Tokens unused for 90 days are deleted"},"examples":{"intro":"One row is one phone or browser where a person has signed in for push messages: the alerts that pop up on a phone's screen or from a browser. One person can have several.","groups":[{"name":"Whose device","columns":{"id":{"means":"The internal number.","examples":["7710"]},"user_id":{"means":"The person the device belongs to, in [[users]]. If their account is deleted for real, the device goes with it.","examples":["5521"]},"label":{"means":"A device name the person can recognise in their settings. It can be empty.","examples":["Jonas's iPhone","Mei's old phone"]}}},{"name":"Where push messages go","text":"Each platform has its own push service. The *push token* is what that service hands out for one device: a message sent to the token reaches that phone or browser.","columns":{"platform":{"means":"Which push service the token belongs to.","examples":{"ios":"An iPhone or iPad. The token is for Apple's push service.","android":"An Android phone or tablet. The token is for Google's push service.","web":"A web browser. The token is for that browser's push service."}},"push_token":{"means":"The provider's token for this device. It is unique across the whole platform, because the provider reissues it: the same token can never sit on two rows.","examples":[["fcm:dGhpc2lzZmFrZQ…","an Android token, made up and shortened"]]}}},{"name":"How recently it was used","text":"Devices nobody uses are cleaned up: the nightly purge deletes tokens unused for 90 days.","columns":{"last_seen_at":{"means":"The last time the app opened on this device. When that is more than 90 days ago, the nightly purge deletes the row.","examples":["2026-11-27 18:24:51+00"]},"created_at":{"means":"When the device's row was made.","examples":["2026-05-14 19:22:07+00"]}},"scenarios":[{"title":"A phone is put away","text":"Mei stops using her old Android phone, so its `last_seen_at` stops moving. Once 90 days have passed with no use, the nightly purge deletes the row.","steps":["in use","unused for 90 days","deleted by the nightly purge"],"values":{"id":6604,"last_seen_at":"2026-09-02 07:48:15+00"}}]}],"records":[{"name":"A phone in daily use","text":"Jonas's iPhone, last opened on the evening of 27 November.","values":{"id":7710,"user_id":5521,"platform":"ios","push_token":"apns:ZmFrZS1pb3MtdG9rZW4…","label":"Jonas's iPhone","last_seen_at":"2026-11-27 18:24:51+00","created_at":"2026-05-14 19:22:07+00"}},{"name":"A browser with no label","text":"Mei also gets push messages in a web browser. No device name was given for it, so `label` is empty.","values":{"id":8031,"user_id":5104,"platform":"web","push_token":"webpush:ZmFrZS13ZWItdG9rZW4…","label":null,"last_seen_at":"2026-11-28 08:12:40+00","created_at":"2026-10-01 09:15:00+00"}},{"name":"An old phone about to go","text":"Not opened since 2 September. If it stays unused, the nightly purge deletes it once 90 days have passed, at the start of December.","values":{"id":6604,"user_id":5104,"platform":"android","push_t
