oken":"fcm:dGhpc2lzZmFrZQ…","label":"Mei's old phone","last_seen_at":"2026-09-02 07:48:15+00","created_at":"2025-02-03 09:50:30+00"}}],"scenarios":[{"title":"The person's account is deleted","text":"When Mei's [[users]] row is removed for real, both of her devices go with it: the browser and the old phone."}]}},"users":{"purpose":"One row per person with a sign-in, whether buyer or organizer.","columns":{"email":"Unique case-insensitively, through a unique index on `lower(email)`","locale":"Which language messages are sent in","password_set_at":"NULL for an account that has only ever used a magic link","deleted_at":"Hides the account. Orders and tickets stay, with the link cleared"},"notes":["Most buyers never have a row here: guest checkout only stores `orders.buyer_email`."],"examples":{"intro":"One row is one person who can sign in, whether they buy tickets or run an organization. Most buyers never get a row here: a guest checkout only keeps the email on the order.","groups":[{"name":"Which account","text":"Two ids for the same person: one for the database, one for everyone else.","columns":{"id":{"means":"The internal number. Other tables join on it; it is never sent to a browser or the app.","examples":["5521"]},"public_id":{"means":"The account's id outside the server. Random, so nobody can guess another account's id or count the accounts.","examples":["3b8e61f0-9c2d-4a75-b0e4-6d17f5a29c83"]}}},{"name":"Who they are","text":"The email is the one thing every account must have. The name is optional.","columns":{"email":{"means":"The address the person signs in with. No two accounts can share one, even with different capitals: a unique index on `lower(email)` compares addresses in lower case. The database's only other check is that there is something before the `@`.","examples":["jonas.weber@example.com","mei.tanaka@example.com"]},"full_name":{"means":"The person's name, when one was given. It can be empty.","examples":["Jonas Weber","Mei Tanaka"]},"locale":{"means":"Which language messages to this person are sent in, as a short language code. English (`en`) is the default.","examples":{"en":"English, the default","de":"German","fr":"French"}}},"scenarios":[{"title":"The same address with different capitals","text":"Someone tries to make a second account as `Jonas.Weber@Example.com`. The database refuses it: in lower case, that address already belongs to Jonas.","values":{"id":5521,"email":"jonas.weber@example.com"}}]},{"name":"Signing in","text":"A person can sign in with a *magic link* (a one-time sign-in link) or with a password. Nothing on this row says what they may do for an organization: that is in [[org_members]].","columns":{"password_set_at":{"means":"When a password was set on the account. NULL for an account that has only ever used a magic link.","examples":[["2024-03-18 10:58:02+00","has a password"],["NULL","magic links only"]]},"last_seen_at":{"means":"When the person was last active. Support and the activity report use it to list recently active accounts.","examples":["2026-11-27 18:25:00+00"]}}},{"name":"Created and deleted","text":"Accounts are soft-deleted: deleting one sets `deleted_at` and hides it, and the row itself goes later.","columns":{"created_at":{"means":"When the account was made.","examples":["2026-05-14 19:20:33+00"]},"deleted_at":{"means":"When the account was deleted. Setting it hides the account at once (a *soft delete*). The nightly purge job removes the row for good once it has been deleted for more than 30 days.","examples":[["NULL","a live account"],["2026-11-10 13:05:00+00","hidden since then"]]}}}],"records":[{"name":"A buyer who uses magic links","text":"Jonas buys tickets with his account and has never set a password, so `password_set_at` is empty. The basket in progress on the [[orders]] tab is his.","values":{"id":5521,"public_id":"3b8e61f0-9c2d-4a75-b0e4-6d17f5a29c83","email":"jonas.weber@example.com","full_name":"Jonas Weber","locale":"de","password_set_at":null,"last_seen_at":"2026-11-27 18:25:00+00","created_at":"2026-05-14 19:20:33+00","deleted_at":null}},{"name":"An organizer with a password","text":"Mei runs Lakeside Jazz Club. Her role there is a row in [[org_members]], not a column here: the account itself looks just like a buyer's.","values":{"id":5104,"public_id":"e2c94a07-6b1f-4d58-93a6-0f8d27b4e1c5","email":"mei.tanaka@example.com","full_name":"Mei Tanaka","locale":"en","password_set_at":"2024-03-18 10:58:02+00","last_seen_at":"2026-11-28 08:12:40+00","created_at":"2024-03-18 10:55:10+00","deleted_at":null}},{"name":"A deleted account","text":"Hidden since 10 November, but the row is still here, and everything that points at it still does. The nightly purge removes it once more than 30 days have passed.","values":{"id":4977,"public_id":"71d0b3e8-4f95-4c2a-8e6b-b5a9c03f17d2","email":"noor.haddad@example.com","full_name":"Noor Haddad","locale":"fr","password_set_at":"2025-09-12 17:31:44+00","last_seen_at":"2026-10-30 21:04:18+00","created_at":"2025-09-12 17:30:05+00","deleted_at":"2026-11-10 13:05:00+00"}}],"scenarios":[{"title":"An account is deleted","text":["Noor's account is deleted. `deleted_at` is set and the account is hidden straight away; nothing else changes yet.","Once it has been deleted for more than 30 days, the nightly purge removes the row. Her orders stay, with their lines, tickets and payments, and only `user_id` is cleared; the buyer's email stays on each order. Her memberships in [[org_members]], her devices in [[user_devices]] and her [[notifications]] go with the row. Other rows that name her, such as [[audit_log]] entries or door scans in [[check_ins]], stay with the link cleared."],"steps":["live","hidden: `deleted_at` set","removed by the nightly purge"],"values":{"id":4977,"deleted_at":"2026-11-10 13:05:00+00"}},{"title":"A magic-link account gets a password","text":"Jonas has only ever signed in with magic links, so `password_set_at` is empty. Once he sets a password, it holds the moment he did.","values":{"id":5521,"password_set_at":"2026-11-28 09:14:30+00"}}]}},"venues":{"purpose":"One row per place an organization puts events on.","columns":{"country_code":"ISO 3166-1 alpha-2, upper case","timezone":"IANA name, used to show times for events held here","capacity":"Whole-venue limit. NULL when nobody has filled it in","latitude":"Set by geocoding the address, not typed in","longitude":"Set by geocoding the address, not typed in"},"notes":["A venue can't be deleted while an event still points at it."],"examples":{"intro":"A venue is a place where an organization puts on events: a hall, a club, a theatre. It belongs to one organization, and its [[seating_zones]] split the room into named parts.","groups":[{"name":"Which venue, and whose","text":"A venue belongs to one organization, and its name is unique inside that organization.","columns":{"id":{"means":"The internal number. [[events]] and [[seating_zones]] point at it. Like every `id` in this database, it is for joins only and never sent to a client.","examples":["140"]},"organization_id":{"means":"The organization that owns the venue. Deleting the organization deletes its venues, and their seating zones, with it.","examples":["12"]},"name":{"means":"What the venue is called. One organization can't have two venues with the same name; two different organizations can.","examples":["Harbour Hall","Lakeside Pavilion"]},"created_at":{"means":"When the venue was first saved.","examples":["2026-03-04 10:15:22+00"]}}},{"name":"Where it is","text":["The street and city are optional; the country is not.","The coordinates are never typed in. They come from *geocoding* the address: looking up where that address is on a map."],"columns":{"address_line1":{"means":"The street address, when one was given. It can be empty.","examples":["Kadeweg 12","Avenida do Rio 8"]},"city":{"means":"The town or city, when one was given.","examples":["Rotterdam","Lisbon"]},"country_code":{"means":"The country, as a two-letter code from the ISO 3166-1 standard, always in capitals. Required, even when there is no address.","examples":{"NL":"the Netherlands","PT":"Portugal","GB":"the United Kingdom: the standard says `GB`, not `UK`"}},"latitude":{"means":"How far north (positive) or south (negative) of the equator the venue is, in degrees. The type `numeric(9,6)` is an exact decimal with up to 9 digits, 6 of them after the point, which pins a spot to about 10 cm. Set by geocoding the address, not typed in.","examples":[["51.905310","Harbour Hall, Rotterdam"],["38.707750","Lakeside Pavilion, Lisbon"]]},"longitude":{"means":"How far east (positive) or west (negative) of Greenwich the venue is, in degrees, in the same `numeric(9,6)` form. Also set by geocoding the address.","examples":[["4.466820","Rotterdam, east of Greenwich"],["-9.136590","Lisbon, west of Greenwich"]]}},"table":{"head":["Venue","latitude","longitude","Where that is"],"rows":[["Harbour Hall","51.905310","4.466820","North of the equator, east of Greenwich"],["Lakeside Pavilion","38.707750","-9.136590","North of the equator, west of Greenwich"],["Pop-up space","NULL","NULL","No address yet, so nothing has been geocoded"]],"prose":[0,3]}},{"name":"Running events there","text":"How times are shown for the events held here, and how many people the whole place holds.","columns":{"timezone":{"means":"The venue's time zone, used to show times for events held here. It is a name from the *IANA time zone database*, the list every operating system and programming language uses, written `Region/City`. A name, not a fixed offset like `+01:00`, because the name also knows when summer time starts and ends.","examples":{"Europe/Amsterdam":"UTC+1 in winter, UTC+2 in summer","Europe/Lisbon":"UTC+0 in winter, UTC+1 in summer","America/New_York":"UTC−5 in winter, UTC−4 in summer"}},"capacity":{"means":"How many people the whole venue holds. NULL when nobody has filled it in; when it is set, it is at least 1. The venue's [[seating_zones]] have capacities of their own, and those may add up to less than this.","examples":[["1200","Harbour Hall"],["NULL","not filled in"]]}}}],"records":[{"name":"Everything filled in","text":"Harbour Hall has an address, coordinates and a capacity. Its two zones, Floor and Balcony, are rows in [[seating_zones]].","values":{"id":140,"organization_id":12,"name":"Harbour Hall","address_line1":"Kadeweg 12","city":"Rotterdam","country_code":"NL","timezone":"Europe/Amsterdam","capacity":1200,"latitude":"51.905310","longitude":"4.466820","created_at":"2026-03-04 10:15:22+00"}},{"name":"A venue abroad","text":"The same organization, another country. Times for events here are shown in Lisbon time, and the longitude is negative because Lisbon is west of Greenwich.","values":{"id":141,"organization_id":12,"name":"Lakeside Pavilion","address_line1":"Avenida do Rio 8","city":"Lisbon","country_code":"PT","timezone":"Europe/Lisbon","capacity":450,"latitude":"38.707750","longitude":"-9.136590","created_at":"2026-05-18 08:40:03+00"}},{"name":"Only what is required","text":"Saved with just a name, a country and a time zone. There is no address, so no coordinates either, and nobody has filled in the capacity.","values":{"id":142,"organization_id":12,"name":"Pop-up space","address_line1":null,"city":null,"country_code":"NL","timezone":"Europe/Amsterdam","capacity":null,"latitude":null,"longitude":null,"created_at":"2026-11-03 13:27:51+00"}}],"scenarios":[{"title":"Someone tries to delete a venue that still has events","text":["Lakeside Pavilion hosted Lakeside Acoustic Night, which was cancelled. Cancelling keeps the event's row, and its `venue_id` on [[events]] still points here.","That link refuses the delete, so the venue stays for as long as any event, cancelled or not, points at it."]},{"title":"A venue no event uses is deleted","text":"No event points at Pop-up space, so nothing refuses the delete. The row goes, and any [[seating_zones]] it had go with it."},{"title":"The organization is deleted","text":"Deleting an organization deletes its venues and their seating zones. It is refused, though, while the organization still has events, orders, payments or payout batches, and in practice organizations are soft-deleted instead."}]}},"waitlist_entries":{"purpose":"One row per person waiting for a ticket that is sold out.","columns":{"ticket_type_id":"NULL to wait for any ticket type, or cleared when that type is deleted","user_id":"NULL when someone joined the waitlist without signing in","email":"One entry per email per event","status":"`offered` holds stock until `expires_at` passes","expires_at":"When an offer lapses and the stock goes to the next person"},"notes":["The release job walks `status = 'waiting'` in `created_at` order, oldest first."],"examples":{"intro":"A waitlist entry is one person queuing for tickets that are sold out. When stock comes free, the oldest waiting entry gets an offer, which holds the stock until it expires.","groups":[{"name":"Who is waiting, and for what","text":"One entry per email per event: the same address can't queue twice for the same event.","columns":{"id":{"means":"The internal number of the entry.","examples":["7012"]},"event_id":{"means":"The event they are waiting for. Deleting the event deletes its waitlist.","examples":["3064"]},"ticket_type_id":{"means":"The ticket type they want, from [[ticket_types]]. NULL means any ticket type will do; it is also cleared if that type is deleted.","examples":[["6240","Standing, at event 3064"],["NULL","any ticket type"]]},"user_id":{"means":"The signed-in person, when there is one. NULL when someone joined without signing in, and cleared if their account is deleted.","examples":[["5630","joined while signed in"],["NULL","joined without signing in"]]},"email":{"means":"The person's email. Required even when `user_id` is set, and unique per event.","examples":["chen.wu@example.com","maria.s@example.com"]},"quantity_wanted":{"means":"How many tickets they want, from 1 to 10; the database checks the range. It is 1 unless they ask for more.","examples":["1","2","4"]}},"scenarios":[{"title":"The same email joins twice","text":"Chen is already on the waitlist for event 3064 and tries to join it again with the same email. The second entry is refused."}]},{"name":"Where it is in the queue","text":["The waitlist release job runs every five minutes. When stock comes free, it offers it to the oldest `waiting` entry for the event, oldest by `created_at`, and queues a notification.","An offer holds the stock until `expires_at`. If it isn't taken by then, the entry becomes `expired` and the stock moves to the next `waiting` entry. The table shows the queue for event 3064, oldest first."],"columns":{"status":{"means":"Where the entry is right now.","examples":{"waiting":"In the queue. Every entry starts here.","offered":"Freed stock is being held for this person until `expires_at`.","converted":"The offer was taken.","expired":"The offer wasn't taken before `expires_at`; the stock moved on to the next person."}},"offered_at":{"means":"When the release job made the offer. Empty while the entry is still `waiting`.","examples":["2026-11-28 09:05:00+00","NULL"]},"expires_at":{"means":"When the offer lapses and the stock goes to the next person. Set with the offer, so empty while the entry is still `waiting`.","examples":["2026-11-28 21:05:00+00","NULL"]},"created_at":{"means":"When the person joined. The release job serves entries oldest first by this time.","examples":["2026-11-21 08:30:12+00"]}},"table":{"head":["created_at","email","status","What it means"],"rows":[["2026-11-21 08:30","tom.b@example.com","expired","Had an offer and let it lapse"],["2026-11-22 12:10","maria.s@example.com","converted","Had an offer and took it"],["2026-11-23 18:45","ines.r@example.com","offered","Stock is held for her now"],["2026-11-27 20:14","chen.wu@example.com","waiting","Next in line when more stock comes free"]],"prose":[3]}}],"records":[{"name":"Waiting in the queue","text":"Chen joined without signing in and wants two Standing tickets. Nothing has been offered yet, so both offer times are empty.","values":{"id":7012,"event_id":3064,"ticket_type_id":6240,"user_id":null,"email":"chen.wu@example.com","quantity_wanted":2,"status":"waiting","offered_at":null,"expires_at":null,"created_at":"2026-11-27 20:14:09+00"}},{"name":"An open offer","text":"Stock came free while Ines was the oldest `waiting` entry. It is held for her until `expires_at`.","values":{"id":6998,"event_id":3064,"ticket_type_id":6240,"user_id":5702,"email":"ines.r@example.com","quantity_wanted":2,"status":"offered","offered_at":"2026-11-28 09:05:00+00","expires_at":"2026-11-28 21:05:00+00","created_at":"2026-11-23 18:45:31+00"}},{"name":"An offer that was taken","text":"Maria would take any ticket type, so `ticket_type_id` is empty. She took her offer before it lapsed.","values":{"id":6990,"event_id":3064,"ticket_type_id":null,"user_id":5630,"email":"maria.s@example.com","quantity_wanted":1,"status":"converted","offered_at":"2026-11-25 22:05:00+00","expires_at":"2026-11-26 10:05:00+00","created_at":"2026-11-22 12:10:47+00"}},{"name":"An offer that lapsed","text":"Tom didn't take his offer before `expires_at`. The entry is `expired`, and the stock moved on to the next `waiting` entry, Maria's.","values":{"id":6981,"event_id":3064,"ticket_type_id":6240,"user_id":4890,"email":"tom.b@example.com","quantity_wanted":4,"status":"expired","offered_at":"2026-11-25 10:00:00+00","expires_at":"2026-11-25 22:00:00+00","created_at":"2026-11-21 08:30:12+00"}}],"scenarios":[{"title":"Stock comes free and the offer is taken","text":["A refund frees Standing tickets for event 3064. Within five minutes the release job offers them to the oldest `waiting` entry, Ines's, and queues a notification.","Ines takes the offer before it lapses."],"steps":["waiting","offered","converted"],"values":{"status":"converted","offered_at":"2026-11-28 09:05:00+00","expires_at":"2026-11-28 21:05:00+00"}},{"title":"Nobody takes the offer","text":"Tom's offer passes `expires_at` without him taking it. His entry becomes `expired`, and the stock moves to the next `waiting` entry: Maria's.","steps":["waiting","offered","expired"],"values":{"status":"expired"}},{"title":"A signed-in person deletes their account","text":"Maria deletes her account. Her entry stays, with `user_id` cleared; the email is still on it.","values":{"user_id":null,"email":"maria.s@example.com"}}]}},"webhook_deliveries":{"purpose":"One row per webhook the platform tried to deliver to an organizer's endpoint.","columns":{"event_name":"Which platform event this payload describes","target_url":"Copied from the endpoint's settings at send time, so the history stays true","payload":"Exactly what was sent, including the signature header's body","attempt_count":"Retries back off; the sender gives up after 8","response_code":"HTTP status of the last attempt. NULL if the request never completed"},"notes":["Rows older than 30 days are deleted by the nightly job."],"examples":{"intro":"A *webhook* is a web request the platform sends to an organizer's own system to tell it that something happened, such as an order being paid. Each row is one such message, with every attempt to deliver it counted on the same row.","groups":[{"name":"Whose webhook, and when","text":"Rows older than 30 days are deleted by the nightly purge, so this table only holds the last month or so.","columns":{"id":{"means":"The internal number, for joins only.","examples":["330981"]},"organization_id":{"means":"The organizer whose endpoint the webhook was sent to. If the organization row is deleted, its deliveries go with it.","examples":["12"]},"created_at":{"means":"When the delivery was created, before the first attempt.","examples":["2026-11-27 18:02:56+00"]}}},{"name":"What was sent","text":"*Event* here means something that happened on the platform, not a row in [[events]]: an order being paid is an event in this sense too.","columns":{"event_name":{"means":"Which platform event the payload describes.","examples":{"order.paid":"An order was paid.","order.refunded":"Money went back on an order.","event.published":"An event was published.","event.cancelled":"An event was cancelled.","attendee.checked_in":"A ticket was checked in at the door."}},"payload":{"means":"Exactly what was sent, including the signature header's body. A *signature* lets the receiver check that the request really came from the platform. The column is *jsonb*: JSON that PostgreSQL stores already parsed, so it can be searched by key."}}},{"name":"Where it went","columns":{"target_url":{"means":"The organizer's *endpoint*: the web address their system receives webhooks at. Copied from the endpoint's settings at send time, so the history stays true even if the organizer changes the address later.","examples":["https://hooks.example.com/showpass"]}},"scenarios":[{"title":"The organizer changes their endpoint","text":"Organization 12 later moves its endpoint to a new address. Rows already sent keep the address they really went to; only new rows get the new one.","values":{"target_url":"https://hooks.example.com/showpass"}}]},{"name":"Did it get there","text":["A delivery that fails is tried again by the retry worker, waiting longer between tries each time (*backing off*).","The sender gives up after 8 attempts. The retry worker's queue is the `failed` rows with fewer than 8."],"columns":{"status":{"means":"Whether the webhook got through. A new row starts as `pending`, the column's default.","examples":{"pending":"Not delivered yet.","delivered":"It got through.","failed":"The last attempt failed. With fewer than 8 attempts the retry worker tries again; at 8 the sender has given up."}},"attempt_count":{"means":"How many times delivery has been tried. Starts at `0` and can never go below it.","examples":[["0","not tried yet"],["1","tried once"],["8","the sender gives up here"]]},"response_code":{"means":"The *HTTP status code* the endpoint answered the last attempt with: the three-digit number every web server sends back. NULL if the request never completed, for example when the address could not be reached.","examples":[["200","OK: received"],["404","nothing at that address"],["500","the organizer's server hit an error"],["503","the organizer's server was unavailable"],["NULL","no answer came back"]]},"last_attempt_at":{"means":"When delivery was last tried. Empty until the first attempt. The retry worker goes by this time.","examples":["2026-11-27 18:02:57+00"]}},"table":{"head":["status","attempt_count","What it means"],"rows":[["pending","0","Not tried yet"],["delivered","1","Got through on the first try"],["failed","3","Failed so far; still in the retry worker's queue"],["failed","8","The sender has given up"]],"prose":[2]}}],"records":[{"name":"Delivered first time","text":"Organization 12's system hears that Amira's order 90412 was paid. The endpoint answers `200` on the first try.","values":{"id":330981,"organization_id":12,"event_name":"order.paid","target_url":"https://hooks.example.com/showpass","payload":{"event":"order.paid","data":{"id":"6f1c2a9e-4b7d-4e0a-9c3f-2d8e5b1a7c40","total_cents":4725,"currency":"EUR"}},"status":"delivered","attempt_count":1,"response_code":200,"last_attempt_at":"2026-11-27 18:02:57+00","created_at":"2026-11-27 18:02:56+00"}},{"name":"Failing, still retried","text":"Three tries so far, and the last one got `503`: the organizer's server was unavailable. With fewer than 8 attempts, the row is still in the retry worker's queue.","values":{"id":331044,"organization_id":27,"event_name":"event.published","target_url":"https://tickets.example.com/webhooks","payload":{"event":"event.published","data":{"id":"9b2e6f13-4a7c-4d58-b1e0-7f3c5a8d2e96","title":"Winter Jazz Night"}},"status":"failed","attempt_count":3,"response_code":503,"last_attempt_at":"2026-11-28 09:47:10+00","created_at":"2026-11-28 09:12:00+00"}},{"name":"Given up","text":"Eight attempts, and no answer to the last one, so `response_code` is empty. The sender has stopped trying.","values":{"id":329760,"organization_id":31,"event_name":"attendee.checked_in","target_url":"https://crm.example.com/hooks/showpass","payload":{"event":"attendee.checked_in","data":{"id":"7a1d4e92-3b6f-4c08-a5e7-2f9b1c6d8e30"}},"status":"failed","attempt_count":8,"response_code":null,"last_attempt_at":"2026-11-27 23:58:40+00","created_at":"2026-11-26 21:30:05+00"}},{"name":"Not tried yet","text":"Just created when event 3112 was cancelled. No attempt yet, so the attempt columns are still at their starting values.","values":{"id":331102,"organization_id":12,"event_name":"event.cancelled","target_url":"https://hooks.example.com/showpass","payload":{"event":"event.cancelled","data":{"id":"d5c8a3f1-6e2b-4907-8b4d-1a9e7c0f2b65"}},"status":"pending","attempt_count":0,"response_code":null,"last_attempt_at":null,"created_at":"2026-11-28 08:00:03+00"}}],"scenarios":[{"title":"The organizer's server is down for a while","text":["Organization 27's server is down when an event is published. The first attempt gets `503`, and the row becomes `failed`.","The retry worker tries again, waiting longer each time. The fourth attempt gets `200`, and the row is `delivered`."],"steps":["pending","failed","delivered"],"values":{"status":"delivered","attempt_count":4,"response_code":200}},{"title":"A month later","text":"Once a row is more than 30 days old, the nightly purge deletes it, whatever its status.","steps":["delivered","deleted by the nightly purge"]}]}}},"values":{"audit_log.action":{"values":["created","updated","deleted","published","cancelled","refunded","role_changed"],"note":"This list lives in `app/services/audit.rb`, not in the database. The column accepts any text, so a typo is stored happily."},"notifications.channel":{"values":["email","sms","push"],"note":"Set from the `Channel` union in `app/notifications/`. The database accepts any text."},"refunds.reason":{"values":["requested_by_buyer","event_cancelled","duplicate","fraud"],"hints":{"event_cancelled":"Written by the cancellation job, not by a person","fraud":"Also closes the order and voids its attendees"},"note":"Application list, from `app/models/refund.rb`. The database does not restrict it."},"webhook_deliveries.event_name":{"values":["order.paid","order.refunded","event.published","event.cancelled","attendee.checked_in"],"note":"The published webhook catalogue, from `app/webhooks/catalogue.rb`. New names are added here as features ship; the database accepts any text."}},"indexes":{"attendees_event_email_idx":"Find a buyer's tickets at the door when they have lost the barcode","attendees_ticket_type_idx":"Keeps the `restrict` check on ticket types cheap","audit_log_entity_idx":"The history panel on one row, newest first","audit_log_org_created_idx":"The organization-wide activity feed","check_ins_event_scanned_idx":"The live door feed during an event","check_ins_one_ok_per_attendee":"Stops the same ticket being admitted twice, even from two gates at once","discount_codes_live_idx":"The codes a checkout may still accept","events_on_sale_idx":"The public listing of what is on sale next","events_org_starts_idx":"The organizer dashboard: our events, soonest first","notifications_queued_idx":"The send worker's queue","order_lines_ticket_type_idx":"Keeps the `restrict` check on ticket types cheap","orders_buyer_email_lower_idx":"Support looking up a guest order by email","orders_event_placed_idx":"An event's sales list, newest first, baskets excluded","orders_expiring_carts_idx":"The sweeper that releases held tickets","org_members_pending_idx":"Outstanding invitations for one organization","org_members_user_idx":"Which organizations one person can act for","organizations_live_idx":"Resolving a slug from the public URL","payments_order_idx":"Every attempt against one order, for the support view","payments_unbatched_idx":"What the next payout batch should sweep up","ticket_types_available_idx":"The ticket page: what is still buyable, in display order","user_devices_user_idx":"The push tokens for one person, most recent first","users_email_lower_key":"Sign-in by email, case-insensitively","users_last_seen_idx":"Recently active accounts, for support and for the activity report","waitlist_entries_waiting_idx":"The release job: who is next for this event","webhook_deliveries_retry_idx":"The retry worker's queue"},"checks":{"attendees_status_check":"A ticket's status is one of the four known values","check_ins_result_check":"A scan result is one of the four known values","discount_codes_kind_check":"A code is a percentage or an amount","discount_codes_shape_check":"A percentage code has a percentage, an amount code has an amount","discount_codes_window_check":"A code's window ends after it starts","event_sessions_time_check":"A session ends after it starts","events_doors_check":"Doors never open after the event starts","events_status_check":"An event's status is one of the five known values","events_time_check":"An event ends after it starts","notifications_status_check":"A message's status is one of the four known values","order_lines_quantity_check":"An order line is for at least one ticket","order_lines_total_check":"A line total is the unit price times the quantity","orders_amounts_check":"No part of an order's money is negative","orders_status_check":"An order's status is one of the seven known values","orders_total_check":"An order's total is subtotal − discount + fee","org_members_role_check":"A membership role is one of the five known values","organizations_fee_bps_check":"The platform fee is between 0 and 20 percent","organizations_plan_check":"An organization's plan is one of the three known values","payments_amount_check":"A charge is for more than nothing","payments_status_check":"A payment's status is one of the four known values","payout_batches_net_check":"A payout's net is its gross minus its fees","payout_batches_period_check":"A payout period ends on or after it starts","payout_batches_status_check":"A payout's status is one of the four known values","refunds_amount_check":"A refund is for more than nothing","refunds_status_check":"A refund's status is one of the three known values","seating_zones_capacity_check":"A zone holds at least one person","ticket_types_kind_check":"A ticket type is one of the four known kinds","ticket_types_max_per_order_check":"A basket may hold at least one of each type","ticket_types_price_check":"A ticket price is never negative","ticket_types_quantity_check":"Tickets sold never pass tickets available","user_devices_platform_check":"A device platform is one of the three known values","users_email_check":"An email address has something before the @","venues_capacity_check":"A venue holds at least one person, or says nothing","waitlist_entries_quantity_check":"A waitlist entry asks for 1 to 10 tickets","waitlist_entries_status_check":"A waitlist entry's status is one of the four known values","webhook_deliveries_attempt_check":"An attempt count never goes below zero","webhook_deliveries_status_check":"A delivery's status is one of the three known values"},"tour":[{"title":"The database in one sentence","text":["One PostgreSQL database runs the whole ticketing platform: **{tables} tables**, grouped into **{areas} areas**.","Read it as a shop. An organizer lists an event, a buyer fills a basket, money moves, and someone scans a barcode at the door."],"visual":"areas"},{"title":"Everything belongs to an organization","text":["`organizations` is the tenant. {in:organizations} links from {inFrom:organizations} tables point to it, more than to any other table.","`org_members` says who may act for one. It has no id of its own: the pair of organization and user *is* the key, so one person holds one role per organization."],"tables":["organizations","org_members","users","user_devices"]},{"title":"An organization can own another one","text":["`organizations.parent_org_id` points back at `organizations`. A venue group uses it for its sub-accounts, which share billing.","Delete a parent and the children stay, with `parent_org_id` cleared. Nothing cascades."],"tables":["organizations"]},{"title":"Where an event happens","text":["A venue belongs to one organization. `seating_zones` splits the room into named parts, which reserved ticket types point at.","Deleting a venue is refused while any event still points at it. Deleting the organization takes its venues with it."],"tables":["venues","seating_zones"]},{"title":"An event's life","text":["`events.status` is the one column that decides whether the public can see the event and whether tickets can be bought.","`cancelled` can be reached from any step, and is never a delete: the row has to survive so its tickets and payments still make sense."],"visual":{"kind":"flow","steps":["draft","on_sale","sold_out","completed"]},"tables":["events"]},{"title":"What an event sells","text":["`ticket_types` is the thing a buyer actually puts in a basket: a name, a price and a quantity. `event_sessions` only exists for events that run more than once.","`discount_codes` can hang off one event or off the whole organization."],"tables":["ticket_types","event_sessions","discount_codes"]},{"title":"A basket becomes an order","text":["A basket is a real `orders` row from the first ticket added, so held stock is visible to everyone. `status = 'cart'` keeps it out of every report.","`order_lines` has a composite primary key: `(order_id, line_no)`. Line numbers start at 1 inside an order and are never reused."],"visual":{"kind":"flow","steps":["cart","pending","paid"]},"tables":["orders","order_lines"]},{"title":"One row per ticket, with a name on it","text":["Buying three tickets on one line creates three `attendees` rows. That is where the barcode lives, and the only id the door app ever sees.","`attendees` points at `order_lines` with **two** columns at once, because the line it came from needs both."],"visual":{"kind":"table","head":["Column","Example","Who sees it"],"rows":[["id","81422","Only the server"],["public_id","3c9f…b104","The buyer's app"],["barcode","SP-7H2K-9QX4","The door scanner"]],"prose":[2]},"tables":["attendees"]},{"title":"What happens when something is deleted","text":["Every link says what happens to a row when the row it points at is deleted. There are three answers, and the schema uses all three."],"visual":{"kind":"rules","cascade":"An event's ticket types, sessions and attendees go with it. {cascade} links work this way.","setnull":"A deleted staff account leaves its check-ins in place with `checked_in_by` empty. {setnull} links.","restrict":"An order with a payment against it refuses to be deleted. {restrict} links."},"tables":["events","check_ins","orders","payments"]},{"title":"Money in, money out","text":["`payments` is one row per *attempt*, so a failed card is a row too. At most one of them succeeded.","`refunds` can be partial and can be several per payment. `payout_batches` sweeps succeeded payments into one transfer to the organizer."],"tables":["payments","refunds","payout_batches"]},{"title":"At the door, and in the queue","text":["`check_ins` records every scan, including the ones turned away, so a disputed night can be read back. A unique index allows only one `ok` scan per ticket.","`waitlist_entries` is the queue for a sold-out type. An offer holds stock until it expires, then moves to the next person."],"tables":["check_ins","waitlist_entries"]},{"title":"Where to go next","text":["`notifications`, `webhook_deliveries` and `audit_log` are the platform's own record of what it sent and who changed what. None of them is read by the app itself.","Explore walks the areas table by table. Reference has every link, every index and every rule in one list."],"visual":"next"}],"reference":[{"id":"conventions","title":"Conventions","desc":"The patterns nearly every table follows","sections":[{"items":[{"title":"Internal keys","text":"`id bigint GENERATED ALWAYS AS IDENTITY`. For joins only, and **never sent to a client**."},{"title":"Public keys","text":"`public_id uuid` on every row a client can name, so nothing can be guessed or counted from a URL."},{"title":"Slugs","text":"`organizations.slug` and `events.slug` name those rows in public URLs. Event slugs are unique inside the organization, not globally."},{"title":"Money","text":"Integer cents plus a `char(3)` currency on the same row. No floats anywhere, and no implied currency."},{"title":"Timestamps","text":"`timestamptz`, always absolute. `events.timezone` and `venues.timezone` say how to show them. `updated_at` is set by the application, not by a trigger."},{"title":"Status columns","text":"`text` with `CHECK (… IN (…))`, so the database rejects an unknown value. The same lists are generated into `app/types/status.ts` by `rake schema:types`."},{"title":"Soft delete","text":"`deleted_at` on `organizations` and `users` only. Everything else is deleted for real or cancelled in place.","tables":["organizations","users"]},{"title":"Stored counts","text":"`ticket_types.quantity_sold` and `discount_codes.redemption_count` are moved inside the checkout transaction and repaired nightly. A CHECK stops `quantity_sold` passing `quantity_total`.","tables":["ticket_types","discount_codes"]},{"title":"Denormalised ids","text":"`attendees.event_id`, `check_ins.event_id` and `refunds.order_id` repeat an id that could be joined for. They exist so the door app and the finance reports stay on one table.","tables":["attendees","check_ins","refunds"]},{"title":"Ordered children","text":"`position` on `event_sessions`, `seating_zones` and `ticket_types`. Renumbered from 0 on every save, in one statement."},{"title":"Polymorphic references","text":"`audit_log.entity_type` and `audit_log.entity_id` have no foreign key on purpose, so the log outlives the rows it describes.","on":"audit_log"},{"title":"Cents, not currency maths","text":"Totals are checked by the database: `orders.total_cents` against its three parts, `order_lines.line_total_cents` against unit price and quantity, `payout_batches.net_cents` against gross and fees."}]}]},{"id":"lifecycle","title":"How data changes and expires","desc":"Status flows, the jobs that move them, and what is cleaned up","sections":[{"title":"Status flows","items":[{"title":"An event","steps":["draft","on_sale","sold_out","completed"],"text":"`cancelled` is reachable from any step. `sold_out` is set by the checkout job when the last ticket type fills, and back to `on_sale` when a refund frees stock.","on":"events"},{"title":"An order","steps":["cart","pending","paid"],"text":"Then `partially_refunded` or `refunded` as money goes back. `cancelled` is for an organizer cancelling, `expired` for the basket sweeper.","on":"orders"},{"title":"A ticket","steps":["issued","checked_in"],"text":"`transferred` means the name changed. `void` is set by a full refund or by a fraud case, and a void ticket is refused at the door.","on":"attendees"},{"title":"A waitlist entry","steps":["waiting","offered","converted"],"text":"`expired` when an offer is not taken before `expires_at`. The stock then moves to the next `waiting` row.","on":"waitlist_entries","tag":"new"}]},{"title":"Jobs that write to the database","items":[{"title":"Basket sweeper","text":"Hourly. Sets `orders.status = 'expired'` past `expires_at` and lowers `ticket_types.quantity_sold` by what the basket held.","where":"orders.status = 'cart' AND expires_at \u003c now()"},{"title":"Waitlist release","text":"Every five minutes. Offers freed stock to the oldest `waiting` entry and queues a notification.","where":"waitlist_entries.status = 'waiting'"},{"title":"Payout sweep","text":"Weekly. Opens a `payout_batches` row per organization and sets `payments.payout_batch_id` on the succeeded payments inside the period."},{"title":"Count repair","text":"Nightly. Recounts `ticket_types.quantity_sold` and `discount_codes.redemption_count` from the orders and corrects any drift."},{"title":"Purge","text":"Nightly. Removes `organizations` and `users` rows soft-deleted more than 30 days ago, `webhook_deliveries` older than 30 days, and `user_devices` unused for 90 days."}]},{"title":"What survives a delete","note":"Deleting a `users` row clears `orders.user_id` but keeps the order, its lines, its attendees and its payments. The buyer's email stays on the order, because a guest order has nothing else to find it by.","items":[{"title":"Deleting an organization","text":"Refused while it has events, orders, payments or payout batches. In practice organizations are soft-deleted instead.","on":"organizations"},{"title":"Deleting an event","text":"Takes its sessions, ticket types, discount codes, attendees, check-ins and waitlist with it. Refused while it has orders.","on":"events"},{"title":"Deleting an order","text":"Takes its lines and their attendees and check-ins. Refused while a payment or refund points at it.","on":"orders"}]}]},{"id":"links","title":"All links between tables","desc":"Every foreign key ({links}) and what deleting does","builtin":"links"},{"id":"indexes","title":"Indexes","desc":"What is indexed, and for which screen","builtin":"indexes"},{"id":"checks","title":"Rules the database enforces","desc":"Every CHECK, in plain words","builtin":"checks"}]}}</script>
<script>/* ============================================================
   Data. `facts` is read from the database; `guide` is the text
   written for people. The adapter turns both into the structures
   the views below use (DOMAINS, TABLES, INDEXES, TOUR, REF…).
   ============================================================ */
const DATA = typeof SCHEMA_GUIDE_DATA !== 'undefined' ? SCHEMA_GUIDE_DATA : JSON.parse(document.getElementById('schema-guide-data').textContent);
const FACTS = DATA.facts || { tables: [] };
const GUIDE = DATA.guide || {};
const PROJECT = { name: 'This project', code: ['sql'], ...(GUIDE.project || {}) };

const LABELS = {

const CODE_NAME = { sql: 'SQL', kysely: 'Kysely', knex: 'Knex' };

function escHtml(s) {

    .replace(/`([^`]+)`/g, (_, c) => `\u0001${code.push(c) - 1}\u0001`)
    .replace(/\[\[([^\]\s]+)\]\]/g, (_, t) => `<a class="t" href="#table/${t}">${t}</a>`)
    .replace(/\[([^\]]+)\]\((#[^)\s]*)\)/g, '<a href="$2">$1</a>')

    .replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, '$1<em>$2</em>');

const SLUG = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'area';

const RULE_OF_FK = (f) => (f.enforced === false ? 'dangle' : RULE_OF(f.onDelete));

/* ---------- Areas: from the guide, else grouped by name prefix ---------- */
const MAP_VIEWS = new Set(['all', 'layers', 'ownership', 'hubs', 'values', 'table']);
/** Area ids are routes (#explore/<id>, #diagram/<id>), so keep them clear of the fixed map views. */
const AREA_ID = (raw) => {
  const id = SLUG(raw);

};
const AREAS_RAW = (() => {

  let areas = (GUIDE.areas || []).map((a) => ({
    id: a.id ? (MAP_VIEWS.has(a.id) ? `${a.id}-area` : a.id) : AREA_ID(a.name),
    name: a.name,
    desc: a.desc || '',
    tables: (a.tables || []).filter((n) => names.includes(n)),
  }));
  if (!areas.length) {
    const groups = new Map();
    for (const n of names) {
      const p = n.split(/[_.]/)[0];
      if (!groups.has(p)) groups.set(p, []);
      groups.get(p).push(n);
    }
    const big = [...groups].filter(([, l]) => l.length > 1);
    areas = big.length >= 2 && big.length <= 12
      ? big.map(([p, l]) => ({ id: AREA_ID(p), name: p.charAt(0).toUpperCase() + p.slice(1), desc: `Tables whose names start with \`${p}\`.`, tables: l }))
      : [{ id: 'everything', name: 'All tables', desc: `Every table in the ${PROJECT.name} database.`, tables: names }];
  }
  const placed = new Set(areas.flatMap((a) => a.tables));
  const rest = names.filter((n) => !placed.has(n));

const DOMAINS = AREAS_RAW.map((a) => ({ id: a.id, name: md(a.name), desc: md(a.desc) }));
const AREA_INDEX = Object.fromEntries(DOMAINS.map((d, i) => [d.id, i]));
const AREA_OF = Object.fromEntries(AREAS_RAW.flatMap((a) => a.tables.map((n) => [n, a.id])));

/* ---------- The hub: the table most other tables point to ---------- */
const HUB = (() => {
  const has = (n) => FACTS.tables.some((t) => t.name === n);
  if (GUIDE.hub !== undefined) return GUIDE.hub && has(GUIDE.hub) ? GUIDE.hub : null;
  const refs = new Map();
  for (const t of FACTS.tables) for (const f of t.foreignKeys || []) if (f.table !== t.name) refs.set(f.table, (refs.get(f.table) || new Set()).add(t.name));
  let best = null;
  let n = 0;
  for (const [k, s] of refs) if (s.size > n) [best, n] = [k, s.size];

const HUB_AREA = HUB ? AREA_OF[HUB] : null;

/* ---------- Tables ---------- */
const BADGE_DEFAULTS = {

  'soft delete': 'Deleting hides a row at once (<code>deleted_at</code>); it is removed for good later.',
  'stored counts': 'Counts are stored on the row instead of counted on every view.',
  'composite PK': 'The key is a set of columns, so the same combination can only appear once.',
  'self-reference': 'Rows can point to other rows of the same table.',

function autoBadges(ft) {

    cols.includes('public_id') && 'public_id',
    cols.includes('deleted_at') && 'soft delete',
    cols.some((c) => /_count$/.test(c)) && 'stored counts',
    (ft.primaryKey || []).length > 1 && 'composite PK',
    (ft.foreignKeys || []).some((f) => f.table === ft.name) && 'self-reference',
    cols.some((c) => c === 'position' || c === 'sort_order') && 'ordered',
    cols.includes('slug') && 'slug',

}

  const list = (l) => l.slice(0, 3).map((p) => `<code>${escHtml(p)}</code>`).join(l.length === 2 ? ' and ' : ', ');
  if ((ft.primaryKey || []).length > 1 && parents.length >= 2) return `Links ${list(parents)} rows.`;
  if (parents.length) return `Points to ${list(parents)}.`;

}
const NULLABLE = new Set();
/** A table gets the Examples tab only when its guide entry has something to put in it. */
function hasExamples(ex) {

}
const TABLES = (() => {

  const order = AREAS_RAW.flatMap((a) => a.tables);
  return order.map((name) => {
    const ft = FACTS.tables.find((t) => t.name === name);
    const gt = g[name] || {};
    const pk = new Set(ft.primaryKey || []);
    const uniq = new Set((ft.uniques || []).filter((u) => u.length === 1).map((u) => u[0]));
    const fkCols = new Set((ft.foreignKeys || []).flatMap((f) => f.columns));
    const notNull = new Map(ft.columns.map((c) => [c.name, !!c.notNull]));
    // Database order, unless the guide lists every column of this table: then its key order wins.
    const named = gt.columns ? Object.keys(gt.columns) : [];
    const whole = named.length === ft.columns.length && ft.columns.every((c) => named.includes(c.name));
    const rank = (n) => (whole ? named.indexOf(n) : ft.columns.findIndex((c) => c.name === n));
    const fks = [...(ft.foreignKeys || [])].sort((a, b) => rank(a.columns[0]) - rank(b.columns[0])).map((f) => {
      const c = f.columns.join(', ');
      if (f.columns.some((x) => !notNull.get(x))) NULLABLE.add(`${name}.${c}`);
      return { c, cols: f.columns, to: f.table, refCols: f.refColumns && f.refColumns.length ? f.refColumns : ['id'], d: RULE_OF_FK(f), soft: f.enforced === false };

      let note = '';
      if (gt.columns && gt.columns[c.name] != null) note = md(gt.columns[c.name]);
      else if (!gt.columns && c.values && c.values.length) note = c.values.map(escHtml).join(' · ');
      return { n: c.name, t: c.type, k: k || undefined, note, isNew: hlCols.has(`${name}.${c.name}`), values: c.values };

/* ---------- Indexes, checks ---------- */
const INDEXES = (() => {
  const gi = GUIDE.indexes || {};

  for (const name of AREAS_RAW.flatMap((a) => a.tables)) {

    const order = Object.keys(gi);

      out.push({
        t: [name],
        name: i.name,
        purpose: gi[i.name] ? md(gi[i.name]) : escHtml(auto),
        idx: `${i.unique ? 'unique ' : ''}${i.name} (${cols})${i.where ? ` WHERE ${i.where}` : ''}`,

const ALL_CHECKS = FACTS.tables.flatMap((t) => (t.checks || []).filter((c) => !c.column).map((c) => ({ table: t.name, ...c })));

/* ---------- Text helpers used by the tour and the reference ---------- */
/** Numbers in guide text: {tables} {areas} {links} {cascade} {setnull} {restrict} {hub} {in:t} {inFrom:t} {out:t} {outTo:t}. */
function tokens(s) {
  return s
    .replace(/\{(tables|areas|links|cascade|setnull|restrict|hub)\}/g, (_, k) =>
      k === 'hub' ? (HUB ? `<code>${HUB}</code>` : '') : { tables: TABLES.length, areas: DOMAINS.length, links: EDGES.length, ...counts }[k],
    )
    .replace(/\{(in|inFrom|out|outTo):([\w.$-]+)\}/g, (_, k, n) =>
      k === 'in' ? into(n).length : k === 'inFrom' ? new Set(into(n).map((e) => e.from)).size : k === 'out' ? outOf(n).length : new Set(outOf(n).map((e) => e.to)).size,
    );
}
const rich = (s) => tokens(md(s));

    .join('')}</tbody></table>`;

/* ---------- Tour ---------- */
function autoTour() {

    { title: 'The database in one sentence', text: [`The ${PROJECT.name} database has **{tables} tables**, grouped into **{areas} areas**.`, 'This tour shows one idea at a time. You don’t need to remember table names yet.'], visual: 'areas' },
    { title: 'What happens when something is deleted', text: ['Every link between tables says what happens to a row when the row it points to is deleted. There are only three answers.'], visual: 'rules' },
  ];
  if (HUB) steps.push({ title: `\`${HUB}\` is at the centre`, text: [`{in:${HUB}} links from {inFrom:${HUB}} tables point to \`${HUB}\`, more than to any other table.`], tables: [HUB] });
  for (const a of AREAS_RAW) steps.push({ title: a.name, text: [a.desc], tables: a.tables.slice(0, 8) });
  steps.push({ title: 'You’ve seen the whole shape', text: ['From here, open any area to see its tables, then open a table to see its columns and links one tab at a time.', 'Reference has the detailed lists.'], visual: 'next' });

}
function tourVisual(v) {
  const kind = typeof v === 'string' ? v : v.kind;
  if (kind === 'areas') return `<ul class="areas">${DOMAINS.map((d) => `<li><a href="#explore/${d.id}">${d.name}</a><span>${count(tablesIn(d.id).length, 'table', 'tables')}</span></li>`).join('')}</ul>`;

const count = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const tlink = (n) => `<a class="t" href="#table/${n}">${n}</a>`;
const chips = (names) => `<div class="chips">${names.map((n) => `<a class="chip" href="#table/${n}">${n}</a>`).join('')}</div>`;
const flow = (steps) => `<div class="flow">${steps.map((s) => `<b>${s}</b>`).join('<i aria-hidden="true">→</i>')}</div>`;
const crumbs = (parts) =>
  `<nav class="crumbs" aria-label="Breadcrumb">${parts
    .map(([label, href]) => (href ? `<a href="${href}">${label}</a>` : `<span>${label}</span>`))
    .join('<span aria-hidden="true">›</span>')}</nav>`;

const RULE_NAME = { cascade: 'Deleted too', setnull: 'Kept, link cleared', restrict: 'Delete refused', dangle: 'Not enforced' };
const counts = { cascade: 0, setnull: 0, restrict: 0, dangle: 0 };
EDGES.forEach((e) => counts[e.d]++);

/** "This table points to X": what happens to this row when the row it points to is deleted. */
function outSentence(e) {
  if (e.d === 'dangle') {
    return `Each row points to one ${tlink(e.to)} row through <code>${e.col}</code>.<small>The database doesn't enforce this link: if that ${e.to} row is deleted, <code>${e.col}</code> keeps pointing at a row that no longer exists.</small>`;
  }
  const then = {
    cascade: 'this row is deleted with it',
    setnull: `this row stays and <code>${e.col}</code> is cleared`,
    restrict: 'the delete is refused while this row exists',
  }[e.d];
  return `Each row points to one ${tlink(e.to)} row through <code>${e.col}</code>.<small>If that ${e.to} row is deleted, ${then}.</small>`;
}
/** "X points to this table": what happens to X's rows when a row here is deleted. */
function inSentence(e) {
  if (e.d === 'dangle') {
    return `${tlink(e.from)} points here through <code>${e.col}</code>.<small>The database doesn't enforce this link: a row here can be deleted while ${e.from} rows still point at it.</small>`;
  }
  const then = {
    cascade: `its ${e.from} rows are deleted too`,
    setnull: `its ${e.from} rows stay, with <code>${e.col}</code> cleared`,
    restrict: `it can't be deleted while ${e.from} rows use it`,
  }[e.d];
  return `${tlink(e.from)} points here through <code>${e.col}</code>.<small>If a row here is deleted, ${then}.</small>`;
}
const legend = () =>
  `<div class="legend"><span style="--c:var(--cascade)">Deleted too</span><span style="--c:var(--setnull)">Kept, link cleared</span><span style="--c:var(--restrict)">Delete refused</span>${
    counts.dangle ? '<span style="--c:var(--dangle)">Not enforced</span>' : ''
  }</div>`;

/** Plain meanings for the tags on tables, shown under "Good to know". */
const BADGE_HELP = buildBadgeHelp();

/* ============================================================
   The tour: one idea per step
   ============================================================ */
const TOUR = buildTour();

function viewTour(stepParam) {
  const i = Math.min(Math.max((parseInt(stepParam, 10) || 1) - 1, 0), TOUR.length - 1);
  const step = TOUR[i];
  const cells = TOUR.map(
    (s, k) => `<a href="#tour/${k + 1}" class="${k < i ? 'done' : k === i ? 'now' : ''}" aria-label="Step ${k + 1}: ${esc(s.title)}"${k === i ? ' aria-current="step"' : ''}></a>`,
  ).join('');
  return `<section class="tour">
    <div class="row-progress" style="--n:${TOUR.length}">${cells}</div>
    <p class="step-count">Step ${i + 1} of ${TOUR.length}</p>
    <h1>${step.title}</h1>
    ${step.text.map((p) => `<p class="lede">${p}</p>`).join('')}
    ${step.visual ? `<div class="visual">${step.visual()}</div>` : ''}
    ${step.tables ? `<div class="visual"><p class="hint">Tables in this step</p>${chips(step.tables)}</div>` : ''}
    <div class="tour-nav">
      <a class="btn" href="#tour/${i}" ${i === 0 ? 'aria-disabled="true" tabindex="-1"' : ''}>Back</a>
      ${i < TOUR.length - 1 ? `<a class="btn primary" href="#tour/${i + 2}">Next</a>` : `<a class="btn primary" href="#explore">Explore the tables</a>`}
    </div>
  </section>`;
}

/* ============================================================
   Home, Explore, areas, tables
   ============================================================ */
function viewHome() {
  return `<section>
    <h1>${HEADLINE}</h1>
    ${UNVERIFIED}
    <p class="lede">${
      INFERRED
        ? `${count(TABLES.length, 'proposed table', 'proposed tables')}, grouped the way the app already works. Start with the tour to see the shape of it.`
        : `${count(TABLES.length, 'table holds', 'tables hold')} everything the app stores. If this is new to you, start with the tour.`
    }</p>
    <div class="paths">
      <a class="path primary" href="#tour/1"><b>Take the tour</b><span>${TOUR.length} short steps, one idea each</span></a>
      <a class="path" href="#explore"><b>Explore the tables</b><span>Pick an area, then open any table</span></a>
      ${REF_TOPICS.length ? `<a class="path" href="#ref"><b>Look something up</b><span>${LABELS.lookup}</span></a>` : ''}
    </div>
  </section>`;
}

function viewExplore() {
  return `<section>
    <h1>Explore the tables</h1>
    <p class="lede">The tables are grouped into ${DOMAINS.length} areas. Open one to see what it holds.</p>
    <label class="hint" for="find">Or find a table or column by name</label>
    <input id="find" class="search" type="search" placeholder="For example: user_id, papers, note   (press / to search)" autocomplete="off" spellcheck="false">
    <div id="results">${areaList()}</div>
  </section>`;
}

function areaList() {
  return `<ul class="list">${DOMAINS.map(
    (d) => `<li><a class="item" href="#explore/${d.id}"><b>${d.name}</b><span>${d.desc}</span><small>${count(tablesIn(d.id).length, 'table', 'tables')}</small></a></li>`,
  ).join('')}</ul>`;
}

function searchResults(q) {
  const hits = TABLES.map((t) => ({ t, cols: t.columns.filter((c) => c.n.includes(q)).map((c) => c.n) })).filter(
    ({ t, cols }) => t.name.includes(q) || cols.length,
  );
  if (!hits.length) return `<p class="empty">No table or column contains “${esc(q)}”. Try part of a name, such as <code>user</code>.</p>`;
  return `<ul class="list">${hits
    .map(
      ({ t, cols }) =>
        `<li><a class="item" href="#table/${t.name}"><b class="t">${t.name}</b><span>${t.purpose}</span>${
          cols.length ? `<small>Columns: ${cols.slice(0, 5).join(', ')}${cols.length > 5 ? ` and ${cols.length - 5} more` : ''}</small>` : ''
        }</a></li>`,
    )
    .join('')}</ul>`;
}

function viewArea(id) {
  const d = domainById[id];
  if (!d) return viewNotFound();
  const list = tablesIn(id);
  return `<section>
    ${crumbs([['Explore', '#explore'], [d.name]])}
    <h1>${d.name}</h1>
    <p class="lede">${d.desc}</p>
    <ul class="list block">${list
      .map(
        (t) =>
          `<li><a class="item" href="#table/${t.name}"><b class="t">${t.name}</b><span>${t.purpose}</span><small>${count(t.columns.length, 'column', 'columns')}${
            t.isNewTable ? `, ${HL.short}` : ''
          }</small></a></li>`,
      )
      .join('')}</ul>
    ${areaPager(id)}
  </section>`;
}

const TABS = [
  ['about', 'About'],
  ['columns', 'Columns'],
  ['examples', 'Examples'],
  ['links', 'Links'],
  ['indexes', 'Indexes'],
];

function viewTable(name, tab = 'about') {
  const t = byName[name];
  if (!t) return viewNotFound();
  // Examples is the one tab a table can lack: only tables whose guide has examples show it.
  const tabs = TABS.filter(([key]) => key !== 'examples' || t.examples);
  if (!tabs.some(([key]) => key === tab)) tab = 'about';
  const d = domainById[t.domain];
  const idx = INDEXES.filter((i) => i.t.includes(t.name));
  const linkCount = outOf(name).length + into(name).length;
  const label = { about: 'About', columns: `Columns (${t.columns.length})`, examples: 'Examples', links: `Links (${linkCount})`, indexes: `Indexes (${idx.length})` };
  const panel = { about: panelAbout, columns: panelColumns, examples: panelExamples, links: panelLinks, indexes: panelIndexes }[tab](t, idx);
  const nextTab = tabs[tabs.findIndex(([key]) => key === tab) + 1];
  return `<section>
    ${crumbs([['Explore', '#explore'], [d.name, `#explore/${d.id}`], [t.name]])}
    <h1 class="table-title">${t.name}</h1>
    <p class="lede">${t.purpose}</p>
    <nav class="tabs" aria-label="About this table">${tabs.map(
      ([key]) => `<a href="#table/${name}/${key}"${key === tab ? ' aria-current="page"' : ''}>${label[key]}</a>`,
    ).join('')}</nav>
    ${panel}
    ${nextTab ? `<p class="next"><a href="#table/${name}/${nextTab[0]}">Next: ${label[nextTab[0]]}</a></p>` : `<p class="next"><a href="#explore/${d.id}">Back to ${d.name}</a></p>`}
    ${tablePager(t)}
  </section>`;
}

function panelAbout(t) {
  const out = new Set(outOf(t.name).map((e) => e.to));
  const inc = new Set(into(t.name).map((e) => e.from));
  const facts = [
    `In <a href="#explore/${t.domain}">${domainById[t.domain].name}</a>`,
    `<b>${t.columns.length}</b> columns`,
    `Points to <b>${out.size}</b> ${out.size === 1 ? 'table' : 'tables'}`,
    `<b>${inc.size}</b> ${inc.size === 1 ? 'table points' : 'tables point'} to it`,
  ];
  const know = [
    ...(t.isNewTable ? [HL.note] : []),
    ...(t.badges || []).filter((b) => BADGE_HELP[b]).map((b) => BADGE_HELP[b]),
    ...(t.checks || []).map((c) => `The database checks: ${c}`),
    ...(t.notes || []),
  ];
  return `<ul class="facts">${facts.map((f) => `<li>${f}</li>`).join('')}</ul>
    ${know.length ? `<h2>Good to know</h2><ul class="know">${know.map((k) => `<li>${k}</li>`).join('')}</ul>` : ''}`;
}

function keyPills(c, t) {
  const pills = [];
  const k = c.k || '';
  if (k.includes('pk')) pills.push('<span class="pill key">primary key</span>');
  if (k.includes('u')) pills.push('<span class="pill">unique</span>');
  const fk = (t.fks || []).find((f) => (f.cols || [f.c]).includes(c.n));
  if (fk) pills.push(`<span class="pill">links to ${fk.to}</span>`);
  if (c.isNew) pills.push(`<span class="pill new">${HL.label}</span>`);
  return pills.join('');
}

function panelColumns(t) {
  const pointer = t.examples
    ? `<p class="hint ex-pointer">Not sure what a column holds? <a href="#table/${t.name}/examples">Examples</a> explains each one in plain words, with sample values and rows.</p>`
    : '';
  return `${pointer}<ul class="cols">${t.columns
    .map(
      (c) =>
        `<li><div class="col-head"><span class="t">${c.n}</span><span class="type">${esc(c.t || '')}</span>${keyPills(c, t)}</div>${c.note ? `<p>${c.note}</p>` : ''}</li>`,
    )
    .join('')}</ul>`;
}

function panelLinks(t) {
  const out = outOf(t.name).filter((e) => e.to !== t.name);
  const self = outOf(t.name).filter((e) => e.to === t.name);
  const inc = into(t.name).filter((e) => e.from !== t.name);
  const outHtml = out.length
    ? `<ul class="links">${out.map((e) => `<li class="${e.d}">${outSentence(e)}</li>`).join('')}</ul>`
    : `<p class="empty">This table doesn’t point to any other table.</p>`;
  let inHtml = `<p class="empty">No other table points here.</p>`;
  if (inc.length && inc.length <= 6) {
    inHtml = `<ul class="links">${inc.map((e) => `<li class="${e.d}">${inSentence(e)}</li>`).join('')}</ul>`;
  } else if (inc.length) {
    // Many links (users has 37): one folded group per area, so the page stays short.
    inHtml = DOMAINS.map((d) => {
      const rows = inc.filter((e) => byName[e.from].domain === d.id);
      if (!rows.length) return '';
      return `<details><summary>${d.name}<small>${count(rows.length, 'link', 'links')}</small></summary><div class="inner"><ul class="links">${rows
        .map((e) => `<li class="${e.d}">${inSentence(e)}</li>`)
        .join('')}</ul></div></details>`;
    }).join('');
  }
  return `${legend()}
    <h2>This table points to</h2><div class="block" style="margin-top:12px">${outHtml}</div>
    ${self.length ? `<p class="hint">It also points to itself through <code>${self.map((e) => e.col).join(', ')}</code>.</p>` : ''}
    <h2 class="block">Tables that point here</h2><div style="margin-top:12px">${inHtml}</div>`;
}

function panelIndexes(t, idx) {
  if (!idx.length) return `<p class="empty">${LABELS.indexesNone ? md(LABELS.indexesNone) : 'Only its primary key and unique columns are indexed. Nothing else was added.'}</p>`;
  return `<ul class="cols">${idx
    .map((i) => `<li><div class="col-head"><b>${i.purpose}</b>${i.isNew ? `<span class="pill new">${HL.label}</span>` : ''}</div><p><code>${esc(i.idx)}</code></p></li>`)
    .join('')}</ul>`;
}

/* ============================================================
   Examples (added): the table's columns in plain words, grouped,
   with the values they hold; made-up rows showing different
   situations; and short "what happens when" stories.
   Shown only for tables whose guide has `examples`.
   ============================================================ */
/** A sample value: NULL stands out, JSON stays JSON, everything else is plain text. */
function exValue(v) {
  if (v === null) return '<span class="ex-null">NULL</span>';
  if (typeof v === 'object') return `<code class="ex-json">${escHtml(JSON.stringify(v))}</code>`;
  return escHtml(String(v));
}
/** `examples` on a column: ["a", "b"], [["a", "meaning"]], or { "a": "meaning" }. */
function exPairs(given) {
  if (!given) return [];
  if (Array.isArray(given)) return given.map((x) => (Array.isArray(x) ? [String(x[0]), x[1] || ''] : [String(x), '']));
  if (typeof given === 'object') return Object.entries(given).map(([v, m]) => [v, m || '']);
  return [[String(given), '']];
}
function exColumn(t, c, entry, list) {
  const e = typeof entry === 'string' ? { means: entry } : entry || {};
  const pairs = exPairs(e.examples);
  const meaningOf = (v) => (pairs.find(([x]) => x === v) || [])[1] || '';
  const means = e.means ? md(e.means) : c.note;
  const row = ([v, m]) => `<li><code>${escHtml(v)}</code>${m ? `<span>${md(m)}</span>` : ''}</li>`;
  let vals = '';
  if (list) {
    // A value list from the schema (or the guide's own list): show every value, never a sample of them.
    const chipsHtml = `<div class="vals">${list.values
      .map((v, i) => `${i && list.flow ? `<i>${list.seps[i - 1] || '→'}</i>` : ''}<span class="val">${esc(v.v)}</span>`)
      .join('')}</div>`;
    const meant = list.values.map((v) => [v.v, meaningOf(v.v) || v.hint]).filter(([, m]) => m);
    // The chips carry the order of a flow, and name the values nobody explained; otherwise the list says it all.
    const showChips = list.flow || meant.length < list.values.length;
    vals = `<p class="ex-label">${list.flow ? 'Moves through' : 'Possible values'}</p>${showChips ? chipsHtml : ''}${
      meant.length ? `<ul class="ex-vals">${meant.map(row).join('')}</ul>` : ''
    }${list.hint ? `<p class="hint ex-list-note">${md(list.hint)}</p>` : ''}`;
  } else if (pairs.length && pairs.every(([, m]) => !m)) {
    vals = `<p class="ex-inline"><span class="ex-label">For example</span>${pairs.map(([v]) => `<code>${escHtml(v)}</code>`).join('')}</p>`;
  } else if (pairs.length) {
    vals = `<p class="ex-label">For example</p><ul class="ex-vals">${pairs.map(row).join('')}</ul>`;
  }
  return `<li><div class="col-head"><span class="t">${c.n}</span><span class="type">${esc(c.t || '')}</span>${keyPills(c, t)}</div>${means ? `<p>${means}</p>` : ''}${vals}</li>`;
}
function exStory(s) {
  const paras = (Array.isArray(s.text) ? s.text : [s.text]).filter(Boolean);
  const set = s.values && Object.keys(s.values).length
    ? `<p class="ex-label">The row then holds</p><dl class="ex-set">${Object.entries(s.values)
        .map(([c, v]) => `<dt>${escHtml(c)}</dt><dd>${exValue(v)}</dd>`)
        .join('')}</dl>`
    : '';
  return `<div class="ex-story">${s.title ? `<h3>${md(s.title)}</h3>` : ''}${paras.map((p) => `<p>${md(p)}</p>`).join('')}${
    s.steps && s.steps.length ? flow(s.steps.map(md)) : ''
  }${set}</div>`;
}
function panelExamples(t) {
  const ex = t.examples;
  const list = (x) => (Array.isArray(x) ? x : []);
  const lists = new Map(valueLists().filter((l) => l.table === t.name).map((l) => [l.column, l]));
  const byCol = new Map(t.columns.map((c) => [c.n, c]));
  // Each column in at most one group, in the order the guide gives; the rest go to "Other columns".
  const placed = new Set();
  const groups = list(ex.groups)
    .map((g) => {
      const cols = Object.keys(g.columns || {}).filter((n) => byCol.has(n) && !placed.has(n));
      cols.forEach((n) => placed.add(n));
      return { name: g.name ? md(g.name) : 'Columns', text: g.text, cols, entries: g.columns || {}, table: g.table, scenarios: list(g.scenarios) };
    })
    .filter((g) => g.cols.length || g.scenarios.length);
  if (groups.length) {
    const rest = t.columns.map((c) => c.n).filter((n) => !placed.has(n));
    if (rest.length) groups.push({ name: 'Other columns', text: '', cols: rest, entries: {}, table: null, scenarios: [] });
  }
  const intro = ex.intro
    ? `<p class="lede ex-intro">${md(ex.intro)}</p>`
    : `<p class="lede ex-intro">What each column holds, in plain words, with the kind of values you will find in it.</p>`;
  const overview = groups.length
    ? `<p class="hint">${count(t.columns.length, 'column', 'columns')} in ${count(groups.length, 'group', 'groups')}:</p>
      <ul class="ex-map">${groups
        .map((g) => `<li><b>${g.name}<small>${g.cols.length}</small></b><span>${g.cols.join(', ')}</span></li>`)
        .join('')}</ul>`
    : '';
  const groupHtml = groups
    .map((g) => {
      const text = (Array.isArray(g.text) ? g.text : [g.text]).filter(Boolean).map((p) => `<p>${md(p)}</p>`).join('');
      const cols = g.cols.length
        ? `<ul class="ex-cols">${g.cols.map((n) => exColumn(t, byCol.get(n), g.entries[n], lists.get(n))).join('')}</ul>`
        : '';
      const table = g.table ? `<div class="demo ex-demo">${demoTable(g.table)}</div>` : '';
      return `<section class="ex-group"><h2>${g.name}<small>${count(g.cols.length, 'column', 'columns')}</small></h2>${text}${cols}${table}${g.scenarios.map(exStory).join('')}</section>`;
    })
    .join('');
  const recs = list(ex.records).filter((r) => r && r.values && typeof r.values === 'object');
  const order = t.columns.map((c) => c.n);
  const recHtml = recs.length
    ? `<section class="ex-group"><h2>What rows look like<small>${count(recs.length, 'example', 'examples')}</small></h2>
      <p class="hint">Made-up rows that show what the columns hold in different situations. None of them were read from the database. <span class="ex-null">NULL</span> means the column is empty in that row.</p>
      ${recs.length > 1
        ? `<div class="ways ex-ways" role="tablist" aria-label="Example rows">${recs
            .map((r, i) => `<button type="button" class="way" role="tab" data-rec="${i}" aria-selected="${i === 0}"><b>${md(r.name || `Row ${i + 1}`)}</b></button>`)
            .join('')}</div>`
        : ''}
      ${recs
        .map((r, i) => {
          const cols = order.filter((n) => Object.prototype.hasOwnProperty.call(r.values, n));
          return `<div class="ex-rec" data-rec-panel="${i}"${i ? ' hidden' : ''}>${recs.length === 1 && r.name ? `<h3>${md(r.name)}</h3>` : ''}${r.text ? `<p>${md(r.text)}</p>` : ''}
            <div class="demo ex-table"><table><thead><tr><th>Column</th><th>Value</th></tr></thead><tbody>${cols
              .map((n) => `<tr><td>${n}</td><td>${exValue(r.values[n])}</td></tr>`)
              .join('')}</tbody></table></div></div>`;
        })
        .join('')}
    </section>`
    : '';
  const stories = list(ex.scenarios).filter(Boolean);
  const storyHtml = stories.length
    ? `<section class="ex-group"><h2>What happens when…<small>${count(stories.length, 'story', 'stories')}</small></h2>${stories.map(exStory).join('')}</section>`
    : '';
  return `${intro}${overview}${groupHtml}${recHtml}${storyHtml}`;
}
/* The example-row switcher on the Examples tab. */
document.addEventListener('click', (event) => {
  const button = event.target.closest && event.target.closest('[data-rec]');
  if (!button) return;
  const box = button.closest('.ex-group');
  box.querySelectorAll('[data-rec]').forEach((b) => b.setAttribute('aria-selected', String(b === button)));
  box.querySelectorAll('[data-rec-panel]').forEach((p) => {
    p.hidden = p.dataset.recPanel !== button.dataset.rec;
    if (!p.hidden) {
      p.classList.remove('panel-in');
      void p.offsetWidth;
      p.classList.add('panel-in');
    }
  });
});

/* ============================================================
   Reference: one topic per page
   ============================================================ */
const REF = buildRef();

function viewRef(topic) {
  if (!topic) {
    return `<section>
      <h1>Reference</h1>
      <p class="lede">Detailed lists, one topic per page.</p>
      <ul class="list block">${REF.map(([id, title, desc]) => `<li><a class="item" href="#ref/${id}"><b>${title}</b><span>${desc}</span></a></li>`).join('')}</ul>
    </section>`;
  }
  const entry = REF.find(([id]) => id === topic);
  if (!entry) return viewNotFound();
  const body = REF_PAGES[topic]();
  return `<section>${crumbs([['Reference', '#ref'], [entry[1]]])}<h1>${entry[1]}</h1><p class="lede">${entry[2]}.</p><div class="block">${body}</div>${refPager(topic)}</section>`;
}

const fold = (summary, inner, small = '') => `<details><summary>${summary}${small ? `<small>${small}</small>` : ''}</summary><div class="inner">${inner}</div></details>`;

const REF_PAGES = buildRefPages();

/* How much the page is allowed to claim:
   a live database > a schema written from real schema files > a shape inferred from application code. */
const SOURCE_KIND = (FACTS.source || {}).kind;
const INFERRED = SOURCE_KIND === 'inferred';
const FROM_FILES = SOURCE_KIND === 'files';
const INFERRED_FROM = (FACTS.source || {}).inferredFrom || 'the application code';

/** Shown big on Home: the reader cannot otherwise tell where any of this came from. */
const UNVERIFIED = INFERRED
  ? `<div class="noschema" role="note">
      <h2>${escHtml(PROJECT.name)} has no database.</h2>
      <p>Nothing on this page was read from one. There is no SQL schema, no migrations and no ORM model definitions in this project, so <b>every table, column and link below was proposed by reading ${md(INFERRED_FROM)}</b>.</p>
      <p><b>None of it exists yet.</b> Treat this as a design sketch for a database the project could have — not as a description of one it has. The delete rules, indexes and joins describe what <em>would</em> happen if someone built it this way.</p>
      <p class="what">Pages that describe behaviour — Delete impact, Join path, the maps — are therefore proposals too.</p>
    </div>`
  : FROM_FILES
    ? `<p class="unverified"><b>Written from schema files.</b> <span>This guide was built from the project's migrations and model definitions, not read from a running database. The live database may differ.</span></p>`
    : '';

/** Repeated on every other page, because people arrive by deep link, not through Home. */
const STRIP = INFERRED
  ? `<p class="strip"><b>Proposed schema.</b> ${escHtml(PROJECT.name)} has no database; these tables were inferred from ${md(INFERRED_FROM)} and do not exist. <a href="#home">What this means</a></p>`
  : FROM_FILES
    ? `<p class="strip soft"><b>Written from schema files</b>, not read from a running database. <a href="#home">What this means</a></p>`
    : '';

function linkGroups(rule) {
  const rows = EDGES.filter((e) => rule === 'all' || e.d === rule);
  const targets = [...new Set(rows.map((e) => e.to))].sort((a, b) => into(b).length - into(a).length || a.localeCompare(b));
  if (!targets.length) return `<p class="empty">No links of this kind.</p>`;
  return targets
    .map((to) => {
      const group = rows.filter((e) => e.to === to);
      return fold(`<span class="t">${to}</span>`, `<ul class="links">${group.map((e) => `<li class="${e.d}">${inSentence(e)}</li>`).join('')}</ul>`, count(group.length, 'link', 'links'));
    })
    .join('');
}

function viewNotFound() {
  return `<section><h1>Nothing here</h1><p class="lede">This page doesn’t exist. Go back to <a href="#home">Home</a> or <a href="#explore">Explore</a>.</p></section>`;
}

/* ============================================================
   Map: connected diagrams (added; the views above are unchanged)
   #diagram          the areas and how many links join them
   #diagram/<area>   one area's tables and the tables they link to
   #diagram/table/x  one table: what it points to, what points to it
   #diagram/all      every table at once
   ============================================================ */
const AREA_ORDER = DOMAINS.map((d) => d.id);
const areaColor = (id) => `var(--a${AREA_INDEX[id] % 12})`;
const tint = (id, pct = 12) => `color-mix(in srgb, var(--a${AREA_INDEX[id] % 12}) ${pct}%, var(--surface))`;
const TABLE_H = 30;
const tableW = (label) => Math.round(label.length * 7.8 + 26);

/** One line per pair of tables, even when they are linked by two columns (follows, notifications…). */
function pairEdges(edges) {
  const pairs = new Map();
  for (const e of edges) {
    const key = `${e.from}>${e.to}`;
    if (!pairs.has(key)) pairs.set(key, { from: e.from, to: e.to, d: e.d, cols: [] });
    pairs.get(key).cols.push(e.col);
  }
  return [...pairs.values()];
}

const RULE_SHORT = { cascade: 'deleted too', setnull: 'kept, link cleared', restrict: 'delete refused', dangle: 'not enforced by the database' };
const edgeTitle = (e) => `${e.from}.${e.cols.join(', ')} → ${e.to} (${RULE_SHORT[e.d]})`;

/** Where the line from `from` meets the border of box `to`, so arrows stay visible. */
function clipToBox(from, to) {
  const dx = from.x - to.x;
  const dy = from.y - to.y;
  if (!dx && !dy) return { x: to.x, y: to.y };
  const sx = (to.w / 2 + 4) / Math.abs(dx || 1e-9);
  const sy = (to.h / 2 + 4) / Math.abs(dy || 1e-9);
  const s = Math.min(sx, sy);
  return { x: to.x + dx * s, y: to.y + dy * s };
}

/**
 * A small, deterministic force layout: nodes repel, links pull, and each node is drawn toward
 * an anchor (its area's place), then overlapping boxes are pushed apart.
 */
function forceLayout(nodes, links, W, H, options = {}) {
  const iterations = options.iterations || 450;
  const length = options.length || 130;
  const repel = options.repel || 16000;
  const byId = new Map(nodes.map((n) => [n.id, n]));
  nodes.forEach((n, i) => {
    if (n.x == null) {
      const a = (i / nodes.length) * 2 * Math.PI;
      n.x = W / 2 + Math.cos(a) * W * 0.3;
      n.y = H / 2 + Math.sin(a) * H * 0.3;
    }
    n.vx = 0;
    n.vy = 0;
  });
  const pairs = links.map((l) => [byId.get(l.from), byId.get(l.to)]).filter(([a, b]) => a && b && a !== b);
  const clamp = (n) => {
    n.x = Math.max(n.w / 2 + 10, Math.min(W - n.w / 2 - 10, n.x));
    n.y = Math.max(n.h / 2 + 10, Math.min(H - n.h / 2 - 10, n.y));
  };
  for (let it = 0; it < iterations; it++) {
    const cool = 1 - it / iterations;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const d2 = dx * dx + dy * dy || 0.01;
        const d = Math.sqrt(d2);
        const f = repel / d2;
        dx /= d;
        dy /= d;
        a.vx -= dx * f;
        a.vy -= dy * f;
        b.vx += dx * f;
        b.vy += dy * f;
      }
    }
    for (const [a, b] of pairs) {
      let dx = b.x - a.x;
      let dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - length) * 0.02;
      dx /= d;
      dy /= d;
      a.vx += dx * f;
      a.vy += dy * f;
      b.vx -= dx * f;
      b.vy -= dy * f;
    }
    for (const n of nodes) {
      const [ax, ay, k] = options.anchor ? options.anchor(n) : [W / 2, H / 2, 0.01];
      n.vx += (ax - n.x) * k;
      n.vy += (ay - n.y) * k;
      n.x += Math.max(-30, Math.min(30, n.vx * cool));
      n.y += Math.max(-30, Math.min(30, n.vy * cool));
      n.vx *= 0.5;
      n.vy *= 0.5;
      clamp(n);
    }
  }
  for (let pass = 0; pass < 200; pass++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        const ox = (a.w + b.w) / 2 + 12 - Math.abs(a.x - b.x);
        const oy = (a.h + b.h) / 2 + 12 - Math.abs(a.y - b.y);
        if (ox > 0 && oy > 0) {
          moved = true;
          if (ox < oy * 2.5) {
            const s = ((a.x <= b.x ? -1 : 1) * ox) / 2;
            a.x += s;
            b.x -= s;
          } else {
            const s = ((a.y <= b.y ? -1 : 1) * oy) / 2;
            a.y += s;
            b.y -= s;
          }
          clamp(a);
          clamp(b);
        }
      }
    }
    if (!moved) break;
  }
}

/** Pushes overlapping boxes apart; nodes marked `fixed` don't move. */
function resolveOverlaps(nodes, gap = 12) {
  for (let pass = 0; pass < 300; pass++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        const ox = (a.w + b.w) / 2 + gap - Math.abs(a.x - b.x);
        const oy = (a.h + b.h) / 2 + gap - Math.abs(a.y - b.y);
        if (ox <= 0 || oy <= 0) continue;
        moved = true;
        const share = a.fixed ? [0, 1] : b.fixed ? [1, 0] : [0.5, 0.5];
        const dir = a.y <= b.y ? -1 : 1;
        a.y += dir * oy * share[0];
        b.y -= dir * oy * share[1];
      }
    }
    if (!moved) break;
  }
}

/** Draws boxes and lines. `viewBox` is "x y w h". Lines are drawn first so boxes sit on top. */
/** Markers, lines and boxes for a set of nodes and links (shared by the fixed maps and the canvas). */
function graphParts(nodes, links) {
  const byId = new Map(nodes.map((n) => [n.id, n]));
